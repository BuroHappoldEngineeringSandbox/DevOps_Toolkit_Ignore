name: Format

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-format
  cancel-in-progress: true

jobs:
  # dotnet format on PR diffs only; uses DevOps_Toolkit/.github/scripts/check-format-pr.sh + shared .editorconfig.
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Compute changed .NET files
        id: changed
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$base_sha"

          # Include all file types covered by .editorconfig rules:
          #   *.cs                        — file header, naming, code cleanliness
          #   *.csproj, *.props, *.targets — indent_size = 2 (project file section)
          git diff --name-only --diff-filter=ACMRT "$base_sha" HEAD \
            -- '*.cs' '*.csproj' '*.props' '*.targets' \
            > changed_dotnet_files.txt

          count=$(wc -l < changed_dotnet_files.txt | tr -d ' ')
          echo "count=$count" >> $GITHUB_OUTPUT

          if [ "$count" -gt 0 ]; then
            echo "::notice::$count .NET file(s) changed — running format check."
            cat changed_dotnet_files.txt
          else
            echo "::notice::No changed .NET files — format check skipped."
          fi

      - name: Checkout DevOps_Toolkit (format script)
        if: steps.changed.outputs.count != '0'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository_owner }}/DevOps_Toolkit
          ref: main
          path: _toolkit

      - name: Check formatting (changed files only)
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: bash _toolkit/.github/scripts/check-format-pr.sh
