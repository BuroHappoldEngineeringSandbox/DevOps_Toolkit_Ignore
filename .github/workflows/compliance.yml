name: Compliance (Reusable)

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version"
        type: string
        default: "8.0.x"

      configuration:
        description: "Build configuration"
        type: string
        default: "Release"

      rules:
        description: "List of compliance rules to run (one per line)"
        type: string
        default: ""

      sarif_name:
        description: "SARIF output filename"
        type: string
        default: "compliance.sarif"

      devops_toolkit_repo:
        description: "Repo containing ComplianceRunner"
        type: string
        default: "BuroHappoldEngineeringSandbox/DevOps_Toolkit"

      devops_toolkit_ref:
        description: "Branch/Ref of ComplianceRunner"
        type: string
        default: "main"

permissions:
  contents: read
  security-events: write

jobs:

  # ---------------------------------------------------------
  # Job 0: Build Test_Toolkit → extract CodeComplianceTest_Engine.dll
  # ---------------------------------------------------------
  build_test_toolkit:
    name: Build Test_Toolkit
    runs-on: windows-latest

    steps:
      - name: Checkout Test_Toolkit
        uses: actions/checkout@v4
        with:
          repository: BHoM/Test_Toolkit
          ref: develop
          path: test_toolkit

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Build CodeComplianceTest_Engine
        working-directory: test_toolkit/CodeComplianceTest_Engine
        shell: pwsh
        run: |
          dotnet restore --nologo
          dotnet build -c ${{ inputs.configuration }} --nologo

      - name: Locate CodeComplianceTest_Engine.dll
        id: dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "test_toolkit/CodeComplianceTest_Engine/bin/${{ inputs.configuration }}" `
            -Filter "CodeComplianceTest_Engine.dll" |
            Select-Object -First 1 -ExpandProperty FullName
          echo "dll=$dll" >> $env:GITHUB_OUTPUT

      - name: Upload Test_Toolkit DLL
        uses: actions/upload-artifact@v4
        with:
          name: test-toolkit-dll
          path: ${{ steps.dll.outputs.dll }}

  # ---------------------------------------------------------
  # Job 1: Run Compliance
  # ---------------------------------------------------------
  compliance:
    name: Compliance Checks
    runs-on: windows-latest
    needs: build_test_toolkit

    steps:

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download toolkit DLL
        uses: actions/download-artifact@v4
        with:
          name: test-toolkit-dll
          path: _toolkit

      - name: Shadow ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $target = Join-Path $env:ProgramData "BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "_toolkit\*.dll" $target -Force
          Write-Host "Shadowed ProgramData → $target"

      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devops_toolkit_repo }}
          ref: ${{ inputs.devops_toolkit_ref }}
          path: _devops_toolkit

      - name: Build ComplianceRunner
        working-directory: _devops_toolkit/src/Compliance/ComplianceRunner
        shell: pwsh
        run: |
          dotnet restore --nologo
          dotnet build -c ${{ inputs.configuration }} --nologo

      # -------- PR Mode: Only changed .cs files --------
      - name: Detect changed C# files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          git diff --name-only $base...HEAD -- '*.cs' | Set-Content changed_files.txt
          $count = (Get-Content changed_files.txt | Measure-Object -Line).Lines
          echo "count=$count" >> $env:GITHUB_OUTPUT

      - name: Run compliance for changed files
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.count != '0' }}
        shell: pwsh
        run: |
          $proj = "_devops_toolkit/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim() -ne "") { $rules += @("--rule", $r.Trim()) }
          }

          $temp = "sarif_parts"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $i = 0
          foreach ($file in Get-Content changed_files.txt) {
            if ($file.Trim() -eq "") { continue }
            $out = Join-Path $temp ("part_$i.sarif")
            dotnet run -c ${{ inputs.configuration }} --project $proj -- `
              "$file" @rules --sarif "$out"
            $i++
          }

          # merge SARIF parts
          $parts = Get-ChildItem $temp -Filter "*.sarif"
          $combined = @{
            version = "2.1.0"
            schema  = "https://json.schemastore.org/sarif-2.1.0.json"
            runs    = @(@{
              tool    = @{ driver = @{ name = "BHoM Compliance Runner"; version = "1.0.0"; rules = @() } }
              results = @()
            })
          }

          foreach ($p in $parts) {
            $j = Get-Content $p.FullName -Raw | ConvertFrom-Json -Depth 100
            $run = $j.runs[0]
            $combined.runs[0].results += $run.results
            $combined.runs[0].tool.driver.rules += $run.tool.driver.rules
          }

          # dedupe rules
          $combined.runs[0].tool.driver.rules =
            ($combined.runs[0].tool.driver.rules | Group-Object id | ForEach-Object { $_.Group[0] })

          $combined | ConvertTo-Json -Depth 100 |
            Out-File -FilePath "${{ inputs.sarif_name }}" -Encoding utf8

      # -------- Push Mode OR no changed files --------
      - name: Run compliance for entire repo
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.count == '0' }}
        shell: pwsh
        run: |
          $proj = "_devops_toolkit/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim() -ne "") { $rules += @("--rule", $r.Trim()) }
          }

          dotnet run -c ${{ inputs.configuration }} --project $proj -- `
            "." @rules --sarif "${{ inputs.sarif_name }}"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.sarif_name }}