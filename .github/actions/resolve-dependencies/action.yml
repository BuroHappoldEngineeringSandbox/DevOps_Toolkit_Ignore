name: "Resolve Dependencies (BHoM)"
description: "Clones dependency graphs (caller or seeds-only), builds, caches, and publishes dependency assemblies."

inputs:
  deps_file:
    description: "Path to the caller repo's dependencies.txt (used when mode=caller)"
    required: false
    default: "dependencies.txt"

  dotnet_version:
    description: ".NET SDK version spec"
    required: false
    default: "8.0"

  configuration:
    description: "Build configuration (Release/Debug)"
    required: false
    default: "Release"

  token:
    description: "GitHub token or PAT for private dependency repositories"
    required: false
    default: ""

  mode:
    description: |
      Dependency resolution mode:
        - caller  → build only the caller repo's dependency graph (default)
        - seeds   → build only the chosen seed repo(s) and their graphs
    required: false
    default: "caller"

  seeds:
    description: "Used when mode=seeds. Newline-separated owner/repo[@ref] list."
    required: false
    default: ""

  additional_seeds:
    description: |
      Only meaningful when mode=caller. Newline-separated owner/repo[@ref] list of
      extra seed repos to resolve and build in addition to the caller's dependencies.txt
      graph. Useful when a job needs both the caller's own dependency assemblies AND
      a fixed set of infrastructure repos (e.g. Test_Toolkit + Versioning_Toolkit for
      data-driven unit tests). Ignored when mode=seeds.
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    # ------------------------------------------------------------
    # Install .NET SDK (no built-in caching)
    # ------------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    # ------------------------------------------------------------
    # NuGet CLI (needed for legacy packages.config restores)
    # ------------------------------------------------------------
    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: "6.x"

    # ------------------------------------------------------------
    # MSBuild (needed for legacy .NET Framework projects)
    # ------------------------------------------------------------
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ------------------------------------------------------------
    # Restore NuGet packages cache
    # actions/cache/restore@v4 is used instead of actions/cache@v4
    # because this is a composite action from a different repository.
    # The post-step save of actions/cache@v4 does not execute in
    # cross-repo composite action contexts — cache saves must be
    # explicit inline steps (actions/cache/save@v4) to work correctly.
    # ------------------------------------------------------------
    - name: Restore NuGet packages cache
      id: nuget-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        # dotnet_version intentionally excluded: NuGet package binaries are SDK-version-agnostic
        # for the .NET Framework and net8.0 targets used by BHoM repos.
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
        restore-keys: ${{ runner.os }}-nuget-

    # ------------------------------------------------------------
    # Environment variables consumed by scripts
    # ------------------------------------------------------------
    - name: Compute environment
      shell: pwsh
      run: |
        $tok = '${{ inputs.token }}'
        if ([string]::IsNullOrWhiteSpace($tok)) { $tok = '${{ github.token }}' }
        if ([string]::IsNullOrWhiteSpace($tok)) {
          Write-Error "No GitHub token available — set the token input or ensure github.token is present."
          exit 1
        }

        "DEP_TOKEN=$tok" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CONFIGURATION=${{ inputs.configuration }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    # ------------------------------------------------------------
    # Prepare dependency directories
    # ------------------------------------------------------------
    - name: Prepare folders
      shell: pwsh
      run: |
        # Metadata directory (stores _shas.txt, _order.txt, _selection.txt)
        New-Item -ItemType Directory -Force -Path deps | Out-Null

        # Isolated clone root — outside the caller repo workspace so repos clone here
        # with no parent Directory.Build.props, no inherited MSBuild customisations.
        New-Item -ItemType Directory -Force -Path "C:\bhom-deps" | Out-Null

        # global.json pins the dotnet SDK for all builds under C:\bhom-deps\.
        # setup-dotnet installs the requested SDK but does not select it — without
        # this file, dotnet picks the highest installed SDK on the runner (currently
        # 10.x on windows-latest), not inputs.dotnet_version.
        # rollForward latestMinor: accept any installed 8.0.x patch.
        $sdkVersion = "${{ inputs.dotnet_version }}"
        if ($sdkVersion -match '^\d+\.\d+$') { $sdkVersion = "$sdkVersion.0" }
        [ordered]@{
            sdk = [ordered]@{
                version     = $sdkVersion
                rollForward = "latestMinor"
            }
        } | ConvertTo-Json | Set-Content "C:\bhom-deps\global.json" -Encoding utf8

        # Required by BHoM PostBuildEvent xcopy: every repo's post-build event copies
        # its output DLLs here. Must exist before any build starts.
        New-Item -ItemType Directory -Force -Path "$env:ProgramData\BHoM\Assemblies" | Out-Null

        New-Item -ItemType File -Force -Path deps/_shas.txt | Out-Null
        if (Test-Path deps/_order.txt)     { Remove-Item deps/_order.txt -Force }
        if (Test-Path deps/_selection.txt) { Remove-Item deps/_selection.txt -Force }

    # ------------------------------------------------------------
    # Resolve dependency graph (caller or seeds mode)
    # ------------------------------------------------------------
    - name: Resolve dependency graph
      shell: pwsh
      env:
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Resolve-DependencyGraph.ps1"

        & $script `
          -DepsFile "${{ inputs.deps_file }}" `
          -Mode "${{ inputs.mode }}" `
          -Seeds "${{ inputs.seeds }}" `
          -AdditionalSeeds "${{ inputs.additional_seeds }}"

    # ------------------------------------------------------------
    # Composite cache key from dependency SHAs
    # ------------------------------------------------------------
    - name: Compute composite cache key from SHAs
      id: shas
      shell: pwsh
      run: |
        if (-not (Test-Path 'deps/_shas.txt')) {
          "keypart=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }

        $pairs = Get-Content 'deps/_shas.txt' | Where-Object { $_ -match '\S+\s+[0-9a-f]+' }
        $keypart = ($pairs | Sort-Object | ForEach-Object {
            $s = $_.Trim().Split(" ")
            "$($s[0])@$($s[1])"
        }) -join ';'

        "keypart=$keypart" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # ------------------------------------------------------------
    # Restore dependency assembly cache
    # Cache is keyed on the exact set of dep SHAs so any change to
    # any dependency invalidates and triggers a full rebuild.
    # See note above on actions/cache/restore vs actions/cache.
    # ------------------------------------------------------------
    - name: Restore dependency assembly cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.ProgramData }}\BHoM\Assemblies
        # dotnet_version intentionally excluded: BHoM assemblies target fixed frameworks
        # (.NET 4.7.2 via msbuild, net8.0 via SDK) whose output is identical regardless
        # of which SDK version performed the build.
        key: depsasm-${{ runner.os }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}
        # Fallback prefix: a prefix match may have a different dep composition.
        # Gate on cache-hit (exact match only) to ensure a rebuild always runs
        # when the exact set of SHAs does not match.
        restore-keys: |
          depsasm-${{ runner.os }}-${{ inputs.configuration }}-

    # ------------------------------------------------------------
    # Build dependencies if no exact cache hit (exact key only).
    # A prefix/restore-key match (cache-hit != 'true') means dep
    # composition may differ from the cached set — must rebuild.
    # ------------------------------------------------------------
    - name: Build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Build-Dependencies.ps1"
        & $script -Configuration "${{ inputs.configuration }}"

    # ------------------------------------------------------------
    # Save dependency assembly cache (only when a fresh build ran)
    # Explicit inline save — post-step saves do not work in
    # cross-repo composite action contexts (see note above).
    # ------------------------------------------------------------
    - name: Save dependency assembly cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.ProgramData }}\BHoM\Assemblies
        key: depsasm-${{ runner.os }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

    # ------------------------------------------------------------
    # Save NuGet packages cache (when exact key was not found)
    # Saves after builds so any newly-downloaded packages are included.
    # Explicit inline save — see note above.
    # ------------------------------------------------------------
    - name: Save NuGet packages cache
      if: steps.nuget-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}

