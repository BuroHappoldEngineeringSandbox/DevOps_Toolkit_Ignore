name: Clone & Build BHoM Dependencies

on:
  workflow_call:
    inputs:
      deps_file:
        description: "Path to dependencies.txt in the caller repo"
        required: false
        type: string
        default: "dependencies.txt"
      extra_repos:
        description: "Optional extra repos (owner/repo per line) to also clone/build"
        required: false
        type: string
        default: ""
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "10.x"
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      token:
        description: "Token for cloning private repos (PAT preferred). Falls back to GITHUB_TOKEN."
        required: false
        type: string
        default: ""

jobs:
  clone_build:
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      DEP_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Prepare directories
        shell: pwsh
        run: |
          mkdir -Force deps | Out-Null
          mkdir -Force deps-assemblies | Out-Null

      - name: Clone, branch-fallback, recurse, build, collect
        id: builddeps
        shell: pwsh
        env:
          # Prefer PR context when available (pull_request events)
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Get-ListFromFileOrEmpty([string]$path) {
            if (Test-Path $path) {
              return Get-Content $path |
                Where-Object { $_ -and -not $_.Trim().StartsWith('#') } |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -ne '' }
            }
            @()
          }

          # Initial seed set from deps_file + optional extra_repos
          $seeds = @()
          $df = "${{ inputs.deps_file }}"
          $seeds += Get-ListFromFileOrEmpty $df

          if ("${{ inputs.extra_repos }}") {
            $extra = @("${{ inputs.extra_repos }}".Split("`n")) |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -ne '' -and -not $_.StartsWith('#') }
            $seeds += $extra
          }

          if ($seeds.Count -eq 0) {
            Write-Host "No dependencies listed in '$df' and no extra_repos supplied — skipping."
            exit 0
          }

          # PR-aware branch selection defaults (for non-PR runs, these are fallbacks)
          $Prefer = $env:PR_BRANCH
          $Fallback = $env:BASE_BRANCH
          if (-not $Prefer)   { $Prefer   = 'feature/unknown' } # likely absent on most repos in non-PR
          if (-not $Fallback) { $Fallback = 'main' }

          # Dedup tracking (mirrors legacy m_BuiltRepos to avoid rebuilds)
          $built = New-Object System.Collections.Generic.HashSet[string]

          function Clone-And-Checkout([string]$ownerRepo) {
            $parts = $ownerRepo.Split('/')
            if ($parts.Count -ne 2) {
              Write-Warning "Skipping invalid repo identifier: '$ownerRepo' (expected owner/repo)"
              return $null
            }
            $name = $parts[1]
            if (Test-Path "deps/$name/.git") {
              return $name
            }

            $url = "https://x-access-token:$env:DEP_TOKEN@github.com/$ownerRepo.git"
            git clone $url "deps/$name" --no-tags --depth 1
            Push-Location "deps/$name"

            # Prefer PR head if exists on this repo, else base (legacy 'CheckoutBranch' parity)
            $hasPrefer = [bool](git ls-remote --heads origin $Prefer)
            if ($hasPrefer) {
              git fetch origin $Prefer --depth 1
              git checkout -q $Prefer
              Write-Host "Checked out '$name' on branch '$Prefer'"
            } else {
              git fetch origin $Fallback --depth 1
              git checkout -q $Fallback
              Write-Host "Branch '$Prefer' not found on '$name' — fell back to '$Fallback'"
            }

            Pop-Location
            return $name
          }

          function Recurse-And-Build([string]$ownerRepo) {
            $name = Clone-And-Checkout $ownerRepo
            if (-not $name) { return }
            if ($built.Contains($name)) { return }
            $built.Add($name) | Out-Null

            $depFile = "deps/$name/dependencies.txt"
            if (Test-Path $depFile) {
              Get-Content $depFile |
                Where-Object { $_ -and -not $_.Trim().StartsWith('#') } |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -ne '' } |
                ForEach-Object { Recurse-And-Build $_ }
            }

            Write-Host "::group::Building $name"
            dotnet build "deps/$name" -c $env:CONFIGURATION
            Write-Host "::endgroup::"

            # Collect DLLs from the repo's build output (current config only)
            Get-ChildItem "deps/$name" -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\bin\\$($env:CONFIGURATION)\\" } |
              ForEach-Object { Copy-Item $_.FullName "deps-assemblies" -Force }
          }

          foreach ($r in $seeds) { Recurse-And-Build $r }

          Write-Host "Collected assemblies:"
          if (Test-Path "deps-assemblies") {
            Get-ChildItem "deps-assemblies" -Filter *.dll |
              Sort-Object Name |
              Select-Object -First 60 |
              ForEach-Object { $_.Name }
          } else {
            Write-Host "(none)"
          }

      - name: Upload dependency assemblies
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          if-no-files-found: warn