name: Static Checks

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: false
      working-directory:
        type: string
        required: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - name: Run .NET Format
          uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/dotnet-format@main
          with:
            dotnet_version: ${{ inputs.dotnet_version }}
            working-directory: ${{ inputs.working-directory }}