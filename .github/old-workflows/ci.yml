name: Static Checks

on:
  workflow_call:
    inputs:
      run_format:
        type: boolean
        required: false
        default: false
        # Set to true to run dotnet format --verify-no-changes on PR-changed C# files only (warn only; job does not fail).
      run_compliance:
        type: boolean
        required: false
        default: true
        # Set to false to skip all compliance checks entirely for this repo.
      run_branch_check:
        type: boolean
        required: false
        default: false
        # Set to true to enable the branch naming convention check for this repo.
      dotnet_version:
        type: string
        required: false
        default: "8.x"
      configuration:
        type: string
        required: false
        default: "Release"
      compliance_checks:
        type: string
        required: false
        default: "code copyright documentation project"
        # Space-separated list of compliance checks to run.
        # Valid values: code, copyright, documentation, project
        # Example — code only: "code"
      run_dataset_check:
        type: boolean
        required: false
        default: false
        # Set to true for repos that contain a datasets/ folder.
        # Runs IsValidDataset against every changed .json file under datasets/.
    secrets:
      GH_TOKEN:
        required: false   # PAT for cloning private dependency repositories; falls back to github.token

jobs:
  # ── Branch naming convention check ──────────────────────────────────────
  branch:
    if: inputs.run_branch_check && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check branch naming convention
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
          base="${{ github.base_ref }}"

          # develop → main is an end-of-milestone merge — skip (matches BHoMBot).
          if [ "$branch" = "develop" ] && [ "$base" = "main" ]; then
            echo "::notice::Milestone merge (develop → main) — branch check skipped."
            exit 0
          fi

          # 'develop' is always valid.
          if [ "$branch" = "develop" ]; then
            echo "::notice::Branch '$branch' is valid."
            exit 0
          fi

          # Pattern mirrors BHoMBot: [a-zA-Z_]*-#[0-9]*-[a-zA-Z]*
          if echo "$branch" | grep -qE '[a-zA-Z_]*-#[0-9]*-[a-zA-Z]*'; then
            echo "::notice::Branch '$branch' matches BHoM naming convention."
          else
            echo "::error title=Branch Compliance::Branch '$branch' does not follow BHoM naming conventions."
            echo "::error::See https://github.com/BHoM/documentation/wiki/Resolving-an-Issue#branch-naming-conventions"
            exit 1
          fi

  # ── Format check ──────────────────────────────────────────────────────────
  # See .github/workflows/format.yml
  format:
    uses: ./.github/workflows/format.yml
    with:
      run_format: ${{ inputs.run_format }}
      dotnet_version: ${{ inputs.dotnet_version }}

  # ── Compliance + dataset checks ─────────────────────────────────────────
  # See .github/workflows/compliance.yml
  compliance:
    if: inputs.run_compliance
    uses: ./.github/workflows/compliance.yml
    with:
      dotnet_version: ${{ inputs.dotnet_version }}
      configuration: ${{ inputs.configuration }}
      compliance_checks: ${{ inputs.compliance_checks }}
      run_dataset_check: ${{ inputs.run_dataset_check }}
    secrets: inherit
