name: BHoM Static Checks (Reusable)

on:
    workflow_call:
        inputs:
            dotnet_version:
                type: string
                default: "10.x"
            configuration:
                type: string
                default: "Release"
            token:
                type: string
                default: ""
            delta_mode: # Currently unused while compliance is commented out
                type: boolean
                default: false
            default_branch:
                type: string
                default: "main"

jobs:
    # -------------------------------------------------
    # 1) Linting / Formatting with Super-Linter
    #    - Includes fork-safe checkout
    #    - Fixes "GITHUB_SHA reference doesn't exist" by checking out the exact SHA with full history
    # -------------------------------------------------
    lint-format:
        runs-on: ubuntu-latest
        steps:
            - name: Run Super-Linter (changed files only)
              uses: github/super-linter@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DEFAULT_BRANCH: ${{ inputs.default_branch }}

                  # Lint only changed files — never full repo
                  VALIDATE_ALL_CODEBASE: false

                  # Linters to enable
                  VALIDATE_CSHARP: true
                  VALIDATE_YAML: true
                  VALIDATE_JSON: true
                  VALIDATE_XML: true
                  VALIDATE_MARKDOWN: true
                  VALIDATE_GITHUB_ACTIONS: true

