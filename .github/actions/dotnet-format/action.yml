name: .NET Format
description: Validates code formatting using dotnet format

inputs:
  dotnet-version:
    description: .NET SDK version
    default: '8.x'

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v47
      with:
        files: '**/*.cs'

    # - name: Debug changed files
    #   shell: bash
    #   run: |
    #     echo "Any Changed ${{ steps.changed-files.outputs.any_changed }}"
    #     echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

    # - name: Debug project discovery
    #   shell: bash
    #   run: |
    #     for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
    #       echo "--- Processing $file ---"
    #       dir=$(dirname "$file")
    #       echo "Checking directory: $dir"
    #       while [[ "$dir" != "." && "$dir" != "/" ]]; do
    #         csproj=$(find "$dir" -maxdepth 1 -name "*.csproj" | head -1)
    #         echo "   Checking '$dir -> $csproj'"
    #         if [ -n "$csproj" ]; then
    #           echo "   Found project: $csproj"
    #           break
    #         fi
    #         dir=$(dirname "$dir")
    #       done
    #     done

    - name: Check formatting
      shell: bash
      run: |
        declare -A projects
        failed=0

        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          dir=$(dirname "$file")
          while [[ "$dir" != "." && "$dir" != "/" ]]; do
            csproj=$(find "$dir" -maxdepth 1 -name "*.csproj" | head -1)
            if [ -n "$csproj" ]; then
              projects["$csproj"]=1
              break
            fi
            dir=$(dirname "$dir")
          done
        done

        if [ ${#projects[@]} -eq 0 ]; then
          echo "No .csproj files found for changed files. Skipping formatting check."
          exit 0
        fi

        for csproj in "${!projects[@]}"; do
          echo "::group::dotnet format - $csproj"
          dotnet format "$csproj" --verify-no-changes --verbosity diagnostic --include ${{ steps.changed-files.outputs.all_changed_files }} || failed=1
          echo "::endgroup::"
        done

        if [ $failed -ne 0 ]; then
          echo "::error::Formatting violations detected. Please run 'dotnet format' locally to fix."
        fi

        exit $failed