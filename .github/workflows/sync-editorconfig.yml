name: Sync EditorConfig

on:
  push:
    branches: [main]
    paths:
      - 'config/.editorconfig'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Dry run — discover repos and log targets without opening any PRs."

concurrency:
  group: sync-editorconfig
  cancel-in-progress: true

jobs:
  sync:
    name: Open sync PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # read DevOps_Toolkit canonical file only

    steps:
      # ── 1. Checkout DevOps_Toolkit ────────────────────────────────────────────
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Generate a short-lived token from the bhom-bot GitHub App ─────────
      #       Tokens auto-rotate every hour — no PAT expiry maintenance required.
      #       PRs and commits will appear as authored by 'bhom-bot[bot]'.
      #       Requires BHOM_APP_ID and BHOM_APP_PRIVATE_KEY org secrets.
      - name: Generate bhom-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # ── 3. Discover repos tagged 'bhom-managed' in the organisation ───────────
      #       Excludes archived repos and DevOps_Toolkit itself.
      - name: Discover target repos
        id: discover
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          org="${{ github.repository_owner }}"

          echo "::group::Querying repos with topic 'bhom-managed' in org '$org'"
          repos=$(gh repo list "$org" \
            --topic bhom-managed \
            --limit 200 \
            --json name,isArchived \
            --jq '.[] | select(.isArchived == false) | .name' \
            | grep -v "^DevOps_Toolkit$" || true)
          echo "::endgroup::"

          if [ -z "$repos" ]; then
            echo "::notice::No repos found with topic 'bhom-managed'. Nothing to sync."
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            count=$(echo "$repos" | wc -l | tr -d ' ')
            echo "::notice::Found $count repo(s) to sync."
            targets=$(echo "$repos" | tr '\n' ' ' | sed 's/ $//')
            echo "targets=$targets" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Sync canonical .editorconfig to each target repo ───────────────────
      #       See .github/scripts/sync-editorconfig-pr.sh for full logic.
      #       PR body template: .github/templates/sync-editorconfig-pr.md
      #       Current year is substituted into the copyright header at sync time.
      - name: Sync to target repos
        if: steps.discover.outputs.targets != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          TARGETS: ${{ steps.discover.outputs.targets }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CANONICAL: config/.editorconfig
          PR_BODY_FILE: .github/templates/sync-editorconfig-pr.md
        run: bash .github/scripts/sync-editorconfig-pr.sh
