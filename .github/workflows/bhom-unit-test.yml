name: BHoM Unit Tests

on:
  workflow_call:
    inputs:
      dependencies:
        description: "Newline-separated list of dependency repos"
        required: false
        type: string
        default: ""
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "8.x"
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      test_solution:
        description: "Path to the unit test solution"
        required: false
        type: string
        default: ".ci/tests/UnitTests/UnitTests.sln"

permissions:
  contents: write
  pull-requests: write

jobs:

  # ------------------------------------------------------
  # 1. Clone & build dependencies (if any specified)
  # ------------------------------------------------------
  deps:
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/bhom-clone-build.yml@main
    if: ${{ inputs.dependencies != '' }}
    with:
      dependencies: ${{ inputs.dependencies }}

  # ------------------------------------------------------
  # 2. Build and test the caller repo
  # ------------------------------------------------------
  test:
    runs-on: windows-latest
    needs: [deps]
    if: always()
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # -------------------------------
      # If deps exist, override ProgramData
      # -------------------------------
      - name: Use dependency assemblies
        if: ${{ needs.deps.outputs.assemblies-path != '' }}
        run: echo "PROGRAMDATA=${{ needs.deps.outputs.assemblies-path }}" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Restore solution
        run: dotnet restore "${{ inputs.test_solution }}"

      - name: Build (${{ inputs.configuration }})
        run: dotnet build "${{ inputs.test_solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Run tests (TRX + Coverage)
        run: >
          dotnet test "${{ inputs.test_solution }}"
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Upload TRX
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
        if: always()

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
        if: always()

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Create coverage summary
        run: |
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Add summary to GitHub
        shell: pwsh
        run: |
          Get-Content "coverage-report/SummaryGithub.md" `
            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: PR Coverage Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "code-coverage"
          path: coverage-report/SummaryGithub.md

  # ------------------------------------------------------
  # 3. Publish TRX to GitHub Checks
  # ------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Download TRX
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish TRX
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          trx_files: "test-results/**/*.trx"