name: Unit Tests

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
      configuration:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false  # optional PAT for private deps; else github.token

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-unit-tests
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Discover test solution
        id: test_check
        run: |
          # Convention: .ci/unit-tests/<RepoName>_Tests.sln (name is repo-specific, discovered at runtime).
          $slns = Get-ChildItem -Path ".ci/unit-tests" -Filter "*.sln" -ErrorAction SilentlyContinue

          if (-not $slns) {
            Write-Host "::notice::No test solution found under .ci/unit-tests/ — unit tests skipped."
            Write-Host "::notice::To enable unit tests, add a solution at .ci/unit-tests/<RepoName>_Tests.sln"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            if ($slns.Count -gt 1) {
              Write-Host "::warning::Multiple solutions found under .ci/unit-tests/ — using: $($slns[0].Name)"
            }
            $sln = $slns[0].FullName
            "skip=false"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "solution=$sln" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Test solution discovered: $sln"
          }

      - name: Resolve dependencies
        if: steps.test_check.outputs.skip != 'true'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           caller
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore test solution
        if: steps.test_check.outputs.skip != 'true'
        run: dotnet restore "${{ steps.test_check.outputs.solution }}"

      - name: Build (Release)
        if: steps.test_check.outputs.skip != 'true'
        run: dotnet build "${{ steps.test_check.outputs.solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Run tests
        id: test
        if: steps.test_check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          $solutionDir  = Split-Path "${{ steps.test_check.outputs.solution }}"
          $runsettings  = Join-Path $solutionDir ".runsettings"
          $settingsArg  = if (Test-Path $runsettings) { "--settings `"$runsettings`"" } else { "" }

          if ($settingsArg) {
            Write-Host "::notice::Using runsettings: $runsettings"
          }

          $expression = "dotnet test `"${{ steps.test_check.outputs.solution }}`" " +
                        "--no-build " +
                        "--configuration ${{ inputs.configuration }} " +
                        "--verbosity normal " +
                        '--logger "trx;LogFileName=tests.trx" ' +
                        "--results-directory TestResults " +
                        '--collect:"XPlat Code Coverage" ' +
                        $settingsArg

          Invoke-Expression $expression
          "test_exit_code=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::$LASTEXITCODE test(s) failed — results will be published before failing the job."
          }

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Upload coverage (Cobertura XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

      - name: Check for coverage files
        id: coverage-check
        if: always()
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
          if ($files) {
            "coverage_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Found $($files.Count) coverage file(s)."
          } else {
            "coverage_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::No coverage.cobertura.xml found — coverage report steps will be skipped. Add a Cobertura reporter to test projects to enable."
          }

      - name: Install ReportGenerator
        if: steps.coverage-check.outputs.coverage_found == 'true'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: steps.coverage-check.outputs.coverage_found == 'true'
        run: |
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Add coverage to step summary
        if: always()
        run: |
          if (Test-Path "coverage-report/SummaryGithub.md") {
            Get-Content "coverage-report/SummaryGithub.md" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Host "::notice::No coverage report (Cobertura XML not produced by test projects)."
          }

      # Sticky PR comment only (not push).
      - name: Post coverage comment
        if: |
          steps.coverage-check.outputs.coverage_found == 'true' &&
          github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: code-coverage
          path: coverage-report/SummaryGithub.md

      - name: Check test outcome
        if: always()
        run: |
          $code = "${{ steps.test.outputs.test_exit_code }}"
          if ($code -ne "" -and $code -ne "0") {
            Write-Host "::error::Unit tests failed — see the TRX results and the 'Publish Test Results' check for details."
            exit 1
          }


  publish-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Download TRX artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
        continue-on-error: true

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "test-results/**/*.trx"
