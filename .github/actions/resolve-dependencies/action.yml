name: "Resolve Dependencies (BHoM)"
description: "Clones dependency graphs (caller or seeds-only), builds, caches, and publishes dependency assemblies."

inputs:
  deps_file:
    description: "Path to the caller repo's dependencies.txt (used when mode=caller)"
    required: false
    default: "dependencies.txt"

  dotnet_version:
    description: ".NET SDK version spec"
    required: false
    default: "10.x"

  configuration:
    description: "Build configuration (Release/Debug)"
    required: false
    default: "Release"

  token:
    description: "GitHub token or PAT for private dependency repositories"
    required: false
    default: ""

  mode:
    description: |
      Dependency resolution mode:
        - caller  → build only the caller repo's dependency graph (default)
        - seeds   → build only the chosen seed repo(s) and their graphs
    required: false
    default: "caller"

  seeds:
    description: "Used when mode=seeds. Newline-separated owner/repo[@ref] list."
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    # ------------------------------------------------------------
    # Install .NET SDK (no built-in caching)
    # ------------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    # ------------------------------------------------------------
    # NuGet CLI (needed for legacy packages.config restores)
    # ------------------------------------------------------------
    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: "6.x"

    # ------------------------------------------------------------
    # MSBuild (needed for legacy .NET Framework projects)
    # ------------------------------------------------------------
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ------------------------------------------------------------
    # Cache NuGet packages + MSBuild graph cache
    # ------------------------------------------------------------
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        key: ${{ runner.os }}-nuget-${{ inputs.dotnet_version }}-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
        restore-keys: ${{ runner.os }}-nuget-

    # ------------------------------------------------------------
    # Environment variables consumed by scripts
    # ------------------------------------------------------------
    - name: Compute environment
      shell: pwsh
      run: |
        $tok = '${{ inputs.token }}'
        if ([string]::IsNullOrWhiteSpace($tok)) { $tok = '${{ github.token }}' }

        "DEP_TOKEN=$tok" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CONFIGURATION=${{ inputs.configuration }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    # ------------------------------------------------------------
    # Prepare dependency directories
    # ------------------------------------------------------------
    - name: Prepare folders
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path deps | Out-Null
        New-Item -ItemType Directory -Force -Path deps-assemblies | Out-Null

        # Required by BHoM legacy projects: PostBuildEvent xcopy targets this directory.
        # Must exist before any msbuild invocation so xcopy does not fail.
        New-Item -ItemType Directory -Force -Path "$env:ProgramData\BHoM\Assemblies" | Out-Null

        New-Item -ItemType File -Force -Path deps/_shas.txt | Out-Null
        if (Test-Path deps/_order.txt)     { Remove-Item deps/_order.txt -Force }
        if (Test-Path deps/_selection.txt) { Remove-Item deps/_selection.txt -Force }

    # ------------------------------------------------------------
    # Resolve dependency graph (caller or seeds mode)
    # ------------------------------------------------------------
    - name: Resolve dependency graph
      shell: pwsh
      env:
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Resolve-DependencyGraph.ps1"

        & $script `
          -DepsFile "${{ inputs.deps_file }}" `
          -Mode "${{ inputs.mode }}" `
          -Seeds "${{ inputs.seeds }}"

    # ------------------------------------------------------------
    # Composite cache key from dependency SHAs
    # ------------------------------------------------------------
    - name: Compute composite cache key from SHAs
      id: shas
      shell: pwsh
      run: |
        if (-not (Test-Path 'deps/_shas.txt')) {
          "keypart=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }

        $pairs = Get-Content 'deps/_shas.txt' | Where-Object { $_ -match '\S+\s+[0-9a-f]+' }
        $keypart = ($pairs | Sort-Object | ForEach-Object {
            $s = $_.Trim().Split(" ")
            "$($s[0])@$($s[1])"
        }) -join ';'

        "keypart=$keypart" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # ------------------------------------------------------------
    # Restore assemblies from cache if available
    # ------------------------------------------------------------
    - name: Restore dependency assembly cache
      id: cache
      uses: actions/cache@v4
      with:
        path: deps-assemblies
        key: depsasm-${{ runner.os }}-${{ inputs.dotnet_version }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

    # ------------------------------------------------------------
    # Build dependencies if cache missed
    # ------------------------------------------------------------
    - name: Build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Build-Dependencies.ps1"
        & $script -Configuration "${{ inputs.configuration }}"

    # ------------------------------------------------------------
    # Upload assemblies
    # ------------------------------------------------------------
    - name: Upload dependency assemblies
      uses: actions/upload-artifact@v4
      with:
        name: deps-assemblies
        path: deps-assemblies/**
        retention-days: 7
        if-no-files-found: warn