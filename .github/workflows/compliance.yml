name: BHoM Compliance (PR)

on:
  workflow_call:
    inputs:
      dotnet_version:   { type: string, default: "10.x" }
      configuration:    { type: string, default: "Release" }
      token:            { type: string, default: "" }  # only if private deps

jobs:
  compliance:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # ------------------------------------------------------------
      # Build ONLY Test_Toolkit + its own dependency graph
      # ------------------------------------------------------------
      - name: Resolve Dependencies (Compliance / seeds-only)
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode: seeds
          seeds: |
            BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ inputs.token }}

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: "deps-assemblies"

      # --- Build the runner from DevOps_Toolkit standard location ---
      - name: Checkout DevOps_Toolkit (runner source)
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: toolkit_repo

      - name: Publish Compliance Runner
        run: |
          $proj = "toolkit_repo\src\Carbon\ComplianceRunner\Carbon.ComplianceRunner.csproj"
          if (-not (Test-Path $proj)) {
            # Fallback to previous path if needed
            $proj = "toolkit_repo\src\Compliance\ComplianceRunner\ComplianceRunner.csproj"
          }
          if (-not (Test-Path $proj)) {
            Write-Error "Compliance Runner project not found. Checked: `n - toolkit_repo\src\Carbon\ComplianceRunner\Carbon.ComplianceRunner.csproj `n - toolkit_repo\src\Compliance\ComplianceRunner\ComplianceRunner.csproj"
            exit 1
          }
          dotnet publish $proj -c ${{ inputs.configuration }} -o out\runner

      # --- Determine PR-changed *.cs files only ---
      - name: Compute changed C# files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          git fetch origin ${{ github.base_ref }}
          $files = git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD |
            Where-Object { $_.ToLower().EndsWith(".cs") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "Changed C# files:"
            Get-Content changed_files.txt
          } else {
            Write-Host "No changed C# files detected."
          }

      # --- Run compliance on the delta; still upload SARIF if violations occur ---
      - name: Run Compliance Runner (PR delta)
        if: steps.changed.outputs.count != '0'
        run: |
          $sarif  = "compliance.sarif"
          $runner = "out\runner\ComplianceRunner.exe"
          if (-not (Test-Path $runner)) {
            Write-Host "Publish contents:"
            Get-ChildItem -Recurse out\runner | Select-Object FullName
            Write-Error "Runner exe not found at $runner"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path scan | Out-Null
          Get-Content changed_files.txt | ForEach-Object {
            $src = $_
            $dst = Join-Path "scan" $_
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $src $dst -Force
          }

          & $runner "scan" --sarif $sarif
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Compliance violations detected (non-zero exit)."
          }

      - name: Upload SARIF (Code scanning)
        if: steps.changed.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif
          category: "bhom-compliance-pr-delta"