name: BHoM Compliance (PR)

on:
  workflow_call:
    inputs:
      dotnet_version:     { type: string,  default: "10.x" }
      configuration:      { type: string,  default: "Release" }
      # Provide additional repos to build alongside the caller's dependencies.
      # We'll inject BHoM/Test_Toolkit here from the caller or leave default.
      extra_repos:        { type: string,  default: "" }
      # Only needed if any extra repo is private; not required for BHoM/Test_Toolkit (public).
      token:              { type: string,  default: "" }

jobs:
  # 1) Build all deps + Test_Toolkit in a single pass
  deps:
    permissions:
      contents: read
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/deps.yml@main
    with:
      dotnet_version:   ${{ inputs.dotnet_version }}
      configuration:    ${{ inputs.configuration }}
      token:            ${{ inputs.token }}
      # Build the caller's graph from dependencies.txt plus Test_Toolkit explicitly.
      extra_repos: |
        BHoM/Test_Toolkit
        ${{ inputs.extra_repos }}

  # 2) Run Compliance on changed C# files and upload SARIF
  compliance:
    runs-on: windows-latest
    needs: deps
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload (Code scanning)
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download dependency assemblies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies
        continue-on-error: true

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: "deps-assemblies"

      # Build the Compliance Runner (adjust path if your project lives elsewhere)
      - name: Build Compliance Runner
        run: |
          dotnet publish .\src\ComplianceRunnerApp\ComplianceRunnerApp.csproj `
            -c ${{ inputs.configuration }} `
            -o out\runner

      # Determine changed *.cs files in this PR only
      - name: Compute changed C# files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            Write-Host "Not a PR event; nothing to do."
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          git fetch origin ${{ github.base_ref }}
          $files = git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "Changed C# files:"
            Get-Content changed_files.txt
          } else {
            Write-Host "No changed C# files detected."
          }

      - name: Run Compliance Runner (PR delta)
        if: steps.changed.outputs.count != '0'
        run: |
          $sarif   = "compliance.sarif"
          $runner  = "out\runner\ComplianceRunnerApp.exe"

          # To scan only changed files, mirror them into a temp 'scan' folder
          New-Item -ItemType Directory -Force -Path scan | Out-Null
          Get-Content changed_files.txt | ForEach-Object {
            $src = $_
            $dst = Join-Path "scan" $_
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $src $dst -Force
          }

          & $runner "scan" --sarif $sarif
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Compliance violations detected (non-zero exit)."
          }

      - name: Upload SARIF (Code scanning)
        if: steps.changed.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif
          category: "bhom-compliance-pr-delta"