name: Clone & Build BHoM Dependencies

on:
  workflow_call:
    inputs:
      deps_file:      { type: string,  default: "dependencies.txt" }
      extra_repos:    { type: string,  default: "" }
      dotnet_version: { type: string,  default: "10.x" }
      configuration:  { type: string,  default: "Release" }
      token:          { type: string,  default: "" }

jobs:
  clone_build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CONFIGURATION: ${{ inputs.configuration }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~\AppData\Local\Microsoft\MSBuild\Cache
          key: ${{ runner.os }}-nuget-${{ inputs.dotnet_version }}-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-${{ inputs.dotnet_version }}-

      - name: Clone dependency graph
        id: clone
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-dependency-graph@main
        with:
          token:       ${{ inputs.token != '' && inputs.token || github.token }}
          deps_file:   ${{ inputs.deps_file }}
          extra_repos: ${{ inputs.extra_repos }}
          pr_branch:   ${{ github.event.pull_request.head.ref }}
          base_branch: ${{ github.event.pull_request.base.ref }}

      - name: Compose cache key from SHAs
        id: shas
        run: |
          if(-not (Test-Path 'deps/_shas.txt')){"keypart=" >> $env:GITHUB_OUTPUT; exit 0}
          $keypart=(Get-Content 'deps/_shas.txt' | ?{$_ -match '\S+\s+[0-9a-f]+'} | sort | %{
            $t=$_.Trim() -split '\s+'; "$($t[0])@$($t[1])"}) -join ';'
          "keypart=$keypart" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: cache
        with:
          path: deps-assemblies
          key: depsasm-${{ runner.os }}-${{ inputs.dotnet_version }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

      - name: Build dependencies (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $overallFailures = @()

          # Iterate each cloned dependency repo
          Get-ChildItem "deps" -Directory | ForEach-Object {
            $repoPath = $_.FullName
            $repoName = $_.Name
            Write-Host "::group::Building $repoName"

            # Prefer a solution if one exists; otherwise enumerate all csproj files
            $solution = Get-ChildItem $repoPath -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
            $projects = @()
            if ($null -ne $solution) {
              Write-Host "Found solution: $($solution.FullName)"
              try {
                dotnet restore $solution.FullName
                dotnet build   $solution.FullName -c $env:CONFIGURATION --no-restore --nologo -m
              }
              catch {
                Write-Warning "Build FAILED for solution '$($solution.FullName)': $($_.Exception.Message)"
                $overallFailures += "$repoName (sln)"
              }
            }
            else {
              $projects = Get-ChildItem $repoPath -Recurse -Filter *.csproj -ErrorAction SilentlyContinue
              if ($projects.Count -eq 0) {
                Write-Host "No .sln or .csproj found in $repoName — skipping build."
              }
              else {
                foreach ($p in $projects) {
                  Write-Host "Project: $($p.FullName)"
                  try {
                    dotnet restore $p.FullName
                    dotnet build   $p.FullName -c $env:CONFIGURATION --no-restore --nologo -m
                  }
                  catch {
                    Write-Warning "Build FAILED for project '$($p.FullName)': $($_.Exception.Message)"
                    $overallFailures += "$repoName ($($p.Name))"
                  }
                }
              }
            }

            Write-Host "::endgroup::"
          }

          # Collect built DLLs (even if some repos failed)
          if(-not (Test-Path "deps-assemblies")){ New-Item -ItemType Directory -Force -Path "deps-assemblies" | Out-Null }
          Get-ChildItem "deps" -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\bin\\$($env:CONFIGURATION)\\" } |
            ForEach-Object { Copy-Item $_.FullName "deps-assemblies" -Force }

          Write-Host ""
          Write-Host "Collected assemblies (sample):"
          Get-ChildItem "deps-assemblies" -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -First 60 | ForEach-Object { $_.Name }

          # If you want the job to fail when any repo failed to build, uncomment below:
          # if ($overallFailures.Count -gt 0) {
          #   Write-Error ("One or more dependency builds failed:`n - " + ($overallFailures -join "`n - "))
          # }

      - uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          retention-days: 7
          if-no-files-found: warn