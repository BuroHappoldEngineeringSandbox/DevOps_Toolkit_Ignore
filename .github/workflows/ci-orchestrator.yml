name: CI Orchestrator

on:
  pull_request:
    paths-ignore:
      - '.editorconfig'  # Config-only changes cannot affect build or test outcomes.
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: false
        default: "8.0"
        description: ".NET SDK version passed to all child workflows (build, compliance, dataset, unit-tests, format)."
      configuration:
        type: string
        required: false
        default: "Release"
        description: "Build configuration (Release/Debug) passed to all child workflows."
    secrets:
      GH_TOKEN:
        required: false  # optional PAT for private deps; else github.token
      BHOM_APP_ID:
        required: false  # BHoMBot GitHub App ID — used to mint a short-lived token for cross-org dep cloning.
      BHOM_APP_PRIVATE_KEY:
        required: false  # BHoMBot GitHub App private key (PEM). Required when BHOM_APP_ID is set.

# event_name separates PR and post-merge queues on the same branch; -orchestrator suffix
# prevents colliding with the caller's own concurrency group under workflow_call.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-orchestrator
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      state:                    ${{ steps.state.outputs.state }}
      run_format:               ${{ steps.policy.outputs.run_format }}
      run_compliance:           ${{ steps.policy.outputs.run_compliance }}
      compliance_checks:        ${{ steps.policy.outputs.compliance_checks }}
      run_dataset:              ${{ steps.policy.outputs.run_dataset }}
      run_build:                ${{ steps.policy.outputs.run_build }}
      run_unit_tests:           ${{ steps.policy.outputs.run_unit_tests }}
      format_files_changed:     ${{ steps.changed.outputs.format_files_changed }}
      compliance_files_changed: ${{ steps.changed.outputs.compliance_files_changed }}
      dataset_files_changed:    ${{ steps.changed.outputs.dataset_files_changed }}
      dotnet_version:           ${{ steps.resolve-inputs.outputs.dotnet_version }}
      configuration:            ${{ steps.resolve-inputs.outputs.configuration }}

    steps:
      # inputs context is empty under pull_request; fall back to defaults.
      - name: Resolve inputs
        id: resolve-inputs
        shell: bash
        run: |
          echo "dotnet_version=${{ inputs.dotnet_version || '8.0' }}" >> "$GITHUB_OUTPUT"
          echo "configuration=${{ inputs.configuration || 'Release' }}"  >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # format, compliance, and dataset are PR-only and skipped when no relevant files changed.
      # build and unit-tests always run.
      - name: Detect changed file types
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "format_files_changed=false"     >> "$GITHUB_OUTPUT"
            echo "compliance_files_changed=false" >> "$GITHUB_OUTPUT"
            echo "dataset_files_changed=false"    >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$base_sha"
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$base_sha" HEAD)

          # format: *.cs, *.csproj, *.props, *.targets
          if echo "$CHANGED" | grep -qE '\.(cs|csproj|props|targets)$'; then
            echo "format_files_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "format_files_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .NET format-relevant files changed — format job will be skipped."
          fi

          # compliance: *.cs, *.csproj
          if echo "$CHANGED" | grep -qE '\.(cs|csproj)$'; then
            echo "compliance_files_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "compliance_files_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No compliance-relevant files changed — compliance job will be skipped."
          fi

          # dataset: *.json under a 'datasets/' path segment (anchored to prevent substring matches).
          if echo "$CHANGED" | grep -qiE '(^|/)datasets[^/]*\.json$'; then
            echo "dataset_files_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dataset_files_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dataset files changed — dataset job will be skipped."
          fi

      # secrets context is unavailable in step if: expressions; gate on a prior step's output.
      - name: Check App credentials
        id: app-check
        shell: bash
        env:
          APP_ID: ${{ secrets.BHOM_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dependency token
        id: dep-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Read repo maturity
        id: state
        env:
          GH_TOKEN: ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Fork PRs: GITHUB_TOKEN is scoped to the fork and cannot read the parent repo's
          # custom properties. Configure BHOM_APP_ID, or set maturity on the fork itself.
          # See README.md — "Fork PR behaviour".
          STATE=$(gh api "repos/${{ github.repository }}/properties/values" \
            --jq '.[] | select(.property_name == "maturity") | .value // empty')
          if [ -z "$STATE" ]; then
            echo "::error::Repository custom property 'maturity' is not set. Set it to one of: $(IFS=" | "; echo "${POLICY_STATES[*]:-prototype | alpha | beta}")."
            exit 1
          fi
          # Value validation is deferred to 'Validate repo maturity' below (post-checkout).
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      # Same org default token can read this repo; pass GH_TOKEN if the toolkit is private elsewhere.
      - name: Checkout policy (DevOps_Toolkit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/DevOps_Toolkit
          ref: main
          path: _central
          token: ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || github.token }}

      - name: Validate policy.json
        run: bash _central/.github/scripts/orchestrator/validate-policy.sh

      # Validates against POLICY_STATES from policy-contract.sh — the single source of truth.
      # A new tier added to the contract is enforced here automatically.
      - name: Validate repo maturity
        env:
          STATE: ${{ steps.state.outputs.state }}
        run: |
          set -euo pipefail
          # shellcheck source=_central/.github/scripts/orchestrator/policy-contract.sh
          source _central/.github/scripts/orchestrator/policy-contract.sh
          valid=0
          for s in "${POLICY_STATES[@]}"; do
            [ "$s" = "$STATE" ] && valid=1
          done
          if [ "$valid" -eq 0 ]; then
            echo "::error::Invalid maturity value '$STATE'. Must be one of: ${POLICY_STATES[*]}"
            exit 1
          fi
          echo "::notice::Repo maturity: $STATE"

      - name: Read policy
        id: policy
        env:
          STATE: ${{ steps.state.outputs.state }}
        run: bash _central/.github/scripts/orchestrator/read-policy.sh


  # ── Jobs ────────────────────────────────────────────────────────────────────

  format:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_format == 'true' &&
      needs.setup.outputs.format_files_changed == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-format.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
    # ci-format.yml declares no secrets; GITHUB_TOKEN is sufficient (public checkouts only).

  compliance:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_compliance == 'true' &&
      needs.setup.outputs.compliance_files_changed == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-compliance.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      dotnet_version:    ${{ needs.setup.outputs.dotnet_version }}
      configuration:     ${{ needs.setup.outputs.configuration }}
      compliance_checks: ${{ needs.setup.outputs.compliance_checks }}
    secrets:
      GH_TOKEN:            ${{ secrets.GH_TOKEN }}
      BHOM_APP_ID:         ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  dataset:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_dataset == 'true' &&
      needs.setup.outputs.dataset_files_changed == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-dataset.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
    secrets:
      GH_TOKEN:            ${{ secrets.GH_TOKEN }}
      BHOM_APP_ID:         ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  build:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_build == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-build.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
    secrets:
      GH_TOKEN:            ${{ secrets.GH_TOKEN }}
      BHOM_APP_ID:         ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  # Unit-tests resolves its own deps and builds the test solution independently of ci-build.
  unit-tests:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_unit_tests == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-unit-tests.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
    secrets:
      GH_TOKEN:            ${{ secrets.GH_TOKEN }}
      BHOM_APP_ID:         ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

  # ── Health emission ─────────────────────────────────────────────────────────
  # always() ensures this runs regardless of child job outcomes; continue-on-error
  # in ci-emit-health.yml prevents telemetry failures from blocking required checks.
  emit-health:
    needs: [setup, format, compliance, dataset, build, unit-tests]
    if: always() && needs.setup.result != 'skipped'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-emit-health.yml@main  # MIGRATE-TO-PROD: update org when moving to production
    with:
      maturity:          ${{ needs.setup.outputs.state }}
      format_result:     ${{ needs.format.result }}
      compliance_result: ${{ needs.compliance.result }}
      dataset_result:    ${{ needs.dataset.result }}
      build_result:      ${{ needs.build.result }}
      unit_tests_result: ${{ needs['unit-tests'].result }}
    secrets:
      BHOM_APP_ID:         ${{ secrets.BHOM_APP_ID }}
      BHOM_APP_PRIVATE_KEY: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
