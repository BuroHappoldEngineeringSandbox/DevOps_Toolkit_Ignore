name: Bump Copyright Year

on:
  schedule:
    # Runs at 00:05 UTC on 1 Jan each year.
    - cron: '5 0 1 1 *'
  workflow_dispatch:
    inputs:
      year:
        type: string
        description: "Target year (defaults to current year). Format: YYYY"

concurrency:
  group: bump-copyright-year-bhom-engine
  cancel-in-progress: true

env:
  TARGET_REPO: ${{ github.repository_owner }}/BHoM_Engine

jobs:
  bump:
    name: Update BHoM_Engine .editorconfig copyright year
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Generate bhom-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: BHoM_Engine

      - name: Checkout BHoM_Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Bump copyright year and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_YEAR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.year || '' }}
        run: |
          year="${TARGET_YEAR:-$(date -u +%Y)}"
          file=".editorconfig"

          if grep -q "Copyright (c) 2015 - $year" "$file"; then
            echo "::notice::Copyright year is already $year — nothing to do."
            exit 0
          fi

          sed -i "s/2015 - [0-9]\{4\}/2015 - $year/g" "$file"

          git config user.name  "bhom-bot[bot]"
          git config user.email "bhom-bot[bot]@users.noreply.github.com"

          branch="chore/bump-copyright-$year"

          git fetch origin "$branch" 2>/dev/null || true
          git checkout -b "$branch" 2>/dev/null || git checkout "$branch"
          git add "$file"
          git commit -m "chore: bump copyright year to $year"
          git push --force-with-lease origin "$branch"

          pr_body="Automated annual copyright year bump in \`file_header_template\` (IDE0073) in \`.editorconfig\`."
          existing_pr=$(gh pr list \
            --repo "${{ env.TARGET_REPO }}" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$existing_pr" ]; then
            echo "::notice::PR #$existing_pr already open — branch updated, PR remains."
          else
            pr_url=$(gh pr create \
              --repo "${{ env.TARGET_REPO }}" \
              --base main \
              --head "$branch" \
              --title "chore: bump copyright year to $year" \
              --body "$pr_body")
            echo "::notice::PR opened: $pr_url"
          fi
