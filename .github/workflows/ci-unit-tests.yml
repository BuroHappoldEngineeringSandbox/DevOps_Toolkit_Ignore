name: Unit Tests

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
      configuration:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false  # optional PAT for private deps; else github.token
      BHOM_APP_ID:
        required: false  # BHoMBot GitHub App ID — used to mint a short-lived token for dep cloning.
      BHOM_APP_PRIVATE_KEY:
        required: false  # BHoMBot GitHub App private key (PEM). Required when BHOM_APP_ID is set.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-unit-tests
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Convention: .ci/unit-tests/<RepoName>_Tests.sln; name is repo-specific, discovered at runtime.
      - name: Discover test solution
        id: test_check
        run: |
          $slns = Get-ChildItem -Path ".ci/unit-tests" -Filter "*.sln" -ErrorAction SilentlyContinue

          if (-not $slns) {
            Write-Host "::warning::No test solution found under .ci/unit-tests/ — unit test step skipped. Add a solution at .ci/unit-tests/<RepoName>_Tests.sln to enable unit tests. See https://bhom.xyz/documentation/Guides-and-Tutorials/Coding-with-BHoM/Testing/ for setup instructions."
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ($slns.Count -gt 1) {
            Write-Host "::warning::Multiple solutions found under .ci/unit-tests/ — using: $($slns[0].Name)"
          }
          $sln = $slns[0].FullName
          "found=true"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "solution=$sln" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "::notice::Test solution discovered: $sln"

      - name: Check App credentials
        id: app-check
        if: steps.test_check.outputs.found == 'true'
        shell: bash
        env:
          APP_ID: ${{ secrets.BHOM_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dependency token
        id: dep-token
        if: steps.test_check.outputs.found == 'true' && steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve dependencies
        if: steps.test_check.outputs.found == 'true'
        uses: BuroHappoldEngineeringSandbox/Platform/.github/actions/resolve-dependencies@main
        with:
          mode:             caller
          additional_seeds: BHoM/Test_Toolkit
          dotnet_version:   ${{ inputs.dotnet_version }}
          configuration:    ${{ inputs.configuration }}
          token:            ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || github.token }}

      - name: Restore test solution
        if: steps.test_check.outputs.found == 'true'
        run: dotnet restore "${{ steps.test_check.outputs.solution }}"

      - name: Build
        if: steps.test_check.outputs.found == 'true'
        run: dotnet build "${{ steps.test_check.outputs.solution }}" --no-restore --configuration ${{ inputs.configuration }} --nologo

      - name: Run tests
        id: run_tests
        if: steps.test_check.outputs.found == 'true'
        run: |
          $sln         = "${{ steps.test_check.outputs.solution }}"
          $solutionDir = Split-Path $sln
          $runsettings = Join-Path $solutionDir ".runsettings"
          $config      = "${{ inputs.configuration }}"

          $testArgs = @(
            $sln
            "--no-build"
            "--configuration", $config
            "--verbosity", "normal"
            "--logger", "trx;LogFileName=tests.trx"
            "--results-directory", "TestResults"
            '--collect:XPlat Code Coverage'
          )

          if (Test-Path $runsettings) {
            Write-Host "::notice::Using runsettings: $runsettings"
            $testArgs += "--settings", $runsettings
          }

          dotnet test @testArgs

      - name: Upload test results (TRX)
        if: always() && steps.run_tests.outcome != 'skipped'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Generate coverage report
        if: always() && steps.run_tests.outcome != 'skipped'
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "::notice::No coverage.cobertura.xml found — skipping report. Add a Cobertura collector to test projects to enable."
            return
          }
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.3.11
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub"

      - name: Add coverage to step summary
        if: always() && steps.run_tests.outcome != 'skipped'
        run: |
          if (Test-Path "coverage-report/SummaryGithub.md") {
            Get-Content "coverage-report/SummaryGithub.md" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

