name: Clone & Build BHoM Dependencies

on:
  workflow_call:
    inputs:
      deps_file:
        description: "Path to dependencies.txt in the caller repo"
        required: false
        type: string
        default: "dependencies.txt"
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "8.x"
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      token:
        description: "Token for cloning private repos (PAT preferred). If empty, falls back to GITHUB_TOKEN."
        required: false
        type: string
        default: ""

jobs:
  clone_build:
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      DEP_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Prepare directories
        shell: pwsh
        run: |
          mkdir -Force deps | Out-Null
          mkdir -Force deps-assemblies | Out-Null

      - name: Read dependencies.txt
        id: parse
        shell: pwsh
        run: |
          $file = "${{ inputs.deps_file }}"
          if (-not (Test-Path $file)) {
            Write-Host "No dependencies file found at: $file — skipping clone/build."
            "repos=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $repos = Get-Content $file |
            Where-Object { $_ -and -not $_.Trim().StartsWith('#') } |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne '' }

          if ($repos.Count -eq 0) {
            Write-Host "dependencies.txt is empty — skipping clone/build."
            "repos=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "Dependencies:"
          $repos | ForEach-Object { Write-Host " - $_" }
          $json = $repos | ConvertTo-Json -Compress
          "repos=$json" >> $env:GITHUB_OUTPUT

      - name: Clone dependencies
        if: ${{ steps.parse.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          $repos = ConvertFrom-Json '${{ steps.parse.outputs.repos }}'
          foreach ($repo in $repos) {
            Write-Host "::group::Cloning $repo"
            $repoName = $repo.Split('/')[1]
            $url = "https://x-access-token:$env:DEP_TOKEN@github.com/$repo.git"
            git clone --depth 1 $url "deps/$repoName"
            Write-Host "::endgroup::"
          }

      - name: Build dependencies
        if: ${{ steps.parse.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem "deps" -Directory) {
            Write-Host "::group::Building $($dir.Name)"
            dotnet build $dir.FullName -c $env:CONFIGURATION
            Write-Host "::endgroup::"
          }

      - name: Gather DLLs
        if: ${{ steps.parse.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem "deps" -Directory) {
            $dlls = Get-ChildItem "$($dir.FullName)\**\bin\$env:CONFIGURATION\*.dll" -Recurse -ErrorAction SilentlyContinue
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName "deps-assemblies" -Force
            }
          }
          Write-Host "Collected assemblies:"
          Get-ChildItem "deps-assemblies" -Filter *.dll |
            Sort-Object Name |
            Select-Object -First 50 |
            ForEach-Object { $_.Name }

      - name: Upload dependency assemblies
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          if-no-files-found: warn