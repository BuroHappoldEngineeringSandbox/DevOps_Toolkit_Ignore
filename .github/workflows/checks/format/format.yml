name: .NET Format Check

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: false
        default: "8.x"

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # ── 1. Checkout caller with full history (needed for git diff on PRs) ──────
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup .NET SDK ─────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      # ── 3. Determine which C# files changed in this PR ───────────────────────
      - name: Compute changed C# files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          files=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" -- '*.cs' | tr '\n' ' ')
          count=$(echo "$files" | tr ' ' '\n' | grep -c '\.cs$' || true)

          echo "files=$files"   >> $GITHUB_OUTPUT
          echo "count=$count"   >> $GITHUB_OUTPUT

          if [ -n "$(echo $files | tr -d ' ')" ]; then
            echo "Changed C# files ($count): $files"
          else
            echo "No changed C# files detected."
          fi

      # ── 4. Verify formatting on each project that owns a changed file ─────────
      - name: Check formatting
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          declare -A projects
          failed=0

          for file in ${{ steps.changed.outputs.files }}; do
            dir=$(dirname "$file")
            while [[ "$dir" != "." && "$dir" != "/" ]]; do
              csproj=$(find "$dir" -maxdepth 1 -name "*.csproj" | head -1)
              if [ -n "$csproj" ]; then
                projects["$csproj"]=1
                break
              fi
              dir=$(dirname "$dir")
            done
          done

          if [ ${#projects[@]} -eq 0 ]; then
            echo "No .csproj files found for changed files. Skipping formatting check."
            exit 0
          fi

          for csproj in "${!projects[@]}"; do
            echo "::group::dotnet format — $csproj"
            dotnet format "$csproj" --verify-no-changes --verbosity diagnostic \
              --include ${{ steps.changed.outputs.files }} || failed=1
            echo "::endgroup::"
          done

          if [ $failed -ne 0 ]; then
            echo "::error::Formatting violations detected. Please run 'dotnet format' locally to fix."
          fi

          exit $failed
