name: BHoM Unit Tests

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "10.x"

      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"

      test_solution:
        description: "Path to test solution (.sln or .slnf/.slnx)"
        required: false
        type: string
        default: ".ci/tests/UnitTests/UnitTests.sln"

      deps_file:
        description: "Path to dependencies.txt inside the repo"
        required: false
        type: string
        default: "dependencies.txt"

      token:
        description: "Token for cloning private repos (PAT preferred)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # Job 1: Read dependencies.txt & clone/build dependencies
  # ---------------------------------------------------------
  deps:
    runs-on: windows-latest
    outputs:
      deps-list: ${{ steps.collect.outputs.deps-list }}

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read dependencies.txt
        id: collect
        shell: pwsh
        run: |
          $file = "${{ inputs.deps_file }}"

          if (-not (Test-Path $file)) {
            Write-Host "No dependencies.txt found — skipping dependency build."
            echo "deps-list=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $lines = Get-Content $file |
                   Where-Object { $_ -and -not $_.StartsWith('#') } |
                   ForEach-Object { $_.Trim() }

          if ($lines.Count -eq 0) {
            Write-Host "dependencies.txt is empty — skipping dependency build."
            echo "deps-list=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # This becomes the newline-separated list for clone-build workflow
          $joined = $lines -join "`n"

          Write-Host "Dependencies found:"
          $lines | ForEach-Object { Write-Host " - $_" }

          echo "deps-list=$joined" >> $env:GITHUB_OUTPUT

      - name: Build dependencies (if any)
        if: ${{ steps.collect.outputs.deps-list != '' }}
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/bhom-clone-build.yml@main
        with:
          dependencies: ${{ steps.collect.outputs.deps-list }}
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration: ${{ inputs.configuration }}
          token: ${{ inputs.token }}

  # ---------------------------------------------------------
  # Job 2: Build, test, generate coverage
  # ---------------------------------------------------------
  test:
    runs-on: windows-latest
    needs: [deps]
    if: always()
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Download dependency assemblies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies
        continue-on-error: true

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $src = "deps-assemblies"
          $dst = Join-Path $env:ProgramData "BHoM\Assemblies"

          if (Test-Path $src) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item "$src\*.dll" $dst -Force
            Write-Host "Staged assemblies to $dst"
            Get-ChildItem $dst -Filter *.dll | Select-Object -First 20 | ForEach-Object { $_.Name }
          } else {
            Write-Host "⚠️ No dependency assemblies found."
          }

      - name: Verify test solution exists
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ inputs.test_solution }}")) {
            Write-Error "❌ Test solution not found: ${{ inputs.test_solution }}"
            exit 1
          }

      - name: Restore solution
        run: dotnet restore "${{ inputs.test_solution }}"

      - name: Build solution (${{ inputs.configuration }})
        run: dotnet build "${{ inputs.test_solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Run tests (TRX + Coverage)
        continue-on-error: true
        run: >
          dotnet test "${{ inputs.test_solution }}"
          --configuration ${{ inputs.configuration }}
          --verbosity normal
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
        if: always()

      - name: Upload coverage (Cobertura XML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
        if: always()

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Create coverage summary
        run: |
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Add coverage summary to Job Summary
        shell: pwsh
        run: |
          Get-Content "coverage-report/SummaryGithub.md" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Post coverage summary comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "code-coverage"
          path: coverage-report/SummaryGithub.md

  # ---------------------------------------------------------
  # Job 3: Publish tests to GitHub Checks (Linux)
  # ---------------------------------------------------------
  publish_test_results_linux:
    name: Publish Unit Test Results (PR Check)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Download TRX artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        with:
          trx_files: "test-results/**/*.trx"