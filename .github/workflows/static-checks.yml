name: BHoM Static Checks (Reusable)

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: "10.x"
      configuration:
        type: string
        default: "Release"
      token:
        type: string
        default: ""
      delta_mode:            # Currently unused while compliance is commented out
        type: boolean
        default: false
      default_branch:
        type: string
        default: "main"

jobs:
  # -------------------------------------------------
  # 1) Linting / Formatting with Super-Linter
  #    - Includes fork-safe checkout
  #    - Fixes "GITHUB_SHA reference doesn't exist" by checking out the exact SHA with full history
  # -------------------------------------------------
  lint-format:
    runs-on: ubuntu-latest
    steps:
      # Push or same-repo PR
      - name: Checkout caller repo at exact SHA (push / same-repo PR)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Fork PR (checkout the head repository + head SHA)
      - name: Checkout PR HEAD (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # persist-credentials: false  # uncomment if you harden permissions

      # Super-Linter across codebase; runs fast, no build required
      - name: Run Super-Linter
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}

          # Enable specific linters (adjust as needed)
          VALIDATE_CSHARP: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_XML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true

          # For PRs only lint the diff; for pushes lint the full codebase
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}

      # Optional: enforce .editorconfig formatting explicitly
      - name: Setup .NET (for dotnet format)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Formatting check (dotnet format)
        run: dotnet format --verify-no-changes

