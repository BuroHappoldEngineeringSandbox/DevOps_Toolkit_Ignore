name: BHoM Unit Tests (deps from dependencies.txt)

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version(s). First should support your targets (e.g., 10.x)"
        required: false
        type: string
        default: |
          10.x
          8.x
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      test_solution:
        description: "Path to the unit test solution (.sln or .slnf/.slnx)"
        required: false
        type: string
        default: ".ci/tests/UnitTests/UnitTests.sln"
      deps_file:
        description: "Path to dependencies file in the caller repo"
        required: false
        type: string
        default: "dependencies.txt"
      default_org:
        description: "Default org for shorthand 'Repo' entries"
        required: false
        type: string
        default: "${{ github.repository_owner }}"
      token:
        description: "Token for cloning private repos (PAT preferred, else GITHUB_TOKEN)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------
  # Job A: Build dependencies from deps file
  # ---------------------------------------
  deps:
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      DEP_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}

    steps:
      - name: Checkout caller repo (to read dependencies.txt)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK(s)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup NuGet (for legacy packages.config restore)
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Prepare folders + ensure ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          mkdir -Force deps | Out-Null
          mkdir -Force deps-assemblies | Out-Null
          $dst = Join-Path $env:ProgramData "BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

      - name: Read dependencies.txt
        id: read-deps
        shell: pwsh
        run: |
          $file = "${{ inputs.deps_file }}"
          if (-not (Test-Path $file)) {
            Write-Host "No dependencies file found at: $file"
            # We still proceed (some repos may not have deps)
            "repos=[]" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $defaultOrg = "${{ inputs.default_org }}"

          $repos = @()
          $lines = Get-Content $file | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') }
          foreach ($line in $lines) {
            # Parse Owner/Repo[@ref] or Repo[@ref]
            $ownerRepo,$ref = $line.Split('@',2)
            if ($ownerRepo -notmatch "/") {
              $ownerRepo = "$defaultOrg/$ownerRepo"
            }
            $obj = [PSCustomObject]@{
              full = $ownerRepo
              ref  = $ref
            }
            $repos += $obj
          }
          $json = $repos | ConvertTo-Json -Compress
          "repos=$json" >> $env:GITHUB_OUTPUT

      - name: Clone dependencies in declared order
        if: ${{ steps.read-deps.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          $repos = ConvertFrom-Json '${{ steps.read-deps.outputs.repos }}'
          foreach ($r in $repos) {
            $repo = $r.full
            $name = $repo.Split('/')[1]
            $url  = "https://x-access-token:$env:DEP_TOKEN@github.com/$repo.git"
            Write-Host "::group::Cloning $repo"
            git clone --depth 1 $url "deps/$name"
            if ($r.ref) {
              Push-Location "deps/$name"
              git fetch origin $r.ref --depth 1 || git fetch origin --tags
              git checkout $r.ref || (Write-Error "Failed to checkout ref '$($r.ref)' in $repo"; exit 1)
              Pop-Location
            }
            Write-Host "::endgroup::"
          }

      - name: NuGet restore for packages.config repos (if any)
        if: ${{ steps.read-deps.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem deps -Directory) {
            $hasPackagesConfig = @(Get-ChildItem $dir.FullName -Recurse -Filter packages.config -ErrorAction SilentlyContinue).Count -gt 0
            if ($hasPackagesConfig) {
              Write-Host "::group::NuGet restore (packages.config) for $($dir.Name)"
              nuget restore $dir.FullName -NonInteractive
              Write-Host "::endgroup::"
            }
          }

      - name: Build dependencies in declared order
        if: ${{ steps.read-deps.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          $repos = ConvertFrom-Json '${{ steps.read-deps.outputs.repos }}'
          foreach ($r in $repos) {
            $name = $r.full.Split('/')[1]
            $dir  = Join-Path "deps" $name
            Write-Host "::group::Building $name"
            dotnet build $dir -c $env:CONFIGURATION
            Write-Host "::endgroup::"
          }

      - name: Collect dependency DLLs
        if: ${{ steps.read-deps.outputs.repos != '[]' }}
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem "deps" -Directory) {
            $dlls = Get-ChildItem "$($dir.FullName)\**\bin\$env:CONFIGURATION\*.dll" -Recurse -ErrorAction SilentlyContinue
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName "deps-assemblies" -Force
            }
          }
          Write-Host "Collected assemblies:"
          Get-ChildItem "deps-assemblies" -Filter *.dll | Sort-Object Name | Select-Object -First 60 | ForEach-Object { $_.Name }

      - name: Upload assemblies artifact (for this run)
        if: ${{ steps.read-deps.outputs.repos != '[]' }}
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          if-no-files-found: warn

  # ---------------------------------------
  # Job B: Stage deps, build & test
  # ---------------------------------------
  test:
    runs-on: windows-latest
    needs: [deps]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK(s)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Download dependency assemblies (if present)
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies
        continue-on-error: true

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $src = "deps-assemblies"
          if (Test-Path $src) {
            $dst = Join-Path $env:ProgramData "BHoM\Assemblies"
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item -Path (Join-Path $src "*.dll") -Destination $dst -Force -ErrorAction SilentlyContinue
            Write-Host "Staged assemblies to: $dst"
            Get-ChildItem $dst -Filter *.dll | Sort-Object Name | Select-Object -First 30 | ForEach-Object { $_.Name }
          } else {
            Write-Host "No dependency assemblies found (repo may not need external deps)."
          }

      - name: Verify test solution exists
        shell: pwsh
        run: |
          $path = "${{ inputs.test_solution }}"
          if (-not (Test-Path $path)) {
            Write-Host "❌ Test solution not found at: $path"
            if (Test-Path ".ci/tests") {
              Write-Host "📁 Listing .ci/tests for debugging:"
              Get-ChildItem -Path ".ci/tests" -Recurse -File | ForEach-Object { $_.FullName }
            }
            exit 1
          } else {
            Write-Host "✅ Found test solution: $path"
          }

      - name: Restore
        run: dotnet restore "${{ inputs.test_solution }}"

      - name: Build (${{ inputs.configuration }})
        run: dotnet build "${{ inputs.test_solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Test (TRX + Coverage)
        continue-on-error: true
        run: >
          dotnet test "${{ inputs.test_solution }}"
          --configuration ${{ inputs.configuration }}
          --verbosity normal
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"

      - name: Upload raw coverage (Cobertura XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"