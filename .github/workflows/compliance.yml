name: Compliance (Reusable)

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: "8.0.x"
      configuration:
        type: string
        default: "Release"
      rules:
        type: string
        default: ""    # multiline rules (optional)

    secrets:
      REPO_READ_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:

  # ---------------------------------------------------------
  # Step 1: Build Test_Toolkit (fixed repo)
  # ---------------------------------------------------------
  build_test_toolkit:
    runs-on: windows-latest

    steps:
      - name: Checkout Test_Toolkit
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/Test_Toolkit
          ref: main
          path: test_toolkit
          token: ${{ secrets.REPO_READ_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Build Engine
        working-directory: test_toolkit/CodeComplianceTest_Engine
        run: dotnet build -c ${{ inputs.configuration }} --nologo

      - name: Collect DLLs
        run: |
          mkdir toolkit
          copy test_toolkit\CodeComplianceTest_Engine\bin\${{ inputs.configuration }}\*.dll toolkit\

      - uses: actions/upload-artifact@v4
        with:
          name: test-toolkit-assemblies
          path: toolkit/*

  # ---------------------------------------------------------
  # Step 2: Run compliance checks
  # ---------------------------------------------------------
  compliance:
    runs-on: windows-latest
    needs: build_test_toolkit

    steps:
      - uses: actions/checkout@v4   # caller repo
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - uses: actions/download-artifact@v4
        with:
          name: test-toolkit-assemblies
          path: _toolkit

      - name: Stage DLLs into ProgramData
        run: |
          $p = "$env:ProgramData\BHoM\Assemblies"
          mkdir $p -Force | Out-Null
          copy _toolkit\*.dll $p -Force

      # Fixed repo for ComplianceRunner
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _devops
          token: ${{ secrets.REPO_READ_TOKEN || github.token }}

      - name: Build ComplianceRunner
        working-directory: _devops/src/Compliance/ComplianceRunner
        run: dotnet build -c ${{ inputs.configuration }}

      # PR mode only changed files
      - name: Detect changed C# files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- '*.cs' > changed.txt
          echo "count=$(wc -l < changed.txt)" >> $env:GITHUB_OUTPUT

      - name: Run compliance (changed only)
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.count != '0' }}
        run: |
          $proj = "_devops/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim() -ne "") { $rules += @("--rule", $r.Trim()) }
          }

          $out = "compliance.sarif"
          dotnet run -c ${{ inputs.configuration }} --project $proj -- `
            (Get-Content changed.txt) @rules --sarif $out

      - name: Run compliance (full repo)
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.count == '0' }}
        run: |
          $proj = "_devops/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim() -ne "") { $rules += @("--rule", $r.Trim()) }
          }

          dotnet run -c ${{ inputs.configuration }} --project $proj -- `
            "." @rules --sarif "compliance.sarif"

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif