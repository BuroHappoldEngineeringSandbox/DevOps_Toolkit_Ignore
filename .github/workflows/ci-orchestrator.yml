name: CI Orchestrator

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false

# Under workflow_call, github.workflow is the caller's name; suffix avoids deadlock with caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-orchestrator
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      state:             ${{ steps.topic.outputs.state }}
      dotnet_version:    ${{ steps.config.outputs.dotnet_version }}
      configuration:     ${{ steps.config.outputs.configuration }}
      test_solution:     ${{ steps.config.outputs.test_solution }}
      run_format:        ${{ steps.policy.outputs.run_format }}
      run_compliance:    ${{ steps.policy.outputs.run_compliance }}
      compliance_checks: ${{ steps.policy.outputs.compliance_checks }}
      run_dataset:       ${{ steps.policy.outputs.run_dataset }}
      run_build:         ${{ steps.policy.outputs.run_build }}
      run_unit_tests:    ${{ steps.policy.outputs.run_unit_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Read GitHub Topic
        id: topic
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TOPICS=$(gh api repos/${{ github.repository }} --jq '.topics[]')

          if echo "$TOPICS" | grep -q "bhom-beta"; then
            STATE="beta"
          elif echo "$TOPICS" | grep -q "bhom-alpha"; then
            STATE="alpha"
          elif echo "$TOPICS" | grep -q "bhom-prototype"; then
            STATE="prototype"
          else
            echo "::error::No valid state topic found. Add bhom-prototype, bhom-alpha or bhom-beta to repo topics."
            exit 1
          fi

          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "::notice::Repo state: $STATE"

      - name: Checkout policy (DevOps_Toolkit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _central

      - name: Validate policy.json
        run: |
          POLICY="_central/policy.json"

          if [ ! -f "$POLICY" ]; then
            echo "::error::policy.json not found at repo root of the policy checkout (DevOps_Toolkit)."
            exit 1
          fi

          # validate all required states exist (bracket keys; e.g. unit-tests is not .unit-tests in jq)
          for state in prototype alpha beta; do
            for key in format compliance compliance_checks dataset build unit-tests; do
              VALUE=$(jq -r --arg s "$state" --arg k "$key" '.[$s][$k] // "__missing__"' "$POLICY")
              if [ "$VALUE" == "__missing__" ]; then
                echo "::error::policy.json missing required key: $state.$key"
                exit 1
              fi
            done
          done

          echo "::notice::policy.json is valid"

      - name: Read policy
        id: policy
        run: |
          POLICY="_central/policy.json"
          STATE="${{ steps.topic.outputs.state }}"

          RUN_FORMAT=$(jq -r --arg s "$STATE" '.[$s].format' "$POLICY")
          RUN_COMPLIANCE=$(jq -r --arg s "$STATE" '.[$s].compliance' "$POLICY")
          COMPLIANCE_CHECKS=$(jq -r --arg s "$STATE" '.[$s].compliance_checks' "$POLICY")
          RUN_DATASET=$(jq -r --arg s "$STATE" '.[$s].dataset' "$POLICY")
          RUN_BUILD=$(jq -r --arg s "$STATE" '.[$s].build' "$POLICY")
          RUN_UNIT_TESTS=$(jq -r --arg s "$STATE" '.[$s]["unit-tests"]' "$POLICY")

          # bhom.json compliance override
          BHOM=".github/bhom.json"
          if [ -f "$BHOM" ]; then
            OVERRIDE=$(jq -r '.compliance.checks // empty' $BHOM)
            if [ -n "$OVERRIDE" ]; then
              # validate override values
              VALID="project code copyright documentation"
              for check in $OVERRIDE; do
                if ! echo "$VALID" | grep -qw "$check"; then
                  echo "::error::Invalid compliance check in bhom.json: '$check'. Valid values: $VALID"
                  exit 1
                fi
              done
              COMPLIANCE_CHECKS="$OVERRIDE"
              echo "::notice::Compliance checks overridden by bhom.json: $COMPLIANCE_CHECKS"
            fi
          fi

          echo "run_format=$RUN_FORMAT"               >> $GITHUB_OUTPUT
          echo "run_compliance=$RUN_COMPLIANCE"       >> $GITHUB_OUTPUT
          echo "compliance_checks=$COMPLIANCE_CHECKS" >> $GITHUB_OUTPUT
          echo "run_dataset=$RUN_DATASET"             >> $GITHUB_OUTPUT
          echo "run_build=$RUN_BUILD"                 >> $GITHUB_OUTPUT
          echo "run_unit_tests=$RUN_UNIT_TESTS"       >> $GITHUB_OUTPUT

          echo "::notice::run_format=$RUN_FORMAT"
          echo "::notice::run_compliance=$RUN_COMPLIANCE"
          echo "::notice::compliance_checks=$COMPLIANCE_CHECKS"
          echo "::notice::run_dataset=$RUN_DATASET"
          echo "::notice::run_build=$RUN_BUILD"
          echo "::notice::run_unit_tests=$RUN_UNIT_TESTS"

      - name: Read bhom.json config
        id: config
        run: |
          BHOM=".github/bhom.json"

          # defaults
          DOTNET_VERSION="8.0"
          CONFIGURATION="Release"
          TEST_SOLUTION=""

          if [ ! -f "$BHOM" ]; then
            echo "::notice::No bhom.json found — using orchestrator defaults"
          else
            _DOTNET=$(jq -r    '.dotnet_version       // empty' $BHOM)
            _CONFIG=$(jq -r    '.configuration        // empty' $BHOM)
            _SOLUTION=$(jq -r  '.unit_tests.solution  // empty' $BHOM)

            DOTNET_VERSION=${_DOTNET:-$DOTNET_VERSION}
            CONFIGURATION=${_CONFIG:-$CONFIGURATION}
            TEST_SOLUTION=${_SOLUTION:-$TEST_SOLUTION}
          fi

          echo "dotnet_version=$DOTNET_VERSION" >> $GITHUB_OUTPUT
          echo "configuration=$CONFIGURATION"   >> $GITHUB_OUTPUT
          echo "test_solution=$TEST_SOLUTION"   >> $GITHUB_OUTPUT

          echo "::notice::dotnet_version=$DOTNET_VERSION"
          echo "::notice::configuration=$CONFIGURATION"
          echo "::notice::test_solution=${TEST_SOLUTION:-not set}"

  # ── Jobs ────────────────────────────────────────────────────────────────────

  format:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_format == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-format.yml@main
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  compliance:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_compliance == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-compliance.yml@main
    with:
      dotnet_version:    ${{ needs.setup.outputs.dotnet_version }}
      configuration:     ${{ needs.setup.outputs.configuration }}
      compliance_checks: ${{ needs.setup.outputs.compliance_checks }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  dataset:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_dataset == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-dataset.yml@main
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  build:
    needs: setup
    if: |
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_build == 'true'
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-build.yml@main
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  unit-tests:
    needs: [setup, build]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.run_unit_tests == 'true' &&
      needs.setup.outputs.test_solution != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/ci-unit-tests.yml@main
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      configuration:  ${{ needs.setup.outputs.configuration }}
      test_solution:  ${{ needs.setup.outputs.test_solution }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
