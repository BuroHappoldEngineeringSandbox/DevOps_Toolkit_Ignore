# Discipline team ownership map — managed in DevOps_Toolkit, do not edit in target repos.
#
# Structure: each team key lists the repos it owns.
#
# Team rename:    change the key here AND the slug in GitHub org settings, then re-run the sync workflow.
# Repo transfer:  move the repo name from one team block to another, then re-run.
# New repo:       add the repo name under the appropriate team block, then run the sync workflow with repo= input.
#
# Rules:
#   - Every active repo must appear exactly once across all team blocks.
#   - Team slugs must be lowercase and hyphenated (e.g. design-technology).
#   - Repo names must match GitHub repository names exactly (case-sensitive).
#   - Repos listed under the platform team generate a single-line CODEOWNERS
#     (platform owns everything); no separate path overrides are added.

