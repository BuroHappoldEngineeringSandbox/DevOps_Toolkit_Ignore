name: Distribute .editorconfig

# Triggered on push to main when .editorconfig changes, or manually via workflow_dispatch.
# Reads the org list from .github/config/governance-orgs.json and runs one parallel matrix
# leg per org. Each leg mints its own short-lived App token scoped to that org, then opens
# PRs in every repo with a maturity custom property set.
# Use dry_run=true to preview affected repos without opening PRs.

on:
  push:
    branches: [main]
    paths:
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      org:
        description: 'Single org to target (e.g. BuroHappoldEngineering). Leave blank for all orgs.'
        type: string
        required: false
        default: ''
      repo:
        description: 'Single repo to target (e.g. BHoM_Adapter). Leave blank for all repos in the org.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run — list affected repos without opening PRs'
        type: boolean
        required: false
        default: false

# Prevent concurrent distribution runs; a partial run leaves repos in inconsistent states.
# A newer push queues until the current run completes.
concurrency:
  group: distribute-editorconfig
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.resolve-orgs.outputs.orgs }}

    steps:
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Resolve target orgs
        id: resolve-orgs
        env:
          SINGLE_ORG: ${{ inputs.org }}
        run: |
          if [ -n "${SINGLE_ORG}" ]; then
            if ! echo "${SINGLE_ORG}" | grep -qE '^[A-Za-z0-9_.-]+$'; then
              echo "::error::Invalid org name '${SINGLE_ORG}'. Only alphanumeric characters, hyphens, underscores, and dots are allowed."
              exit 1
            fi
            # Validate against the manifest to prevent targeting orgs outside the governance model.
            if ! jq -e --arg o "${SINGLE_ORG}" 'index($o) != null' .github/config/governance-orgs.json > /dev/null; then
              echo "::error::Org '${SINGLE_ORG}' is not listed in .github/config/governance-orgs.json."
              exit 1
            fi
            orgs="[\"${SINGLE_ORG}\"]"
          else
            orgs=$(jq -c '.' .github/config/governance-orgs.json)
          fi
          echo "orgs=${orgs}" >> "$GITHUB_OUTPUT"
          echo "::notice::Target org(s): $(echo "${orgs}" | jq -r '.[]' | tr '\n' ' ')"

  distribute:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 50  # App token TTL is 60 min; cap job below that to avoid late-run 401s.
    permissions:
      contents: read  # DevOps_Toolkit checkout only; target repo writes use app token.
    strategy:
      matrix:
        org: ${{ fromJson(needs.setup.outputs.orgs) }}
      fail-fast: false  # One org's failure does not cancel distribution to other orgs.

    steps:
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Generates a short-lived (1 h) installation token scoped to the target org.
      # Required secrets (org-level): BHOM_APP_ID, BHOM_APP_PRIVATE_KEY.
      # Required App permissions: Contents (rw), Pull requests (rw), Organisation custom properties (read).
      # The same App must be installed in every org listed in governance-orgs.json.
      - name: Generate app token
        id: app-token
        continue-on-error: true  # 404 means App is not installed; handled by the next step.
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}

      # Surfaces a clear, non-disruptive warning rather than a red matrix leg when the App
      # has not yet been installed in the target org.
      - name: Skip — App not installed
        if: steps.app-token.outcome == 'failure'
        run: |
          echo "::warning::GitHub App is not installed in '${{ matrix.org }}'. Distribution skipped."
          echo "::warning::Install the App in that org and re-run, or remove it from .github/config/governance-orgs.json."

      - name: Resolve target repos
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ matrix.org }}
          SINGLE_REPO: ${{ inputs.repo }}
        run: |
          if [ -n "${SINGLE_REPO}" ]; then
            if ! echo "${SINGLE_REPO}" | grep -qE '^[A-Za-z0-9_.-]+$'; then
              echo "::error::Invalid repo name '${SINGLE_REPO}'. Only alphanumeric characters, hyphens, underscores, and dots are allowed."
              exit 1
            fi
            # Write directly to repo-list.txt, bypassing the properties API.
            echo "${SINGLE_REPO}" > repo-list.txt
            echo "::notice::Single-repo mode — targeting ${ORG}/${SINGLE_REPO}."
          else
            # Build a sorted, lowercased list of non-archived repos.
            # GitHub repo names are case-insensitive; normalising to lowercase prevents
            # comm mismatches when the properties API and repos API return different
            # casings for the same repository name.
            gh api "/orgs/${ORG}/repos" --paginate \
              --jq '.[] | select(.archived == false) | .name' \
              | tr '[:upper:]' '[:lower:]' \
              | LC_ALL=C sort > /tmp/active-repos.txt

            ACTIVE_COUNT=$(wc -l < /tmp/active-repos.txt | tr -d ' ')
            echo "::notice::[${ORG}] ${ACTIVE_COUNT} non-archived repo(s) in org."

            # Fetch all repos with their custom property values in a single call, then
            # filter client-side to repos with 'maturity' set to a known tier.
            #
            # Why not a per-tier loop with repository_query=props.maturity:VALUE?
            # 'repository_query' is a repo-name text search, not a property value filter.
            # Every tier returned 404; gh api writes the error JSON body to stdout (not
            # stderr), so 2>/dev/null did not suppress it. The JSON leaked through the
            # pipeline into props-repos.txt and poisoned the comm intersection.
            source .github/scripts/orchestrator/policy-contract.sh
            maturity_pattern=$(IFS='|'; echo "${POLICY_STATES[*]}")
            gh api "/orgs/${ORG}/properties/values" \
              --paginate \
              --jq ".[] | select(any(.properties[]; .property_name == \"maturity\" and (.value != null) and (.value | test(\"^(${maturity_pattern})$\")))) | .repository_name" \
              | tr '[:upper:]' '[:lower:]' \
              | LC_ALL=C sort -u \
              | grep -v "^devops_toolkit$" \
              > /tmp/props-repos.txt

            PROPS_COUNT=$(wc -l < /tmp/props-repos.txt | tr -d ' ')
            echo "::notice::[${ORG}] ${PROPS_COUNT} repo(s) have maturity property set."
            if [ "${PROPS_COUNT}" -gt 0 ]; then
              echo "::notice::[${ORG}] Repos with maturity set: $(tr '\n' ' ' < /tmp/props-repos.txt)"
            fi

            if [ "${PROPS_COUNT}" -eq 0 ] && [ "${ACTIVE_COUNT}" -gt 0 ]; then
              echo "::warning::[${ORG}] No repos have maturity set, but ${ACTIVE_COUNT} non-archived repo(s) exist. Check that the 'maturity' custom property is defined and assigned in this org."
            fi

            LC_ALL=C comm -12 /tmp/props-repos.txt /tmp/active-repos.txt > repo-list.txt

            COUNT=$(wc -l < repo-list.txt | tr -d ' ')
            echo "::notice::[${ORG}] ${COUNT} repo(s) targeted for distribution."
            if [ "${COUNT}" -eq 0 ] && [ "${PROPS_COUNT}" -gt 0 ]; then
              echo "::warning::[${ORG}] Intersection produced 0 repos despite ${PROPS_COUNT} having maturity set."
              echo "::warning::[${ORG}] props-repos: $(tr '\n' '|' < /tmp/props-repos.txt)"
              echo "::warning::[${ORG}] active-repos (first 10): $(head -10 /tmp/active-repos.txt | tr '\n' '|')"
            fi
          fi

      - name: Distribute
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ matrix.org }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/distribute-editorconfig.sh repo-list.txt
