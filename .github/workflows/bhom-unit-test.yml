name: BHoM Unit Tests

on:
  workflow_call:
    inputs:
      dependencies:
        description: "Newline-separated list of dependency repos (owner/repo per line). Leave empty if none."
        required: false
        type: string
        default: ""
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "8.x"
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      test_solution:
        description: "Path to test solution (.sln or .slnf)"
        required: false
        type: string
        default: ".ci/tests/UnitTests/UnitTests.sln"
      token:
        description: "Token for cloning private repos (passed down to dependency builder)."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1) Build dependencies (if provided) and publish assemblies as artifact
  deps:
    if: ${{ inputs.dependencies != '' }}
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/bhom-clone-build.yml@main
    with:
      dependencies: ${{ inputs.dependencies }}
      dotnet_version: ${{ inputs.dotnet_version }}
      configuration: ${{ inputs.configuration }}
      token: ${{ inputs.token }}

  # 2) Build, test, and produce coverage
  test:
    runs-on: windows-latest
    needs: [deps]
    if: always()
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Download dependency assemblies (if any)
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies
        continue-on-error: true

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $src = "deps-assemblies"
          if (Test-Path $src) {
            $dst = Join-Path $env:ProgramData "BHoM\Assemblies"
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item -Path (Join-Path $src "*.dll") -Destination $dst -Force -ErrorAction SilentlyContinue
            Write-Host "Staged assemblies to: $dst"
            Write-Host "Sample contents:"
            Get-ChildItem $dst -Filter *.dll | Sort-Object Name | Select-Object -First 30 | ForEach-Object { $_.Name }
          } else {
            Write-Host "No dependency assemblies artifact found (dependencies may be empty)."
          }

      - name: Verify test solution exists
        shell: pwsh
        run: |
          $path = "${{ inputs.test_solution }}"
          if (-not (Test-Path $path)) {
            Write-Host "❌ Test solution not found at: $path"
            if (Test-Path ".ci/tests") {
              Write-Host "📁 Listing .ci/tests for debugging:"
              Get-ChildItem -Path ".ci/tests" -Recurse -File | ForEach-Object { $_.FullName }
            }
            exit 1
          } else {
            Write-Host "✅ Found test solution: $path"
          }

      - name: Ensure dotnet tools path is on PATH
        shell: pwsh
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Restore solution
        run: dotnet restore "${{ inputs.test_solution }}"

      - name: Build (${{ inputs.configuration }})
        run: dotnet build "${{ inputs.test_solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Test (TRX + XPlat coverage)
        continue-on-error: true
        run: >
          dotnet test "${{ inputs.test_solution }}"
          --no-build
          --configuration ${{ inputs.configuration }}
          --verbosity normal
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"

      - name: Upload raw coverage (Cobertura XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Create coverage summary
        run: |
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Add coverage summary to job summary
        shell: pwsh
        run: |
          Get-Content "coverage-report/SummaryGithub.md" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Post coverage summary as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "code-coverage"
          path: coverage-report/SummaryGithub.md

  # ---------------------------------------------------------
  # Job 2: Publish test results to GitHub Checks API
  # ---------------------------------------------------------
  publish_test_results_linux:
    name: Publish Unit Test Results (PR Check)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Download TRX artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
      - name: Publish test results (TRX)
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        with:
          trx_files: "test-results/**/*.trx"