name: BHoM Static Checks (Reusable)
on:
    workflow_call:
        inputs:
            dotnet_version: { type: string, default: "10.x" }
            configuration: { type: string, default: "Release" }
            token: { type: string, default: "" }
            delta_mode: { type: boolean, default: false }

jobs:
    # -------------------------------------------------
    # 1. Linting / Formatting
    # -------------------------------------------------
    lint-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # -----------------------------
            # Super-Linter (C#, JSON, YAML, XML, Markdown)
            # -----------------------------
            - name: Run Super-Linter
              uses: github/super-linter@v6
              env:
                  DEFAULT_BRANCH: main
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  # Enable specific linters
                  VALIDATE_CSHARP: true
                  VALIDATE_YAML: true
                  VALIDATE_JSON: true
                  VALIDATE_XML: true
                  VALIDATE_MARKDOWN: true
                  VALIDATE_GITHUB_ACTIONS: true

            # Optional extra formatting enforcement
            - name: Formatting check (dotnet format)
              run: |
                  dotnet format --verify-no-changes

