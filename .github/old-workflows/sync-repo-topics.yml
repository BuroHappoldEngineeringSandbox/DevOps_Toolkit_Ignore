name: Sync repo topics

# Manually triggered — run this after team-to-repo assignments have been
# updated to stamp each repo with bhom-team-<slug> topics reflecting which
# discipline teams have write (or above) access.
#
# Only topics prefixed with "bhom-team-" are managed by this workflow.
# All other topics (e.g. bhom-beta, bhom-alpha) are left untouched.
#
# The DISCIPLINE_TEAMS env variable below defines the canonical set of
# discipline team slugs. Update it here if teams are added or renamed.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to target (e.g. BHoM_Adapter). Leave blank for all BHoM repos.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run — list intended topic changes without updating anything'
        type: boolean
        required: false
        default: false

# Never cancel a sync mid-flight — a partial run leaves repos with
# inconsistent topics. Let the current run finish before starting another.
concurrency:
  group: sync-repo-topics
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # DevOps_Toolkit checkout only; topic updates use app token.

    steps:
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      # Generates a short-lived installation token (1 h) scoped to the org.
      # Required secrets (set at org level in DevOps_Toolkit):
      #   BHOM_APP_ID          — GitHub App ID (numeric, from App settings page)
      #   BHOM_APP_PRIVATE_KEY — PEM private key generated for the App
      #
      # The App needs these permissions installed on the org:
      #   Organisation: Members (read)    ← query team-to-repo assignments
      #   Repository:   Metadata (write)  ← PUT repo topics
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve target repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SINGLE_REPO: ${{ inputs.repo }}
        run: |
          if [ -n "${SINGLE_REPO}" ]; then
            echo "${SINGLE_REPO}" > repo-list.txt
            echo "::notice::Single-repo mode — targeting ${SINGLE_REPO}."
          else
            gh api "orgs/${ORG}/repos" \
              --paginate \
              --jq '.[] | select(.archived == false) | .name' \
              | grep -v "^DevOps_Toolkit$" \
              | sort \
              > repo-list.txt

            COUNT=$(wc -l < repo-list.txt | tr -d ' ')
            echo "::notice::${COUNT} target repo(s) found."
          fi

      - name: Sync topics
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Space-separated list of discipline team slugs to map to topics.
          # A repo gains bhom-team-<slug> for each discipline team that has
          # write, maintain, or admin access. Update here if teams change.
          DISCIPLINE_TEAMS: "bim data-and-ai specialist-consulting structures sustainability-physics prototypes"
        run: bash .github/scripts/sync-repo-topics.sh repo-list.txt
