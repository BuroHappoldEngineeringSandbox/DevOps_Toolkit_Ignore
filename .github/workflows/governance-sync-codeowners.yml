name: Sync CODEOWNERS

# Manually triggered — run this once team assignments have settled to open
# PRs that update .github/CODEOWNERS in each target repo to reflect the
# current GitHub team assignments.
#
# PRs are opened as the DevOps GitHub App. Each PR targets the repo's
# develop branch and must be reviewed and merged by the platform team
# (who are the CODEOWNERS of .github/ in every repo).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to target (e.g. BHoM_Adapter). Leave blank to use team scope or all repos.'
        type: string
        required: false
        default: ''
      team:
        description: 'Team slug to target (e.g. structures). Syncs all repos owned by that team. Leave blank for all repos.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run — list affected repos without opening PRs'
        type: boolean
        required: false
        default: false

# Never cancel a sync mid-flight; a partial run leaves repos in
# inconsistent states. Let the current run finish before starting another.
concurrency:
  group: sync-codeowners
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # DevOps_Toolkit checkout only; target repo writes use app token.

    steps:
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # Generates a short-lived (1 h) installation token scoped to the org.
      # Required secrets (org-level): BHOM_APP_ID, BHOM_APP_PRIVATE_KEY.
      # Required App permissions: Contents (rw), Pull requests (rw), Organisation Members (read).
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve target repos
        id: repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SINGLE_REPO: ${{ inputs.repo }}
          SINGLE_TEAM: ${{ inputs.team }}
        run: |
          if [ -n "${SINGLE_REPO}" ]; then
            echo "${SINGLE_REPO}" > repo-list.txt
            echo "::notice::Single-repo mode — targeting ${SINGLE_REPO}."
          elif [ -n "${SINGLE_TEAM}" ]; then
            yq eval ".teams[\"${SINGLE_TEAM}\"] // [] | .[]" config/repo-ownership.yml > repo-list.txt 2>/dev/null || true
            COUNT=$(wc -l < repo-list.txt | tr -d ' ')
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::Team '${SINGLE_TEAM}' has no repos in config/repo-ownership.yml. Check the team slug and re-run."
              exit 1
            fi
            REPOS=$(tr '\n' ', ' < repo-list.txt | sed 's/,$//')
            echo "::notice::Team-scope mode — targeting ${COUNT} repo(s) for team '${SINGLE_TEAM}': ${REPOS}."
          else
            gh api "orgs/${ORG}/repos?type=public&per_page=100" \
              --paginate \
              --jq '.[] | select(.archived == false) | .name' \
              | grep -v "^DevOps_Toolkit$" \
              | sort -u \
              > repo-list.txt

            COUNT=$(wc -l < repo-list.txt | tr -d ' ')
            echo "::notice::${COUNT} target repo(s) found."

            # Warn about repos in the ownership map that no longer exist in the org.
            while IFS=$'\t' read -r _team map_repo; do
              [ -z "$map_repo" ] && continue
              if ! grep -qx "$map_repo" repo-list.txt; then
                echo "::warning::'${map_repo}' is listed in config/repo-ownership.yml but was not found in the org. Remove or update the entry."
              fi
            done < <(yq eval '.teams | to_entries | .[] | .key as $team | .value[] | [$team, .] | @tsv' config/repo-ownership.yml 2>/dev/null || true)
          fi

      - name: Sync CODEOWNERS
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/sync-codeowners.sh repo-list.txt
