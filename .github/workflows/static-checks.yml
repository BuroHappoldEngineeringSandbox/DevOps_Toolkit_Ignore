name: Static Checks

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
      compliance_checks:
        type: string
        required: false
        default: "code copyright documentation"
        # Space-separated list of compliance checks to run.
        # Valid values: code, copyright, documentation
        # Example — skip copyright for non-BHoM orgs: "code documentation"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          with:
            fetch-depth: 0

        - name: Run .NET Format
          uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/dotnet-format@main
          with:
            dotnet-version: ${{ inputs.dotnet-version || '8.x' }}

  compliance:
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/compliance.yml@main
    with:
      compliance_checks: ${{ inputs.compliance_checks }}
    secrets: inherit
