name: Static Checks

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: "8.x"
      working-directory:
        type: string
        default: '.'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - name: Run .NET Format
          uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/dotnet-format@main
          with:
            dotnet_version: ${{ inputs.dotnet_version }}
            working-directory: ${{ inputs.working-directory }}