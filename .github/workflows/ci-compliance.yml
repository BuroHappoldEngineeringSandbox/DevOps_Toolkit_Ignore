name: Compliance

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
      configuration:
        type: string
        required: true
      compliance_checks:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-compliance
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      # PR diff vs base SHA (two-dot); shallow fetch avoids merge-base issues on fetch-depth:1.
      - name: Compute changed files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — compliance checks skipped."
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") -or $_.ToLower().EndsWith(".csproj") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count relevant file(s) changed — running compliance."
            Get-Content changed_files.txt
          } else {
            Write-Host "::notice::No relevant files changed (.cs / .csproj) — skipping compliance."
          }

      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare ComplianceRunner
        if: steps.changed.outputs.count != '0'
        id: runner
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/prepare-runner@main
        with:
          runner_project: src/ComplianceRunner/ComplianceRunner.csproj
          output_dir:     out\runner
          configuration:  ${{ inputs.configuration }}
          cache_prefix:   compliance-runner

      - name: Run compliance checks
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runnerExe = "${{ steps.runner.outputs.runner_exe }}"
          $orgUrl    = "${{ github.server_url }}/${{ github.repository }}"

          $fileList = @(Get-Content changed_files.txt | ForEach-Object { $_ -replace '/', '\' })
          [string[]]$checks = @("${{ inputs.compliance_checks }}".Trim() -split '\s+' | Where-Object { $_ -ne '' })

          Write-Host "::notice title=Compliance checks::Running ($($checks.Length)): $($checks -join ', ')"

          if ($fileList.Count -eq 0) {
            Write-Host "::warning::changed_files.txt is empty — no files to check. Skipping compliance runner."
            "sarif_generated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $anyFailure   = 0
          $checkResults = [System.Collections.Generic.List[hashtable]]::new()

          foreach ($check in $checks) {
            Write-Host "::group::BHoM $check compliance"
            & $runnerExe $check --output github --org-url "$orgUrl" @fileList
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { $anyFailure = 1 }
            Write-Host "::endgroup::"
            $checkResults.Add(@{ Check = $check; Ok = $ok })
          }

          $sarifDir = "compliance-sarifs"
          New-Item -ItemType Directory -Force -Path $sarifDir | Out-Null
          Write-Host "::group::SARIF export"
          foreach ($check in $checks) {
            & $runnerExe $check --output sarif --sarif-file "$sarifDir\compliance-$check.sarif" --org-url "$orgUrl" @fileList
          }
          Write-Host "::endgroup::"

          $sarifGenerated = (@(Get-ChildItem $sarifDir -Filter "*.sarif" -ErrorAction SilentlyContinue).Count -gt 0).ToString().ToLower()
          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            $mdLines = @("### Compliance check results", "", "| Check | Result |", "|---|---|")
            foreach ($r in $checkResults) {
              $icon   = if ($r.Ok) { ":white_check_mark:" } else { ":x:" }
              $status = if ($r.Ok) { "Passed" } else { "**Failed**" }
              $mdLines += "| $($r.Check) | $icon $status |"
            }
            $mdLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if ($anyFailure -ne 0) {
            Write-Host "::error::One or more compliance checks failed."
            exit 1
          }

      - name: Upload SARIF (per check)
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($sarifFile in Get-ChildItem compliance-sarifs -Filter "*.sarif" -ErrorAction SilentlyContinue) {
            $checkName = $sarifFile.BaseName -replace '^compliance-', ''
            $category  = "bhom-compliance-$checkName-pr-delta"

            $sarifJson = Get-Content $sarifFile.FullName -Raw | ConvertFrom-Json -Depth 20
            foreach ($run in $sarifJson.runs) {
              if ($null -eq $run.PSObject.Properties["automationDetails"]) {
                $run | Add-Member -NotePropertyName "automationDetails" `
                                  -NotePropertyValue ([pscustomobject]@{ id = $category }) -Force
              } else {
                $run.automationDetails.id = $category
              }
            }
            $patchedSarif = $sarifJson | ConvertTo-Json -Depth 20 -Compress

            $bytes   = [System.Text.Encoding]::UTF8.GetBytes($patchedSarif)
            $ms      = [System.IO.MemoryStream]::new()
            $gz      = [System.IO.Compression.GZipStream]::new($ms, [System.IO.Compression.CompressionMode]::Compress)
            $gz.Write($bytes, 0, $bytes.Length)
            $gz.Close()
            $encoded = [System.Convert]::ToBase64String($ms.ToArray())

            gh api "repos/${{ github.repository }}/code-scanning/sarifs" `
              -X POST `
              --field "sarif=$encoded" `
              --field "ref=${{ github.ref }}" `
              --field "commit_sha=${{ github.sha }}" `
              --field "tool_name=BHoM Compliance - $checkName"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::SARIF upload failed for check: $checkName"
            } else {
              Write-Host "Uploaded SARIF for check: $checkName (category: $category)"
            }
          }
