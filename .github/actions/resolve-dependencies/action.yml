name: "Resolve Dependencies (BHoM)"
description: "Clones dependency graphs (two-phase), computes order, builds, caches, and publishes assemblies."
inputs:
  deps_file:
    description: "Path to the root dependencies file in the caller repo"
    required: false
    default: "dependencies.txt"
  extra_repos:
    description: "Newline-separated owner/repo[@ref] for Phase B seeding"
    required: false
    default: ""
  dotnet_version:
    description: ".NET SDK version spec"
    required: false
    default: "10.x"
  configuration:
    description: "Build configuration"
    required: false
    default: "Release"
  token:
    description: "GitHub App token/PAT (falls back to GITHUB_TOKEN if blank)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: "6.x"

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        key: ${{ runner.os }}-nuget-${{ inputs.dotnet_version }}-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Compute environment
      shell: pwsh
      run: |
        $tok = '${{ inputs.token }}'
        if ([string]::IsNullOrWhiteSpace($tok)) { $tok = '${{ github.token }}' }
        "DEP_TOKEN=$tok" | Out-File -FilePath $env:GITHUB_ENV -Append
        "CONFIGURATION=${{ inputs.configuration }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Prepare folders
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path deps | Out-Null
        New-Item -ItemType Directory -Force -Path deps-assemblies | Out-Null
        New-Item -ItemType File -Force -Path deps/_shas.txt | Out-Null
        if (Test-Path deps/_order.txt)     { Remove-Item deps/_order.txt -Force }
        if (Test-Path deps/_selection.txt) { Remove-Item deps/_selection.txt -Force }

    - name: Resolve dependency graph (Two-phase)
      shell: pwsh
      env:
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Resolve-DependencyGraph.ps1"
        & $script -DepsFile "${{ inputs.deps_file }}" -ExtraRepos "${{ inputs.extra_repos }}"

    - name: Compute composite cache key from dependency SHAs
      id: shas
      shell: pwsh
      run: |
        if (-not (Test-Path 'deps/_shas.txt')) {
          Write-Host "No dependency SHAs recorded — using empty key."
          "keypart=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }
        $pairs = Get-Content 'deps/_shas.txt' | Where-Object { $_ -match '\S+\s+[0-9a-f]+' }
        $keypart = ($pairs | Sort-Object | ForEach-Object {
          $t = $_.Trim() -split '\s+'
          "$($t[0])@$($t[1])"
        }) -join ';'
        "keypart=$keypart" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Restore cache (deps-assemblies)
      id: cache
      uses: actions/cache@v4
      with:
        path: deps-assemblies
        key: depsasm-${{ runner.os }}-${{ inputs.dotnet_version }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

    - name: Build dependencies (on cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Build-Dependencies.ps1"
        & $script -Configuration "${{ inputs.configuration }}"

    - name: Upload dependency assemblies
      uses: actions/upload-artifact@v4
      with:
        name: deps-assemblies
        path: deps-assemblies/**
        retention-days: 7
        if-no-files-found: warn