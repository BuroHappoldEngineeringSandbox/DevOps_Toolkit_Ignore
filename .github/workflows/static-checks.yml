name: Static Checks

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
          with:
            fetch-depth: 0

        - name: Run .NET Format
          uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/dotnet-format@main
          with:
            dotnet-version: ${{ inputs.dotnet-version || '8.x' }}

