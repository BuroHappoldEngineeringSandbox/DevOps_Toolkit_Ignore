name: BHoM Build Workflow

on:
  workflow_call:
    inputs:
      repository_name:
        description: 'Name of the repository being built'
        required: true
        type: string
      branch_name:
        description: 'Branch name being built'
        required: true
        type: string
      dotnet_version:
        description: '.NET version to use'
        required: false
        type: string
        default: '8.0.x'

    secrets:
      GH_TOKEN:
        description: 'GitHub token for accessing artifacts from other repositories (PAT or GitHub App token). If not provided, will only access public repositories.'
        required: false
      APP_ID:
        description: 'GitHub App ID (alternative to GH_TOKEN)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (alternative to GH_TOKEN)'
        required: false

concurrency:  # cancel in progress runs if this workflow is triggered again. Makes sure new commits cancel previous runs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-configurations-and-dependencies:
    runs-on: ubuntu-latest
    outputs:
      build-configurations: ${{ steps.discover-configs.outputs.build-configurations }}
      release-configurations: ${{ steps.discover-configs.outputs.release-configurations }}
      dependencies-built: ${{ steps.build-summary.outputs.dependencies-built }}
      changed-files: ${{ steps.get-changed-files.outputs.changed-files }}
      missing-dependencies: ${{ steps.download-deps.outputs.missing-dependencies }}
      branch-map: ${{ steps.determine-branches.outputs.branch-map }}
    env:
      BHoMFolder: "/tmp/BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Discover build configurations
        id: discover-configs
        run: |
          # Find the .sln file in the current directory
          sln_files=$(find . -maxdepth 1 -name "*.sln" -type f)
          
          if [ -z "$sln_files" ]; then
            echo "✗ No .sln file found in root directory" >&2
            echo "build-configurations=[]" >> $GITHUB_OUTPUT
            echo "release-configurations=[]" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          sln_count=$(echo "$sln_files" | wc -l)
          if [ $sln_count -gt 1 ]; then
            echo "⚠ Multiple .sln files found, using the first one" >&2
          fi
          
          sln_file=$(echo "$sln_files" | head -n1)
          echo "Analyzing solution file: $(basename "$sln_file")"
          
          # Parse solution file to find build configurations
          configs=""
          release_configs=""
          in_config_section=false
          
          while IFS= read -r line; do
            if [[ $line == *"GlobalSection(SolutionConfigurationPlatforms)"* ]]; then
              in_config_section=true
              continue
            fi
            if $in_config_section && [[ $line == *"EndGlobalSection"* ]]; then
              break
            fi
            if $in_config_section && [[ $line =~ ^[[:space:]]*([^=]+)[[:space:]]*= ]]; then
              full_config="${BASH_REMATCH[1]}"
              full_config=$(echo "$full_config" | xargs)  # trim whitespace
              if [[ $full_config == *"|"* ]]; then
                config=$(echo "$full_config" | cut -d'|' -f1 | xargs)
              else
                config="$full_config"
              fi
              
              if [[ ! $configs == *"\"$config\""* ]]; then
                if [ -n "$configs" ]; then
                  configs="$configs,"
                fi
                configs="$configs\"$config\""
                echo "Found build configuration: $config"
                
                # Check if it's a Release configuration
                if [[ $config == Release* ]]; then
                  if [ -n "$release_configs" ]; then
                    release_configs="$release_configs,"
                  fi
                  release_configs="$release_configs\"$config\""
                  echo "  → Identified as Release configuration"
                fi
              fi
            fi
          done < "$sln_file"
          
          if [ -z "$configs" ]; then
            echo "⚠ No build configurations found in solution file, using default"
            configs='"Debug","Release"'
            release_configs='"Release"'
          fi
          
          echo -e "\nDiscovered build configurations: [$configs]"
          echo "Release configurations: [$release_configs]"
          
          echo "build-configurations=[$configs]" >> $GITHUB_OUTPUT
          echo "release-configurations=[$release_configs]" >> $GITHUB_OUTPUT
        shell: bash



      - name: Parse dependencies
        id: parse-deps
        run: |
          if [ -f "dependencies.txt" ]; then
            deps=$(grep -v '^#' dependencies.txt | grep -v '^[[:space:]]*$' | jq -R . | jq -s -c .)
            echo "dependencies=$deps" >> $GITHUB_OUTPUT
          else
            echo "dependencies=[]" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Get changed files
        id: get-changed-files
        run: |
          branch_name='${{ inputs.branch_name }}'
          echo "Current branch: $branch_name"
          
          if [ "$branch_name" = "develop" ]; then
            echo "Running on develop branch - no changed files to track"
            echo "changed-files=" >> $GITHUB_OUTPUT
          else
            echo "Getting list of changed files compared to develop..."
            
            # Fetch develop branch for comparison
            if git fetch origin develop:develop 2>/dev/null; then
              echo "Successfully fetched develop branch, comparing files..."
                
                # Debug: Show current commit and develop commit
              current_commit=$(git rev-parse HEAD)
              develop_commit=$(git rev-parse develop)
              echo "Current commit: $current_commit"
              echo "Develop commit: $develop_commit"
              
              # Compare current branch (HEAD) with develop
              changed_files=$(git diff --name-only --diff-filter=ACMRT develop HEAD 2>/dev/null || true)
              
              if [ -n "$changed_files" ]; then
                echo "Found changed files (excluding deletions):"
                echo "$changed_files" | head -5
                file_count=$(echo "$changed_files" | wc -l)
                if [ $file_count -gt 5 ]; then
                  echo "... and $((file_count - 5)) more files"
                fi
                
              # Use relative paths (no conversion to absolute paths)
              relative_paths=""
              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  if [ -n "$relative_paths" ]; then
                    relative_paths="$relative_paths;$file"
                  else
                    relative_paths="$file"
                  fi
                fi
              done <<< "$changed_files"
              
              echo "changed-files=$relative_paths" >> $GITHUB_OUTPUT
              else
                echo "No changes found compared to develop branch (this is normal)"
                echo "changed-files=" >> $GITHUB_OUTPUT
              fi
            else
              echo "⚠ Could not fetch develop branch, skipping changed files detection"
              echo "changed-files=" >> $GITHUB_OUTPUT
            fi
          fi
        shell: bash

      - name: Create BHoM folder
        run: mkdir -p "$BHoMFolder/Assemblies"
        shell: bash

      - name: Check GitHub App secrets
        id: check-app-secrets
        run: |
          if [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "app-secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "app-secrets-available=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.check-app-secrets.outputs.app-secrets-available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Determine dependency branches
        id: determine-branches
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          dependencies='${{ steps.parse-deps.outputs.dependencies }}'
          branch_name='${{ inputs.branch_name }}'
          
          echo "Determining branches for dependencies..."
          echo "Target branch: $branch_name"
          
          # URL encode the branch name for API calls
          encoded_branch_name=$(printf '%s' "$branch_name" | jq -sRr @uri)
          
          branch_map="{}"
          
          if [ "$dependencies" != "[]" ] && [ "$dependencies" != "null" ]; then
            for dep in $(echo "$dependencies" | jq -r '.[]'); do
              echo "Checking branch availability for $dep"

            # Check if target branch exists in the dependency repo
              if gh api "/repos/$dep/branches/$encoded_branch_name" >/dev/null 2>&1; then
                echo "  ✓ Branch '$branch_name' exists"
                branch_map=$(echo "$branch_map" | jq --arg dep "$dep" --arg branch "$branch_name" '. + {($dep): $branch}')
              else
                echo "  → Falling back to 'develop' branch"
                branch_map=$(echo "$branch_map" | jq --arg dep "$dep" '. + {($dep): "develop"}')
              fi
            done
          fi
          
          echo -e "\nBranch mapping for dependencies:"
          echo "$branch_map" | jq -r 'to_entries[] | "  \(.key) → \(.value)"'
          
          echo "branch-map=$(echo "$branch_map" | jq -c .)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download dependency artifacts
        id: download-deps
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          dependencies='${{ steps.parse-deps.outputs.dependencies }}'
          branch_map='${{ steps.determine-branches.outputs.branch-map }}'
          downloaded_artifacts="[]"
          missing_dependencies="[]"
          
          # Determine authentication method
          if [ -n '${{ steps.generate-token.outputs.token }}' ]; then
            echo "Using GitHub App authentication"
          elif [ -n '${{ secrets.GH_TOKEN }}' ]; then
            echo "Using provided token"
          else
            echo "Using default GITHUB_TOKEN"
          fi
          
          echo "Downloading artifacts using pre-determined branches..."
          
          if [ "$dependencies" != "[]" ] && [ "$dependencies" != "null" ]; then
            for dep in $(echo "$dependencies" | jq -r '.[]'); do
              target_branch=$(echo "$branch_map" | jq -r --arg dep "$dep" '.[$dep]')
              echo "Processing dependency: $dep (branch: $target_branch)"
              
              # Get latest run of the BHoM Build Workflow for the target branch
              if ! runs_response=$(gh api "/repos/$dep/actions/runs?per_page=50" 2>/dev/null); then
                echo "No access to $dep on $target_branch - will need to build"
                missing_dependencies=$(echo "$missing_dependencies" | jq --arg dep "$dep" '. + [$dep]')
                continue
              fi
              
              # Find CI Build and Test workflow runs
              workflow_runs=$(echo "$runs_response" | jq -r --arg branch "$target_branch" '.workflow_runs[] | select(.head_branch == $branch and .name == "CI Build and Test") | .id' | head -1)
              
              if [ -z "$workflow_runs" ]; then
                echo "No CI Build and Test workflow runs found for $dep on $target_branch - will need to build"
                missing_dependencies=$(echo "$missing_dependencies" | jq --arg dep "$dep" '. + [$dep]')
                continue
              fi
              
              run_id="$workflow_runs"
              echo "Found latest CI Build and Test workflow run: $run_id for $dep on $target_branch"
              
              # Get Release configurations to try
              release_configs='${{ steps.discover-configs.outputs.release-configurations }}'
              if [ "$release_configs" = "[]" ] || [ "$release_configs" = "null" ]; then
                release_configs='["Release"]'
              fi
              
              found=false
              wait_attempts=0
              max_wait_attempts=30
              
              # Check for artifacts, even if workflow is still running
              while [ $wait_attempts -le $max_wait_attempts ] && [ "$found" = "false" ]; do
                if [ $wait_attempts -gt 0 ]; then
                  echo "Wait attempt $wait_attempts/$max_wait_attempts - checking for artifacts..."
                  sleep 15
                fi
                
                # Check if artifacts are available
                if artifacts_response=$(gh api "/repos/$dep/actions/runs/$run_id/artifacts" 2>/dev/null); then
                  artifact_count=$(echo "$artifacts_response" | jq '.artifacts | length')
                  
                  if [ "$artifact_count" -gt 0 ]; then
                    echo "Run has $artifact_count artifacts available"
                    
                    # Look for artifacts with priority: matching configs first, then fallback to "Release"
                    artifacts_found=0
                    
                    # First priority: Try to find artifacts that match our release configurations
                    for release_config in $(echo "$release_configs" | jq -r '.[]'); do
                      artifact_name="build-outputs-$target_branch-$release_config"
                      echo "Looking for matching configuration artifact: $artifact_name"
                      
                      artifact_id=$(echo "$artifacts_response" | jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .id')
                      
                      if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                        echo "✓ Found matching artifact: $artifact_name from $dep"
                        dep_safe=$(echo "$dep" | tr '/' '_')
                        
                        # Download and extract to unique folder for this config
                        gh api "/repos/$dep/actions/artifacts/$artifact_id/zip" > "${dep_safe}_${release_config}_artifact.zip"
                        mkdir -p "dependencies/${dep_safe}_${release_config}"
                        unzip -q "${dep_safe}_${release_config}_artifact.zip" -d "dependencies/${dep_safe}_${release_config}"
                        
                        # Copy to BHoM folder
                        if [ -d "dependencies/${dep_safe}_${release_config}" ]; then
                          cp -r dependencies/${dep_safe}_${release_config}/* "$BHoMFolder/" 2>/dev/null || true
                        fi
                        
                        echo "✓ Successfully downloaded matching artifact for $dep configuration $release_config"
                        artifacts_found=$((artifacts_found + 1))
                        found=true
                      fi
                    done
                    
                    # Second priority: If no matching configs found, try fallback to "Release"
                    if [ "$artifacts_found" -eq 0 ]; then
                      fallback_artifact="build-outputs-$target_branch-Release"
                      echo "No matching configurations found, trying fallback: $fallback_artifact"
                      
                      fallback_id=$(echo "$artifacts_response" | jq -r --arg name "$fallback_artifact" '.artifacts[] | select(.name == $name) | .id')
                      
                      if [ -n "$fallback_id" ] && [ "$fallback_id" != "null" ]; then
                        echo "✓ Found fallback artifact: $fallback_artifact from $dep"
                        dep_safe=$(echo "$dep" | tr '/' '_')
                        
                        # Download and extract fallback artifact
                        gh api "/repos/$dep/actions/artifacts/$fallback_id/zip" > "${dep_safe}_Release_artifact.zip"
                        mkdir -p "dependencies/${dep_safe}_Release"
                        unzip -q "${dep_safe}_Release_artifact.zip" -d "dependencies/${dep_safe}_Release"
                        
                        # Copy to BHoM folder
                        if [ -d "dependencies/${dep_safe}_Release" ]; then
                          cp -r dependencies/${dep_safe}_Release/* "$BHoMFolder/" 2>/dev/null || true
                        fi
                        
                        echo "✓ Successfully downloaded fallback Release artifact for $dep"
                        artifacts_found=1
                        found=true
                      fi
                    fi
                    
                    if [ "$found" = "true" ]; then
                      echo "✓ Downloaded $artifacts_found artifact(s) for $dep"
                      break
                    fi
                  fi
                fi
                
                # Check if workflow is completed
                if run_status=$(gh api "/repos/$dep/actions/runs/$run_id" 2>/dev/null); then
                  status=$(echo "$run_status" | jq -r '.status')
                  if [ "$status" = "completed" ] && [ "$found" = "false" ]; then
                    echo "✗ No suitable artifacts found for $dep - will need to build"
                    missing_dependencies=$(echo "$missing_dependencies" | jq --arg dep "$dep" '. + [$dep]')
                      break
                  elif [ "$status" = "in_progress" ] || [ "$status" = "queued" ]; then
                    if [ $wait_attempts -eq 0 ]; then
                      echo "Run $run_id is still running, will check for artifacts while waiting..."
                    fi
                    wait_attempts=$((wait_attempts + 1))
                  else
                    break
                  fi
                else
                  break
                fi
              done
              
              if [ "$found" = "true" ]; then
                echo "✓ Completed artifact downloads for $dep"
              else
                if [ $wait_attempts -gt $max_wait_attempts ]; then
                  echo "✗ Run did not complete or produce artifacts after $max_wait_attempts wait attempts - will need to build"
                  missing_dependencies=$(echo "$missing_dependencies" | jq --arg dep "$dep" '. + [$dep]')
                else
                  echo "✗ No suitable artifacts found for $dep - will need to build"
                  missing_dependencies=$(echo "$missing_dependencies" | jq --arg dep "$dep" '. + [$dep]')
                fi
              fi
            done
          fi
          
          # Output results
          downloaded_count=$(echo "$downloaded_artifacts" | jq 'length')
          missing_count=$(echo "$missing_dependencies" | jq 'length')
          echo "artifacts-downloaded=$(echo "$downloaded_artifacts" | jq -r 'join(",")')" >> $GITHUB_OUTPUT
          echo "missing-dependencies=$(echo "$missing_dependencies" | jq -c .)" >> $GITHUB_OUTPUT
          echo "✓ Artifact resolution completed. Downloaded: $downloaded_count dependencies, Missing: $missing_count dependencies"
        shell: bash

      - name: Upload dependencies artifact
        id: build-summary
        run: |
          missing_count=$(echo '${{ steps.download-deps.outputs.missing-dependencies }}' | jq 'length')
          
          if [ "$missing_count" -gt 0 ]; then
            echo "dependencies-built=incomplete" >> $GITHUB_OUTPUT
            echo "Some dependencies missing artifacts - marking as incomplete"
          else
            echo "dependencies-built=complete" >> $GITHUB_OUTPUT
            echo "All dependencies have artifacts - marking as complete"
          fi
        shell: bash

      - name: Create status files for artifact
        if: always()
        run: |
          # Create status files in BHoM folder
          echo '${{ steps.build-summary.outputs.dependencies-built }}' > "$BHoMFolder/status.txt"
          echo '${{ steps.download-deps.outputs.missing-dependencies }}' > "$BHoMFolder/missing-dependencies.json"
        shell: bash

      - name: Upload complete dependencies artifact
        if: steps.build-summary.outputs.dependencies-built == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}
          retention-days: 1
          compression-level: 6

      - name: Upload incomplete dependencies artifact
        if: steps.build-summary.outputs.dependencies-built == 'incomplete'
        uses: actions/upload-artifact@v4
        with:
          name: Dependencies-Incomplete
          path: ${{ env.BHoMFolder }}
          retention-days: 1
          compression-level: 6

  build-dependencies-with-no-artifacts:
    runs-on: windows-latest
    needs: setup-configurations-and-dependencies
    if: needs.setup-configurations-and-dependencies.outputs.dependencies-built == 'incomplete'
    outputs:
      dependencies-built: ${{ steps.final-build-summary.outputs.dependencies-built }}
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2.0.1

      - name: Create BHoM folder
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Download incomplete dependencies artifact
        uses: actions/download-artifact@v4
        with:
          name: Dependencies-Incomplete
          path: ${{ env.BHoMFolder }}

      - name: Get missing dependencies list
        id: get-missing-deps
        run: |
          $missingDeps = Get-Content "$env:BHoMFolder\missing-dependencies.json" | ConvertFrom-Json
          $missingDepsString = $missingDeps -join ","
          echo "missing-deps=$missingDepsString" >> $env:GITHUB_OUTPUT
          Write-Host "Missing dependencies: $missingDepsString"
        shell: pwsh

      - name: Check GitHub App secrets
        id: check-app-secrets
        run: |
          if [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "app-secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "app-secrets-available=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.check-app-secrets.outputs.app-secrets-available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Clone missing dependencies
        shell: pwsh
        env:
            GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
            $missingDeps = '${{ steps.get-missing-deps.outputs.missing-deps }}' -split ',' | Where-Object { $_ -ne '' }
            $branchMap   = '${{ needs.setup-configurations-and-dependencies.outputs.branch-map }}' | ConvertFrom-Json

            if ($missingDeps.Count -eq 0) {
            Write-Host "No missing dependencies to clone"
            exit 0
            }

            New-Item -ItemType Directory -Force -Path "Repositories" | Out-Null

            foreach ($dep in $missingDeps) {
            $target_branch = $branchMap.$dep
            Write-Host "Processing missing dependency: $dep (branch: $target_branch)"

            $repo_name = $dep.Split('/')[-1]
            $repo_url  = "https://github.com/$dep.git"

            try {
                git clone $repo_url "Repositories/$repo_name"
                Push-Location "Repositories/$repo_name"
                git checkout "$target_branch"
                Pop-Location

                $sln_files = Get-ChildItem "Repositories/$repo_name" -Filter '*.sln' -File
                if ($sln_files.Count -gt 0) {
                Add-Content "valid_repos.txt" $repo_name -Encoding UTF8
                } else {
                Write-Host "✗ No .sln file in $repo_name base folder - Repo not built"
                }
            } catch {
                Write-Host "Failed to clone $repo_name"
            }
            }

            if (Test-Path "valid_repos.txt") {
            Write-Host "Valid repositories to compile:"
            Get-Content "valid_repos.txt"
            } else {
            Write-Host "No valid repositories found with .sln files"
            }

      - name: Analyze dependency order
        run: |
          if (!(Test-Path "valid_repos.txt")) {
            Write-Host "No valid repositories to analyze"
            exit 0
          }
          
          # Read all valid repositories
          $validRepos = Get-Content "valid_repos.txt" | ForEach-Object { $_.Trim() }
          Write-Host "Analyzing dependency order for $($validRepos.Count) repositories..."
          
          # Create dependency map
          $dependencyMap = @{}
          
          foreach ($repo in $validRepos) {
            $dependencyMap[$repo] = @()
            $depsFile = "Repositories\$repo\dependencies.txt"
            
            if (Test-Path $depsFile) {
              Write-Host "Found dependencies.txt in $repo"
              $repoDeps = Get-Content $depsFile | ForEach-Object { 
                $line = $_.Trim()
                if (![string]::IsNullOrWhiteSpace($line) -and !$line.StartsWith("#")) {
                  # Extract just the repo name from ORG/REPO format
                  $repoName = $line.Split('/')[-1]
                  return $repoName
                }
              } | Where-Object { $_ -ne $null }
              
              # Only include dependencies that are in our valid repos list
              $validDeps = $repoDeps | Where-Object { $validRepos -contains $_ }
              $dependencyMap[$repo] = $validDeps
              
              if ($validDeps.Count -gt 0) {
                Write-Host "$repo depends on: $($validDeps -join ', ')"
              } else {
                Write-Host "$repo has no dependencies in current build set"
              }
            } else {
              Write-Host "$repo has no dependencies.txt file"
            }
          }
          
          # Topological sort to determine build order
          $script:buildOrder = @()
          $script:visited = @{}
          $script:visiting = @{}
          
          function Get-BuildOrder {
            param([string]$repo)
            
            Write-Host "Processing $repo for build order..." -ForegroundColor Cyan
            
            if ($script:visiting.ContainsKey($repo)) {
              Write-Host "⚠ Circular dependency detected involving $repo" -ForegroundColor Yellow
              return $false
            }
            
            if ($script:visited.ContainsKey($repo)) {
              Write-Host "$repo already processed" -ForegroundColor Gray
              return $true
            }
            
            $script:visiting[$repo] = $true
            Write-Host "Visiting dependencies of $repo..."
            
            # Visit all dependencies first
            if ($dependencyMap.ContainsKey($repo) -and $dependencyMap[$repo].Count -gt 0) {
              Write-Host "$repo has dependencies: $($dependencyMap[$repo] -join ', ')"
              foreach ($dep in $dependencyMap[$repo]) {
                if ($validRepos -contains $dep) {
                  Write-Host "Processing dependency: $dep"
                  $result = Get-BuildOrder -repo $dep
                  if (-not $result) {
                    Write-Host "Failed to process dependency $dep" -ForegroundColor Red
                    return $false
                  }
                } else {
                  Write-Host "Skipping dependency $dep (not in current build set)" -ForegroundColor Yellow
                }
              }
            } else {
              Write-Host "$repo has no dependencies"
            }
            
            $script:visiting.Remove($repo)
            $script:visited[$repo] = $true
            $script:buildOrder += $repo
            Write-Host "Added $repo to build order (position $($script:buildOrder.Count))" -ForegroundColor Green
            return $true
          }
          
          # Process all repositories
          Write-Host "Starting topological sort for $($validRepos.Count) repositories..."
          $sortSuccess = $true
          foreach ($repo in $validRepos) {
            if (-not $script:visited.ContainsKey($repo)) {
              Write-Host "Processing root repository: $repo" -ForegroundColor Magenta
              $result = Get-BuildOrder -repo $repo
              if (-not $result) {
                $sortSuccess = $false
                    break
              }
            }
          }
          
          if (-not $sortSuccess) {
            Write-Host "⚠ Topological sort failed due to circular dependencies. Using original order." -ForegroundColor Yellow
            $script:buildOrder = $validRepos
          }
          
          $buildOrder = $script:buildOrder
          
          # Save build order
          $buildOrder | Out-File "build_order.txt" -Encoding UTF8
          
          Write-Host "Determined build order:"
          for ($i = 0; $i -lt $buildOrder.Count; $i++) {
            Write-Host "  $($i + 1). $($buildOrder[$i])"
          }
        shell: pwsh

      - name: Compile missing dependencies
        run: |
          if (!(Test-Path "build_order.txt")) {
            Write-Host "No build order file found, checking for valid repositories..."
            if (!(Test-Path "valid_repos.txt")) {
              Write-Host "No valid repositories to compile"
              exit 0
            }
            # Fallback to original order if build_order.txt doesn't exist
            Get-Content "valid_repos.txt" | Out-File "build_order.txt" -Encoding UTF8
          }
          
          # Read build order
          $buildOrder = Get-Content "build_order.txt" | ForEach-Object { $_.Trim() } | Where-Object { ![string]::IsNullOrWhiteSpace($_) }
          Write-Host "Building $($buildOrder.Count) repositories in dependency order..."
          
          # Compile each repository in the correct order
          foreach ($repo_name in $buildOrder) {
            Write-Host "Compiling repository: $repo_name"
              
              # Take snapshot of BHoM folder before build
              $preFiles = @{}
            if (Test-Path "$env:BHoMFolder") {
              Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
                  $preFiles[$_.FullName] = $_.LastWriteTime
                }
              }
              
            Push-Location "Repositories\$repo_name"
            
            try {
              # Find .sln files and build using build.ps1
              $slnFiles = Get-ChildItem -Filter "*.sln" -File
              
              if ($slnFiles.Count -eq 0) {
                Write-Host "✗ No .sln file found in $repo_name" -ForegroundColor Red
                exit 1
              }
              
              foreach ($slnFile in $slnFiles) {
                Write-Host "Building $($slnFile.Name) with Release configuration..."
                
                # Inline build logic (since we can't reference files from reusable workflow repo)
                $buildSuccess = $false
                
                # Detect project type and build accordingly
                $projects = @()
                if ($slnFile.Name.EndsWith(".sln")) {
                  # Parse solution for projects
                  $slnContent = Get-Content $slnFile.FullName
                  $projects = $slnContent | Select-String 'Project\(".*"\)\s*=\s*".*?",\s*"(.*?)",\s*".*?"' | ForEach-Object {
                    $rel = $_.Matches[0].Groups[1].Value
                    if ($rel -and $rel.EndsWith(".csproj", [StringComparison]::OrdinalIgnoreCase)) {
                      Join-Path (Split-Path $slnFile.FullName -Parent) $rel
                    }
                  } | Where-Object { Test-Path $_ }
                }
                
                # Check if any project has packages.config (legacy)
                $hasPackagesConfig = $false
                if ($projects.Count -gt 0) {
                  foreach ($proj in $projects) {
                    $pkgConfig = Join-Path (Split-Path $proj -Parent) "packages.config"
                    if (Test-Path $pkgConfig) {
                      $hasPackagesConfig = $true
                      break
                    }
                  }
                }
                
                # Check if all projects are SDK-style
                $allSdk = $true
                if ($projects.Count -gt 0 -and -not $hasPackagesConfig) {
                  foreach ($proj in $projects) {
                    try {
                      [xml]$xml = Get-Content -LiteralPath $proj
                      if (-not ($xml.Project -and $xml.Project.Sdk)) {
                        $allSdk = $false
                        break
                      }
                    } catch {
                      $allSdk = $false
                      break
                    }
                  }
                }
                
                # Build using appropriate method
                if ($hasPackagesConfig -or -not $allSdk) {
                  Write-Host "Detected legacy project - using NuGet + MSBuild"
                  nuget restore $slnFile.FullName -NonInteractive
                  if ($LASTEXITCODE -eq 0) {
                    msbuild $slnFile.FullName /restore /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /nologo
                    $buildSuccess = ($LASTEXITCODE -eq 0)
                  }
                  } else {
                  Write-Host "Detected SDK-style project - using dotnet"
                  dotnet restore $slnFile.FullName
                    if ($LASTEXITCODE -eq 0) {
                    dotnet build $slnFile.FullName --configuration Release --no-restore --verbosity minimal
                    $buildSuccess = ($LASTEXITCODE -eq 0)
                  }
                }
                
                if ($buildSuccess) {
                  Write-Host "✓ Successfully built $($slnFile.Name)" -ForegroundColor Green
                    } else {
                  Write-Host "✗ Build failed for $($slnFile.Name)" -ForegroundColor Red
                      exit 1
                }
              }
              
              # Capture changes in BHoM folder
              $changedFiles = @()
              if (Test-Path "$env:BHoMFolder") {
                Get-ChildItem "$env:BHoMFolder" -Recurse -File | ForEach-Object {
                  $file = $_.FullName
                  $lastWrite = $_.LastWriteTime
                  
                  # File is new or modified
                  if (-not $preFiles.ContainsKey($file) -or $preFiles[$file] -ne $lastWrite) {
                    $changedFiles += $file
                  }
                }
              }
              
              Write-Host "Dependency $repo_name modified/added $($changedFiles.Count) files in BHoM folder"
              
            } finally {
              Pop-Location
            }
          }
        shell: pwsh

      - name: Upload dependencies artifact
        id: final-build-summary
        run: |
          # Create dependencies artifact from BHoM folder
          if (Test-Path "$env:BHoMFolder") {
            Write-Host "Packaging dependencies from BHoM folder..."
            
            # Count files in BHoM folder
            $files = Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue
            Write-Host "Found $($files.Count) files in BHoM folder to package as dependencies"
            
            if ($files.Count -gt 0) {
              echo "dependencies-built=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
              Write-Host "No files found in BHoM folder"
            }
          } else {
            echo "dependencies-built=false" >> $env:GITHUB_OUTPUT
            Write-Host "BHoM folder does not exist"
          }
        shell: pwsh

      - name: Upload dependencies artifact
        if: steps.final-build-summary.outputs.dependencies-built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}
          retention-days: 1
          compression-level: 6

  build:
    runs-on: windows-latest
    needs: [setup-configurations-and-dependencies, build-dependencies-with-no-artifacts]
    if: always() && (needs.setup-configurations-and-dependencies.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        build-configuration: ${{ fromJson(needs.setup-configurations-and-dependencies.outputs.build-configurations) }}
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2.0.1

      - name: Create BHoM folder
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Download dependencies
        if: needs.setup-configurations-and-dependencies.outputs.dependencies-built == 'complete' || needs.build-dependencies-with-no-artifacts.outputs.dependencies-built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}

      - name: Copy libs folder to BHoM assemblies TO BE DELETED JUST USED FOR TESTING PURPOSES TO GET ACCESS TO BHOM AND BHOM_ENGINE DLLS
        run: |
          if (Test-Path "libs") {
            Write-Host "Found libs folder, copying DLL files to BHoM assemblies..."
            $libsDlls = Get-ChildItem "libs" -Filter "*.dll" -File -Recurse
            
            if ($libsDlls.Count -gt 0) {
              Write-Host "Found $($libsDlls.Count) DLL files in libs folder:"
              foreach ($dll in $libsDlls) {
                $destinationPath = Join-Path "$env:BHoMFolder\Assemblies" $dll.Name
                Copy-Item $dll.FullName -Destination $destinationPath -Force
                Write-Host "  Copied: $($dll.Name)"
              }
              Write-Host "✓ Successfully copied $($libsDlls.Count) DLL files from libs folder"
            } else {
              Write-Host "No DLL files found in libs folder"
            }
          } else {
            Write-Host "No libs folder found, skipping DLL copy"
          }
        shell: pwsh

      - name: Take pre-build snapshot
        run: |
          # Take snapshot of BHoM folder before build
          $preFiles = @{}
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $preFiles[$_.FullName] = @{
                LastWriteTime = $_.LastWriteTime
                Length = $_.Length
              }
            }
          }
          
          # Save pre-build state to JSON file
          $preFiles | ConvertTo-Json -Depth 3 | Out-File "pre-build-state.json" -Encoding UTF8
          Write-Host "Captured pre-build state: $($preFiles.Count) files"

      - name: Restore and build project
        run: |
          # Find the .sln file in the current directory
          $sln_files = Get-ChildItem -Filter "*.sln" -File
          
          if ($sln_files.Count -eq 0) {
            Write-Host "✗ No .sln file found in root directory" -ForegroundColor Red
            exit 1
          }
          
          if ($sln_files.Count -gt 1) {
            Write-Host "⚠ Multiple .sln files found, using the first one: $($sln_files[0].Name)" -ForegroundColor Yellow
          }
          
          $sln_file = $sln_files[0]
          $configuration = "${{ matrix.build-configuration }}"
          Write-Host "Building solution: $($sln_file.Name) with configuration: $configuration" -ForegroundColor Cyan
          
          # Inline build logic (since we can't reference files from reusable workflow repo)
          $buildSuccess = $false
          
          # Detect project type and build accordingly
          $projects = @()
          if ($sln_file.Name.EndsWith(".sln")) {
            # Parse solution for projects
            $slnContent = Get-Content $sln_file.FullName
            $projects = $slnContent | Select-String 'Project\(".*"\)\s*=\s*".*?",\s*"(.*?)",\s*".*?"' | ForEach-Object {
              $rel = $_.Matches[0].Groups[1].Value
              if ($rel -and $rel.EndsWith(".csproj", [StringComparison]::OrdinalIgnoreCase)) {
                Join-Path (Split-Path $sln_file.FullName -Parent) $rel
              }
            } | Where-Object { Test-Path $_ }
          }
          
          # Check if any project has packages.config (legacy)
          $hasPackagesConfig = $false
          if ($projects.Count -gt 0) {
            foreach ($proj in $projects) {
              $pkgConfig = Join-Path (Split-Path $proj -Parent) "packages.config"
              if (Test-Path $pkgConfig) {
                $hasPackagesConfig = $true
                break
              }
            }
          }
          
          # Check if all projects are SDK-style
          $allSdk = $true
          if ($projects.Count -gt 0 -and -not $hasPackagesConfig) {
            foreach ($proj in $projects) {
              try {
                [xml]$xml = Get-Content -LiteralPath $proj
                if (-not ($xml.Project -and $xml.Project.Sdk)) {
                  $allSdk = $false
                  break
                }
              } catch {
                $allSdk = $false
                break
              }
            }
          }
          
          # Build using appropriate method
          if ($hasPackagesConfig -or -not $allSdk) {
            Write-Host "Detected legacy project - using NuGet + MSBuild"
            nuget restore $sln_file.FullName -NonInteractive
            if ($LASTEXITCODE -eq 0) {
              msbuild $sln_file.FullName /restore /m /p:Configuration=$configuration /p:Platform="Any CPU" /verbosity:minimal /nologo
              $buildSuccess = ($LASTEXITCODE -eq 0)
            }
            } else {
            Write-Host "Detected SDK-style project - using dotnet"
            dotnet restore $sln_file.FullName
            if ($LASTEXITCODE -eq 0) {
              dotnet build $sln_file.FullName --configuration $configuration --no-restore --verbosity minimal
              $buildSuccess = ($LASTEXITCODE -eq 0)
            }
          }
          
          if ($buildSuccess) {
            Write-Host "✓ Build SUCCEEDED for $($sln_file.Name)" -ForegroundColor Green
          } else {
            Write-Host "✗ Build FAILED for $($sln_file.Name)" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Package build outputs
        id: package-outputs
        run: |
          # Load pre-build state
          $preFiles = @{}
          if (Test-Path "pre-build-state.json") {
            $preFiles = Get-Content "pre-build-state.json" -Raw | ConvertFrom-Json -AsHashtable
          }
          
          # Create artifact folder
          New-Item -ItemType Directory -Force -Path "artifact"
          
          # Find all changed/new files in BHoM folder
          $changedFiles = @()
          if (Test-Path "$env:BHoMFolder") {
            Get-ChildItem "$env:BHoMFolder" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
              $file = $_.FullName
              $lastWrite = $_.LastWriteTime
              $length = $_.Length
              
              # Check if file is new or modified
              $isChanged = $false
              if (-not $preFiles.ContainsKey($file)) {
                # New file
                $isChanged = $true
                Write-Host "New file: $($file.Replace("$env:BHoMFolder\", ''))"
              } elseif ($preFiles[$file].LastWriteTime -ne $lastWrite -or $preFiles[$file].Length -ne $length) {
                # Modified file
                $isChanged = $true
                Write-Host "Modified file: $($file.Replace("$env:BHoMFolder\", ''))"
              }
              
              if ($isChanged) {
                $changedFiles += $file
              }
            }
          }
          
          Write-Host "Total changed/new files: $($changedFiles.Count)"
          
          # Copy changed files to artifact, preserving directory structure
          foreach ($file in $changedFiles) {
            $relativePath = $file.Replace("$env:BHoMFolder\", "")
            $destPath = Join-Path "artifact" $relativePath
            $destDir = Split-Path $destPath -Parent
            
            # Create destination directory if it doesn't exist
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            }
            
            # Copy the file
            Copy-Item $file -Destination $destPath -Force
          }
          
          # Also include any files from libs folder that were copied to BHoM assemblies during build
          if (Test-Path "libs") {
            Write-Host "Checking for libs files that may have been copied during build..."
            $libsFiles = Get-ChildItem "libs" -Filter "*" -File -Recurse
            
            foreach ($libFile in $libsFiles) {
              $assemblyPath = Join-Path "$env:BHoMFolder\Assemblies" $libFile.Name
              if (Test-Path $assemblyPath) {
                # Check if this file from libs exists in BHoM assemblies and include it in artifact
                $relativePath = "Assemblies\$($libFile.Name)"
                $destPath = Join-Path "artifact" $relativePath
                $destDir = Split-Path $destPath -Parent
                
                # Create destination directory if it doesn't exist
                if (-not (Test-Path $destDir)) {
                  New-Item -ItemType Directory -Force -Path $destDir | Out-Null
                }
                
                # Copy the file from BHoM assemblies (not from libs, to get the version that was actually used)
                Copy-Item $assemblyPath -Destination $destPath -Force
                Write-Host "  Included libs file in artifact: $($libFile.Name)"
              }
            }
          }
          
          if ($changedFiles.Count -eq 0) {
            Write-Host "No files were changed in $env:BHoMFolder during build"
            # Create empty marker file so artifact isn't empty
            "No files changed during build" | Out-File "artifact\no-changes.txt"
          }
          
          # Collect only the DLL files that were built and changed in this run
          Write-Host "Filtering changed files for DLL assemblies only..."
          
          $updatedDlls = @()
          foreach ($file in $changedFiles) {
            if ($file.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase) -and 
                $file.Contains("$env:BHoMFolder\Assemblies\")) {
              $updatedDlls += $file
              Write-Host "  Found updated assembly: $($file.Replace("$env:BHoMFolder\", ''))"
            }
          }
          
          if ($updatedDlls.Count -gt 0) {
            $updatedDllsString = $updatedDlls -join ';'
            Write-Host "Found $($updatedDlls.Count) updated DLL files for test parameters"
            echo "updated-assemblies=$updatedDllsString" >> $env:GITHUB_OUTPUT
            
            # Save updated assemblies info to BHoM folder with build config suffix
            $updatedDllsString | Out-File "$env:BHoMFolder\updated-assemblies-${{ matrix.build-configuration }}.txt" -Encoding UTF8
          } else {
            Write-Host "No updated DLL files found in assemblies folder"
            echo "updated-assemblies=" >> $env:GITHUB_OUTPUT
            
            # Create empty file for consistency
            "" | Out-File "$env:BHoMFolder\updated-assemblies-${{ matrix.build-configuration }}.txt" -Encoding UTF8
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ inputs.branch_name }}-${{ matrix.build-configuration }}
          path: artifact/
          retention-days: 90
          compression-level: 6

  tests:
    runs-on: windows-latest
    needs: [setup-configurations-and-dependencies, build, build-dependencies-with-no-artifacts]
    if: always() && (needs.build.result == 'success')
    env:
      BHoMFolder: "C:\\ProgramData\\BHoM"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check GitHub App secrets
        id: check-app-secrets
        run: |
          if [ -n "${{ secrets.APP_ID }}" ] && [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then
            echo "app-secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "app-secrets-available=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Generate GitHub App Token
        id: generate-token
        if: steps.check-app-secrets.outputs.app-secrets-available == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create BHoM directory
        run: New-Item -ItemType Directory -Force -Path "$env:BHoMFolder\Assemblies" | Out-Null
        shell: pwsh

      - name: Download dependencies
        if: needs.setup-configurations-and-dependencies.outputs.dependencies-built == 'complete' || needs.build-dependencies-with-no-artifacts.outputs.dependencies-built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Dependencies
          path: ${{ env.BHoMFolder }}

      - name: Download and merge BHoM Assemblies from all release builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-outputs-${{ inputs.branch_name }}-Release*
          path: ${{ env.BHoMFolder }}
          merge-multiple: true

      - name: Download Test Toolkit Tests
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GH_TOKEN || github.token }}
        run: |
          Write-Host "Downloading Test Toolkit Tests from BHoM/Test_Toolkit..."
          
          $targetRepo = "BHoM/Test_Toolkit"
          $branchName = '${{ inputs.branch_name }}'
          $artifactName = "Tests"
          
          # Branch priority order
          $branchesToTry = @(
            $branchName,
            "develop", 
            "Test_Toolkit-InvestigateRunningAllChecksThroughNUnit"
          )
          
          Write-Host "Branch priority order: $($branchesToTry -join ', ')"
          
          $foundArtifact = $false
          
          foreach ($testBranch in $branchesToTry) {
            if ($foundArtifact) { break }
            
            Write-Host "Trying branch: $testBranch"
            
            try {
              # Get recent successful runs from this branch
              $runsResponse = gh api "/repos/$targetRepo/actions/runs?status=success&per_page=10" 2>$null
              if ($runsResponse) {
                $runs = $runsResponse | ConvertFrom-Json
                $branchRuns = $runs.workflow_runs | Where-Object { $_.head_branch -eq $testBranch }
                
                if ($branchRuns -and $branchRuns.Count -gt 0) {
                  Write-Host "Found $($branchRuns.Count) successful runs on branch '$testBranch'"
                  
                  # Check the most recent run for artifacts
                  $latestRun = $branchRuns[0]
                  Write-Host "Checking latest run: $($latestRun.id)"
                  
                  $artifactsResponse = gh api "/repos/$targetRepo/actions/runs/$($latestRun.id)/artifacts" 2>$null
                  if ($artifactsResponse) {
                    $artifacts = $artifactsResponse | ConvertFrom-Json
                    $targetArtifact = $artifacts.artifacts | Where-Object { $_.name -eq $artifactName }
                    
                    if ($targetArtifact) {
                      Write-Host "✓ Found artifact '$artifactName' in run $($latestRun.id) on branch '$testBranch'"
                      
                      # Download the artifact
                      Write-Host "Downloading artifact..."
                      gh api "/repos/$targetRepo/actions/artifacts/$($targetArtifact.id)/zip" > "$artifactName.zip"
                      
                      if (Test-Path "$artifactName.zip") {
                        Write-Host "✓ Successfully downloaded $artifactName.zip"
                        
                        # Create temporary extraction directory
                        $tempExtractDir = "temp_extract"
                        if (Test-Path $tempExtractDir) {
                          Remove-Item $tempExtractDir -Recurse -Force
                        }
                        New-Item -ItemType Directory -Force -Path $tempExtractDir | Out-Null
                        
                        # Extract the artifact to temporary directory first
                        Write-Host "Extracting artifact to temporary directory..."
                        Expand-Archive "$artifactName.zip" -DestinationPath $tempExtractDir -Force
                        
                        # Handle _Tests_ folder content
                        if (Test-Path "$tempExtractDir\_Tests_") {
                          Write-Host "Found _Tests_ folder in artifact, copying content to _Tests_ folder..."
                          
                          # Create/recreate _Tests_ directory
                          if (Test-Path "_Tests_") {
                            Write-Host "Removing existing _Tests_ folder..."
                            Remove-Item "_Tests_" -Recurse -Force
                          }
                          New-Item -ItemType Directory -Force -Path "_Tests_" | Out-Null
                          
                          # Copy content from extracted _Tests_ folder
                          $testsContent = Get-ChildItem "$tempExtractDir\_Tests_" -Recurse
                          if ($testsContent.Count -gt 0) {
                            Copy-Item "$tempExtractDir\_Tests_\*" -Destination "_Tests_" -Recurse -Force
                            Write-Host "✓ Copied $($testsContent.Count) items from artifact _Tests_ folder"
                          } else {
                            Write-Host "Artifact _Tests_ folder is empty"
                          }
                        } else {
                          Write-Host "No _Tests_ folder found in artifact - creating empty _Tests_ folder"
                          if (Test-Path "_Tests_") {
                            Remove-Item "_Tests_" -Recurse -Force
                          }
                          New-Item -ItemType Directory -Force -Path "_Tests_" | Out-Null
                        }
                        
                        # Handle StartupHook folder content
                        if (Test-Path "$tempExtractDir\StartupHook") {
                          Write-Host "Found StartupHook folder in artifact, copying content to BHoM/Assemblies..."
                          $startupHookContent = Get-ChildItem "$tempExtractDir\StartupHook" -Recurse -File
                          
                          if ($startupHookContent.Count -gt 0) {
                            Write-Host "Found $($startupHookContent.Count) files in StartupHook folder:"
                            foreach ($file in $startupHookContent) {
                              $destinationPath = Join-Path "$env:BHoMFolder\Assemblies" $file.Name
                              Copy-Item $file.FullName -Destination $destinationPath -Force
                              Write-Host "  Copied: $($file.Name) to BHoM/Assemblies"
                            }
                            Write-Host "✓ Successfully copied $($startupHookContent.Count) StartupHook files to BHoM/Assemblies"
                          } else {
                            Write-Host "StartupHook folder is empty"
                          }
                        } else {
                          Write-Host "No StartupHook folder found in artifact"
                        }
                        
                        # Clean up temporary directory
                        Remove-Item $tempExtractDir -Recurse -Force
                        
                        # Clean up the downloaded zip
                        Remove-Item "$artifactName.zip" -Force
                        
                        # Show what we extracted
                        Write-Host "✓ Test artifacts extracted to _Tests_ folder:"
                        $testFiles = Get-ChildItem "_Tests_" -Recurse -File | Select-Object -First 5
                        foreach ($file in $testFiles) {
                          $testsPath = (Get-Location).Path + '\_Tests_\'
                          $relativePath = $file.FullName.Replace($testsPath, "")
                          Write-Host "  $relativePath"
                        }
                        if ((Get-ChildItem "_Tests_" -Recurse -File).Count -gt 5) {
                          Write-Host "  ... and $((Get-ChildItem "_Tests_" -Recurse -File).Count - 5) more files"
                        }
                        
                        $foundArtifact = $true
                        break
                      } else {
                        Write-Host "⚠ Failed to download artifact from branch '$testBranch'"
                      }
                    } else {
                      Write-Host "→ No artifact '$artifactName' found in latest run on branch '$testBranch'"
                    }
                  } else {
                    Write-Host "→ Could not get artifacts for latest run on branch '$testBranch'"
                  }
                } else {
                  Write-Host "→ No successful runs found on branch '$testBranch'"
                }
              } else {
                Write-Host "→ Could not access runs for branch '$testBranch'"
              }
            } catch {
              Write-Host "→ Error checking branch '$testBranch': $($_.Exception.Message)"
            }
          }
          
          if (-not $foundArtifact) {
            Write-Host "✗ Could not find Tests artifact from any branch" -ForegroundColor Red
            Write-Host "Tried branches: $($branchesToTry -join ', ')"
            
            # Create empty _Tests_ folder so the workflow can continue
            if (-not (Test-Path "_Tests_")) {
              New-Item -ItemType Directory -Force -Path "_Tests_" | Out-Null
              Write-Host "Created empty _Tests_ folder"
            }
          }
        shell: pwsh

      - name: Identify tests
        id: identify-tests
        run: |
          Write-Host "Reading test DLLs from TestDlls.txt file..."
          
          if (-not (Test-Path "_Tests_")) {
            Write-Host "✗ _Tests_ folder not found" -ForegroundColor Red
            exit 1
          }
          
          $testDllsFile = "_Tests_\TestDlls.txt"
          if (-not (Test-Path $testDllsFile)) {
            Write-Host "✗ TestDlls.txt file not found in _Tests_ folder" -ForegroundColor Red
            exit 1
          }
          
          # Read test DLL names from TestDlls.txt file
          $testDllNames = Get-Content $testDllsFile | Where-Object { 
            ![string]::IsNullOrWhiteSpace($_) 
          } | ForEach-Object { $_.Trim() }
          
          if ($testDllNames.Count -eq 0) {
            Write-Host "✗ No test DLL names found in TestDlls.txt" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "Found $($testDllNames.Count) test DLL name(s) in TestDlls.txt:"
          foreach ($dllName in $testDllNames) {
            Write-Host "  - $dllName"
          }
          
          # Build test DLLs array with full paths
          $testDlls = @()
          foreach ($dllName in $testDllNames) {
            # Remove .dll extension if present to get base name
            $baseName = if ($dllName.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase)) {
              $dllName.Substring(0, $dllName.Length - 4)
            } else {
              $dllName
            }
            
            # Find the DLL file in _Tests_ folder
            $dllFile = Get-ChildItem "_Tests_" -Filter "$baseName.dll" -File -Recurse | Select-Object -First 1
            
            if ($dllFile) {
              Write-Host "✓ Found test DLL: $($dllFile.FullName)"
              $testDlls += @{
                Name = $baseName
                FullPath = $dllFile.FullName
                TestCount = "unknown"
              }
            } else {
              Write-Host "⚠ Could not find DLL file for: $baseName" -ForegroundColor Yellow
            }
          }
          
          if ($testDlls.Count -eq 0) {
            Write-Host "✗ No test DLL files found matching names in TestDlls.txt" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "✓ Successfully identified $($testDlls.Count) test DLL(s) with full paths"
          
          # Convert to JSON for output (maintaining the same format as before)
          $testDllsJson = $testDlls | ConvertTo-Json -Compress
          echo "test-dlls=$testDllsJson" >> $env:GITHUB_OUTPUT
          
          # Also output just the names for matrix strategy
          $testDllNamesOnly = $testDlls | ForEach-Object { $_.Name }
          $testDllNamesJson = $testDllNamesOnly | ConvertTo-Json -Compress
          echo "test-dll-names=$testDllNamesJson" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Run individual tests
        env:
          DOTNET_STARTUP_HOOKS: ${{ env.BHoMFolder }}\Assemblies\TestStartupHook.dll
        run: |
          $testDlls = '${{ steps.identify-tests.outputs.test-dlls }}' | ConvertFrom-Json
          
          if (-not $testDlls -or $testDlls.Count -eq 0) {
            Write-Host "✗ No test DLLs identified" -ForegroundColor Red
            exit 1
          }
          
          # Create test-results directory
          New-Item -ItemType Directory -Force -Path "test-results" | Out-Null
          
          # Find all updated-assemblies-*.txt files from release builds
          $updatedAssembliesFiles = Get-ChildItem "$env:BHoMFolder" -Filter "updated-assemblies-*.txt" -File
          $changedFilesRaw = '${{ needs.setup-configurations-and-dependencies.outputs.changed-files }}'
          
          # Convert relative paths to absolute Windows paths
          $changedFiles = ""
          if ($changedFilesRaw) {
            $workspaceRoot = Get-Location
            $relativePaths = $changedFilesRaw -split ';'
            $absolutePaths = @()
            foreach ($relativePath in $relativePaths) {
              if ($relativePath.Trim()) {
                $absolutePath = Join-Path $workspaceRoot $relativePath.Trim()
                $absolutePaths += $absolutePath
              }
            }
            $changedFiles = $absolutePaths -join ';'
            Write-Host "Converted $($relativePaths.Count) relative paths to absolute Windows paths"
          }
          
          # Current repository in org/repo format
          $currentRepository = '${{ github.repository }}'
          
          $overallSuccess = $true
          $testResults = @()
          
          if ($updatedAssembliesFiles.Count -gt 0) {
            Write-Host "Found $($updatedAssembliesFiles.Count) release build(s) to test"
            
            # Run tests once per release build
            foreach ($updatedAssembliesFile in $updatedAssembliesFiles) {
              # Extract build configuration from filename (updated-assemblies-Release.txt -> Release)
              $buildConfig = $updatedAssembliesFile.BaseName -replace "^updated-assemblies-", ""
              Write-Host "`n=== Running tests for release build: $buildConfig ===" -ForegroundColor Cyan
              
              # Read the updated assemblies for this build
              $updatedAssemblies = Get-Content $updatedAssembliesFile.FullName -Raw
              $updatedAssemblies = $updatedAssemblies.Trim()
              
              # Always pass test parameters (CurrentRepository and optional ones)
              
              foreach ($testDll in $testDlls) {
                Write-Host "Running tests for: $($testDll.Name) (build: $buildConfig)"
                
                $logFileName = "test-results-$($testDll.Name)-$buildConfig.trx"
                Write-Host "Log file: $logFileName"
                
                try {
                  Write-Host "Running with test parameters for $buildConfig"
                  $processArgs = @(
                    "test"
                    "$($testDll.FullPath)"
                    "--verbosity"
                    "normal"
                    "--logger"
                    "trx;LogFileName=$logFileName"
                    "--results-directory"
                    "test-results"
                  )
                  
                  # Add test parameters as separate arguments
                  $processArgs += "--"
                  
                  # Always provide the current repository
                  $processArgs += "TestRunParameters.Parameter(name=`"CurrentRepository`", value=`"$currentRepository`")"
                  
                  # Add UpdatedAssemblies parameter if available
                  if ($updatedAssemblies) {
                    $processArgs += "TestRunParameters.Parameter(name=`"UpdatedAssemblies`", value=`"$updatedAssemblies`")"
                  }
                  
                  # Add UpdatedFiles parameter if available
                  if ($changedFiles) {
                    $processArgs += "TestRunParameters.Parameter(name=`"UpdatedFiles`", value=`"$changedFiles`")"
                  }
                  
                  Write-Host "Executing: dotnet $($processArgs -join ' ')"
                  & dotnet @processArgs
                  
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "✓ Tests passed for $($testDll.Name) ($buildConfig)" -ForegroundColor Green
                    $testResults += @{ Name = "$($testDll.Name)-$buildConfig"; Status = "Passed"; LogFile = $logFileName }
                  } else {
                    Write-Host "⚠ Some tests failed for $($testDll.Name) ($buildConfig)" -ForegroundColor Yellow
                    $overallSuccess = $false
                    $testResults += @{ Name = "$($testDll.Name)-$buildConfig"; Status = "Failed"; LogFile = $logFileName }
                  }
                } catch {
                  Write-Host "✗ Error running tests for $($testDll.Name) ($buildConfig): $($_.Exception.Message)" -ForegroundColor Red
                  $overallSuccess = $false
                  $testResults += @{ Name = "$($testDll.Name)-$buildConfig"; Status = "Error"; LogFile = $logFileName }
                }
              }
              
              # Clean up the updated assemblies file for this build
              Remove-Item $updatedAssembliesFile.FullName -Force
            }
          } else {
            Write-Host "No release builds found - running tests with parameters"
            
            foreach ($testDll in $testDlls) {
              Write-Host "Running tests for: $($testDll.Name)"
              
              $logFileName = "test-results-$($testDll.Name).trx"
              Write-Host "Log file: $logFileName"
              
              try {
                Write-Host "Running with test parameters"
                $processArgs = @(
                  "test"
                  "$($testDll.FullPath)"
                  "--verbosity"
                  "normal"
                  "--logger"
                  "trx;LogFileName=$logFileName"
                  "--results-directory"
                  "test-results"
                )
                
                # Add test parameters as separate arguments
                $processArgs += "--"
                
                # Always provide the current repository
                $processArgs += "TestRunParameters.Parameter(name=`"CurrentRepository`", value=`"$currentRepository`")"
                
                # Add UpdatedFiles parameter if available
                if ($changedFiles) {
                  $processArgs += "TestRunParameters.Parameter(name=`"UpdatedFiles`", value=`"$changedFiles`")"
                }
                
                Write-Host "Executing: dotnet $($processArgs -join ' ')"
                & dotnet @processArgs
                
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "✓ Tests passed for $($testDll.Name)" -ForegroundColor Green
                  $testResults += @{ Name = $testDll.Name; Status = "Passed"; LogFile = $logFileName }
                } else {
                  Write-Host "⚠ Some tests failed for $($testDll.Name)" -ForegroundColor Yellow
                  $overallSuccess = $false
                  $testResults += @{ Name = $testDll.Name; Status = "Failed"; LogFile = $logFileName }
                }
              } catch {
                Write-Host "✗ Error running tests for $($testDll.Name): $($_.Exception.Message)" -ForegroundColor Red
                $overallSuccess = $false
                $testResults += @{ Name = $testDll.Name; Status = "Error"; LogFile = $logFileName }
              }
            }
          }
          
          Write-Host "Test execution summary:"
          foreach ($result in $testResults) {
            $status = switch ($result.Status) {
              "Passed" { "✓ PASSED" }
              "Failed" { "⚠ FAILED" }
              "Error"  { "✗ ERROR" }
            }
            Write-Host "  $($result.Name): $status"
          }
          
          if (-not $overallSuccess) {
            Write-Host "⚠ Some test DLLs had failures" -ForegroundColor Yellow
            exit 1
          } else {
            Write-Host "✓ All test DLLs passed" -ForegroundColor Green
          }
        shell: pwsh

      - name: Merge TRX files by test DLL
        if: always()
        run: |
          Write-Host "Merging TRX files by test DLL..."
          
          # Get all TRX files
          $trxFiles = Get-ChildItem "test-results" -Filter "*.trx" -File
          
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found to merge"
            exit 0
          }
          
          # Group TRX files by test DLL (remove build config suffix)
          $testDllGroups = @{}
          foreach ($trxFile in $trxFiles) {
            # Extract test DLL name from filename like "test-results-TestDll-Release.trx" -> "TestDll"
            if ($trxFile.BaseName -match "^test-results-(.+?)(?:-[^-]+)?$") {
              $testDllName = $matches[1]
              
              if (-not $testDllGroups.ContainsKey($testDllName)) {
                $testDllGroups[$testDllName] = @()
              }
              $testDllGroups[$testDllName] += $trxFile
              
              Write-Host "Grouped $($trxFile.Name) under test DLL: $testDllName"
            }
          }
          
          # Merge TRX files for each test DLL
          foreach ($testDllName in $testDllGroups.Keys) {
            $trxFilesForDll = $testDllGroups[$testDllName]
            $finalTrxFile = "test-results/test-results-$testDllName.trx"
            
            Write-Host "Merging $($trxFilesForDll.Count) TRX file(s) for $testDllName into $finalTrxFile"
            
            if ($trxFilesForDll.Count -eq 1) {
              # Single file - check if it already has the correct name
              $sourceFile = $trxFilesForDll[0].FullName
              $sourceName = $trxFilesForDll[0].Name
              $expectedName = "test-results-$testDllName.trx"
              
              if ($sourceName -eq $expectedName) {
                Write-Host "✓ Single TRX file already has correct name: $sourceName"
              } else {
                # Rename it to the expected name
                Copy-Item $sourceFile -Destination $finalTrxFile -Force
                # Remove the original file if it's different from the destination
                if ($sourceFile -ne $finalTrxFile) {
                  Remove-Item $sourceFile -Force
                }
                Write-Host "✓ Renamed single TRX file from $sourceName to $expectedName"
              }
            } else {
              # Multiple files - merge TRX files using XML manipulation
              try {
                Write-Host "Merging $($trxFilesForDll.Count) TRX files using XML manipulation..."
                
                # Load the first TRX file as the base
                [xml]$mergedXml = Get-Content $trxFilesForDll[0].FullName
                $mergedResults = $mergedXml.TestRun.Results
                $mergedDefinitions = $mergedXml.TestRun.TestDefinitions
                $mergedEntries = $mergedXml.TestRun.TestEntries
                
                # Initialize counters from the first file
                $totalTests = [int]$mergedXml.TestRun.ResultSummary.Counters.total
                $executedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.executed
                $passedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.passed
                $failedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.failed
                $errorTests = [int]$mergedXml.TestRun.ResultSummary.Counters.error
                $timeoutTests = [int]$mergedXml.TestRun.ResultSummary.Counters.timeout
                $abortedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.aborted
                $inconclusiveTests = [int]$mergedXml.TestRun.ResultSummary.Counters.inconclusive
                $passedButRunAbortedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.passedButRunAborted
                $notRunnableTests = [int]$mergedXml.TestRun.ResultSummary.Counters.notRunnable
                $notExecutedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.notExecuted
                $disconnectedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.disconnected
                $warningTests = [int]$mergedXml.TestRun.ResultSummary.Counters.warning
                $completedTests = [int]$mergedXml.TestRun.ResultSummary.Counters.completed
                $inProgressTests = [int]$mergedXml.TestRun.ResultSummary.Counters.inProgress
                $pendingTests = [int]$mergedXml.TestRun.ResultSummary.Counters.pending
                
                # Merge additional TRX files
                for ($i = 1; $i -lt $trxFilesForDll.Count; $i++) {
                  [xml]$additionalXml = Get-Content $trxFilesForDll[$i].FullName
                  
                  # Merge Results
                  foreach ($result in $additionalXml.TestRun.Results.UnitTestResult) {
                    $importedResult = $mergedXml.ImportNode($result, $true)
                    $mergedResults.AppendChild($importedResult) | Out-Null
                  }
                  
                  # Merge TestDefinitions
                  foreach ($definition in $additionalXml.TestRun.TestDefinitions.UnitTest) {
                    $importedDefinition = $mergedXml.ImportNode($definition, $true)
                    $mergedDefinitions.AppendChild($importedDefinition) | Out-Null
                  }
                  
                  # Merge TestEntries
                  foreach ($entry in $additionalXml.TestRun.TestEntries.TestEntry) {
                    $importedEntry = $mergedXml.ImportNode($entry, $true)
                    $mergedEntries.AppendChild($importedEntry) | Out-Null
                  }
                  
                  # Add counters
                  $totalTests += [int]$additionalXml.TestRun.ResultSummary.Counters.total
                  $executedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.executed
                  $passedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.passed
                  $failedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.failed
                  $errorTests += [int]$additionalXml.TestRun.ResultSummary.Counters.error
                  $timeoutTests += [int]$additionalXml.TestRun.ResultSummary.Counters.timeout
                  $abortedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.aborted
                  $inconclusiveTests += [int]$additionalXml.TestRun.ResultSummary.Counters.inconclusive
                  $passedButRunAbortedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.passedButRunAborted
                  $notRunnableTests += [int]$additionalXml.TestRun.ResultSummary.Counters.notRunnable
                  $notExecutedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.notExecuted
                  $disconnectedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.disconnected
                  $warningTests += [int]$additionalXml.TestRun.ResultSummary.Counters.warning
                  $completedTests += [int]$additionalXml.TestRun.ResultSummary.Counters.completed
                  $inProgressTests += [int]$additionalXml.TestRun.ResultSummary.Counters.inProgress
                  $pendingTests += [int]$additionalXml.TestRun.ResultSummary.Counters.pending
                }
                
                # Update merged counters
                $mergedXml.TestRun.ResultSummary.Counters.total = $totalTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.executed = $executedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.passed = $passedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.failed = $failedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.error = $errorTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.timeout = $timeoutTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.aborted = $abortedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.inconclusive = $inconclusiveTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.passedButRunAborted = $passedButRunAbortedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.notRunnable = $notRunnableTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.notExecuted = $notExecutedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.disconnected = $disconnectedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.warning = $warningTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.completed = $completedTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.inProgress = $inProgressTests.ToString()
                $mergedXml.TestRun.ResultSummary.Counters.pending = $pendingTests.ToString()
                
                # Update the outcome based on merged results
                if ($failedTests -gt 0 -or $errorTests -gt 0 -or $timeoutTests -gt 0 -or $abortedTests -gt 0) {
                  $mergedXml.TestRun.ResultSummary.outcome = "Failed"
                } else {
                  $mergedXml.TestRun.ResultSummary.outcome = "Completed"
                }
                
                # Save the merged TRX file
                $mergedXml.Save($finalTrxFile)
                
                Write-Host "✓ Successfully merged $($trxFilesForDll.Count) TRX files for $testDllName"
                Write-Host "  Total tests: $totalTests, Passed: $passedTests, Failed: $failedTests"
                
              } catch {
                Write-Host "⚠ XML merge failed: $($_.Exception.Message)" -ForegroundColor Yellow
                Write-Host "Falling back to using the last TRX file for $testDllName"
                # Fallback: just use the last TRX file
                Copy-Item $trxFilesForDll[-1].FullName -Destination $finalTrxFile -Force
                Write-Host "✓ Used last TRX file for $testDllName as fallback"
              }
            }
            
            # Clean up original TRX files (only if they're different from the final file)
            $finalTrxFullPath = (Resolve-Path $finalTrxFile -ErrorAction SilentlyContinue).Path
            if (-not $finalTrxFullPath) {
              $finalTrxFullPath = (Get-Item $finalTrxFile -ErrorAction SilentlyContinue).FullName
            }
            
            foreach ($originalFile in $trxFilesForDll) {
              if ($originalFile.FullName -ne $finalTrxFullPath -and (Test-Path $originalFile.FullName)) {
                Remove-Item $originalFile.FullName -Force
                Write-Host "  Cleaned up original file: $($originalFile.Name)"
              }
            }
          }
          
          Write-Host "✓ TRX file merging completed"
        shell: pwsh

      - name: Generate Dynamic Test Reports Action
        if: always()
        run: |
          $testDllNames = '${{ steps.identify-tests.outputs.test-dll-names }}' | ConvertFrom-Json
          
          if (-not $testDllNames -or $testDllNames.Count -eq 0) {
            Write-Host "No test DLLs to create reports for"
            exit 0
          }
          
          # Create the directory for the composite action
          $actionDir = ".github/actions/dynamic-test-reports"
          New-Item -ItemType Directory -Force -Path $actionDir | Out-Null
          
          # Start building the composite action YAML
          $actionYaml = "name: 'Dynamic Test Reports'`n"
          $actionYaml += "description: 'Generate test reports for all identified test DLLs'`n"
          $actionYaml += "runs:`n"
          $actionYaml += "  using: 'composite'`n"
          $actionYaml += "  steps:`n"
          
          # Add a step for each test DLL that has a TRX file
          foreach ($testDllName in $testDllNames) {
            $trxFile = "test-results/test-results-$testDllName.trx"
            if (Test-Path $trxFile) {
              Write-Host "Adding test report step for: $testDllName"
              
              $stepYaml = "    - name: Test Report - $testDllName`n"
              $stepYaml += "      if: always() && hashFiles('test-results/**/test-results-$testDllName.trx') != ''`n"
              $stepYaml += "      uses: dorny/test-reporter@v2`n"
              $stepYaml += "      with:`n"
              $stepYaml += "        name: Test Results - $testDllName`n"
              $stepYaml += "        path: test-results/**/test-results-$testDllName.trx`n"
              $stepYaml += "        reporter: dotnet-trx`n"
              $stepYaml += "        list-tests: failed`n"
              $stepYaml += "        list-suites: all`n"
              $stepYaml += "        badge-title: $testDllName`n"
              $stepYaml += "        use-actions-summary: false`n"
              $stepYaml += "      env:`n"
              $stepYaml += "        GITHUB_TOKEN: `${{ github.token }}`n"
              $actionYaml += "`n" + $stepYaml
            } else {
              Write-Host "⚠ No TRX file found for $testDllName - skipping report" -ForegroundColor Yellow
            }
          }
          
          # Write the composite action file
          $actionYaml | Out-File -FilePath "$actionDir/action.yml" -Encoding UTF8
          
          Write-Host "✓ Generated dynamic composite action with individual dorny/test-reporter steps"
          Write-Host "Action file created at: $actionDir/action.yml"
        shell: pwsh

      - name: Execute Dynamic Test Reports
        if: always()
        uses: ./.github/actions/dynamic-test-reports