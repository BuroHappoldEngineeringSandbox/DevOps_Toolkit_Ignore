name: Static Checks

on:
  workflow_call:
    inputs:
      run_format:
        type: boolean
        required: false
        default: false
        # Set to true to run dotnet format --verify-no-changes on PR-changed C# files only (warn only; job does not fail).
      run_compliance:
        type: boolean
        required: false
        default: true
        # Set to false to skip all compliance checks entirely for this repo.
      run_branch_check:
        type: boolean
        required: false
        default: false
        # Set to true to enable the branch naming convention check for this repo.
      dotnet_version:
        type: string
        required: false
        default: "8.x"
      configuration:
        type: string
        required: false
        default: "Release"
      compliance_checks:
        type: string
        required: false
        default: "code copyright documentation project"
        # Space-separated list of compliance checks to run.
        # Valid values: code, copyright, documentation, project
        # Example — skip copyright: "code documentation project"
        # Example — code only:      "code"
      run_dataset_check:
        type: boolean
        required: false
        default: false
        # Set to true for repos that contain a datasets/ folder.
        # Runs IsValidDataset against every changed .json file under datasets/.
    secrets:
      GH_TOKEN:
        required: false   # PAT for cloning private dependency repositories; falls back to github.token

jobs:
  # ── Branch naming convention check ──────────────────────────────────────
  branch:
    if: inputs.run_branch_check && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check branch naming convention
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
          base="${{ github.base_ref }}"

          # develop → main is an end-of-milestone merge — skip (matches BHoMBot).
          if [ "$branch" = "develop" ] && [ "$base" = "main" ]; then
            echo "::notice::Milestone merge (develop → main) — branch check skipped."
            exit 0
          fi

          # 'develop' is always valid.
          if [ "$branch" = "develop" ]; then
            echo "::notice::Branch '$branch' is valid."
            exit 0
          fi

          # Pattern mirrors BHoMBot: [a-zA-Z_]*-#[0-9]*-[a-zA-Z]*
          if echo "$branch" | grep -qE '[a-zA-Z_]*-#[0-9]*-[a-zA-Z]*'; then
            echo "::notice::Branch '$branch' matches BHoM naming convention."
          else
            echo "::error title=Branch Compliance::Branch '$branch' does not follow BHoM naming conventions."
            echo "::error::See https://github.com/BHoM/documentation/wiki/Resolving-an-Issue#branch-naming-conventions"
            exit 1
          fi

  # ── Format check ──────────────────────────────────────────────────────────
  # Runs dotnet format --verify-no-changes only for C# files changed in the PR.
  # Reports issues as warnings (job still passes); no EditorConfig required (uses defaults).
  format:
    if: inputs.run_format && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Compute changed C# files
        id: changed
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin "$base_sha"

          git diff --name-only --diff-filter=ACMRT "$base_sha" HEAD -- '*.cs' \
            > changed_cs_files.txt

          count=$(wc -l < changed_cs_files.txt | tr -d ' ')
          echo "count=$count" >> $GITHUB_OUTPUT

          if [ "$count" -gt 0 ]; then
            echo "::notice::$count C# file(s) changed — running format check (warn only)."
            cat changed_cs_files.txt
          else
            echo "::notice::No changed C# files — format check skipped."
          fi

      - name: Check formatting (changed files only, warn only)
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          # Find owning .csproj for each changed file (walk up from file dir until we hit a .csproj).
          declare -A project_files
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            dir=$(dirname "$file")
            csproj=""
            while [[ "$dir" != "." && "$dir" != "/" ]]; do
              found=$(find "$dir" -maxdepth 1 -name "*.csproj" 2>/dev/null | head -1)
              if [[ -n "$found" ]]; then
                csproj="$found"
                break
              fi
              dir=$(dirname "$dir")
            done
            if [[ -n "$csproj" ]]; then
              project_files["$csproj"]="${project_files[$csproj]:+${project_files[$csproj]} }$file"
            fi
          done < changed_cs_files.txt

          if [ ${#project_files[@]} -eq 0 ]; then
            echo "::notice::No .csproj found for any changed file — format check skipped."
            exit 0
          fi

          any_failed=0
          for csproj in "${!project_files[@]}"; do
            proj_dir=$(dirname "$csproj")
            # Paths relative to project directory for --include (dotnet format expects project-relative when workspace is a .csproj).
            include_args=()
            for f in ${project_files[$csproj]}; do
              if [[ "$proj_dir" == "." ]]; then
                rel="$f"
              else
                rel="${f#$proj_dir/}"
              fi
              [[ -n "$rel" ]] && include_args+=(--include "$rel")
            done
            [[ ${#include_args[@]} -eq 0 ]] && continue

            echo "::group::dotnet format — $csproj"
            set +e
            dotnet format "$csproj" --verify-no-changes --verbosity normal "${include_args[@]}"
            exitcode=$?
            set -e
            echo "::endgroup::"
            [[ "$exitcode" -ne 0 ]] && any_failed=1
          done

          if [[ "$any_failed" -ne 0 ]]; then
            echo "::warning title=Format check::Some changed files have formatting issues. Run \`dotnet format\` locally (or fix the reported files) to align with defaults."
          fi
          exit 0

  # ── Compliance check ──────────────────────────────────────────────────────
  compliance:
    if: inputs.run_compliance
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
      actions: write            # required for cache save in cross-repo composite actions
    defaults:
      run:
        shell: pwsh

    steps:
      # ── 1. Shallow checkout — only enough history to reach the base commit ─
      #       fetch-depth:1 + targeted fetch is faster than full history for
      #       large repos, yet gives git diff everything it needs.
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Detect relevant changed files BEFORE any expensive work ─────────
      #       Gates all subsequent heavy steps so PRs that only touch YAML/docs
      #       exit in seconds without building Test_Toolkit at all.
      #
      #       Uses the exact PR base SHA (not the branch name) with a two-dot
      #       diff to avoid "no merge base" failures on shallow clones.
      #       Three-dot diff (origin/branch...HEAD) requires a common ancestor
      #       in the shallow graph, which is unavailable with fetch-depth:1.
      - name: Compute changed files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — compliance checks skipped."
            exit 0
          }

          # Fetch the exact commit the PR was opened from — depth=1 is enough
          # because we diff directly against this SHA (no merge-base lookup needed).
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") -or $_.ToLower().EndsWith(".csproj") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count relevant file(s) changed — running compliance."
            Get-Content changed_files.txt
          } else {
            Write-Host "::notice::No relevant files changed (.cs / .csproj) — skipping compliance."
          }

      # ── 3. Resolve and build Test_Toolkit + its transitive dependencies ───
      #       Skipped entirely when no relevant files changed (saves 3–5 min).
      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN }}

      # ── 4. Stage built assemblies to C:\ProgramData\BHoM\Assemblies ───────
      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: deps-assemblies

      # ── 5. Check out DevOps_Toolkit — also captures its HEAD SHA for the ──
      #       runner binary cache key so we only rebuild when source changes.
      - name: Checkout DevOps_Toolkit (runner source)
        if: steps.changed.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _toolkit

      - name: Get DevOps_Toolkit HEAD SHA (runner cache key)
        if: steps.changed.outputs.count != '0'
        id: toolkit-sha
        run: |
          $sha = git -C _toolkit rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "DevOps_Toolkit SHA: $sha"

      # ── 6. Restore ComplianceRunner binary from cache ─────────────────────
      #       Cache key = runner OS + toolkit SHA + build configuration.
      #       A cache hit skips the dotnet publish entirely (~30–60 s saved).
      - name: Restore ComplianceRunner cache
        if: steps.changed.outputs.count != '0'
        id: runner-cache
        uses: actions/cache@v4
        with:
          path: out\runner
          key: runner-${{ runner.os }}-${{ steps.toolkit-sha.outputs.sha }}-${{ inputs.configuration }}

      # ── 7. Publish ComplianceRunner (only on cache miss) ──────────────────
      - name: Publish ComplianceRunner
        if: steps.changed.outputs.count != '0' && steps.runner-cache.outputs.cache-hit != 'true'
        run: |
          $proj = "_toolkit\src\ComplianceRunner\ComplianceRunner.csproj"
          if (-not (Test-Path $proj)) {
            Write-Error "ComplianceRunner project not found at: $proj"
            exit 1
          }
          dotnet publish $proj -c ${{ inputs.configuration }} -o out\runner

      # ── 8. Run each requested compliance check in its own log group ───────
      - name: Run compliance checks
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runner = "out\runner\ComplianceRunner.exe"
          if (-not (Test-Path $runner)) {
            Get-ChildItem -Recurse out\runner | Select-Object FullName
            Write-Error "Runner executable not found at: $runner"
            exit 1
          }

          # @() ensures a [string[]] even when only one file changed —
          # prevents PowerShell splatting the string character-by-character.
          $fileList = @(Get-Content changed_files.txt | ForEach-Object { $_ -replace '/', '\' })

          # Inline split on the literal input value avoids parameter-boundary
          # encoding issues that affected the previous external-script approach.
          $checks = @("${{ inputs.compliance_checks }}" -split ' ' | Where-Object { $_ -ne '' })

          # Repository URL needed by the project compliance check (mirrors BHoMBot).
          $orgUrl = "${{ github.server_url }}/${{ github.repository }}"

          Write-Host "::notice title=Compliance checks::Running: $($checks -join ', ')"

          $anyFailure     = 0
          $sarifGenerated = "false"
          $checkResults   = [System.Collections.Generic.List[hashtable]]::new()

          foreach ($check in $checks) {
            Write-Host "::group::BHoM $check compliance"
            & $runner $check --output github --org-url "$orgUrl" @fileList
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { $anyFailure = 1 }
            Write-Host "::endgroup::"
            $checkResults.Add(@{ Check=$check; Ok=$ok })
          }

          # SARIF is only meaningful for the 'code' check (Roslyn diagnostics).
          if ($checks -contains "code") {
            Write-Host "::group::SARIF export (code)"
            & $runner code --output sarif --sarif-file compliance.sarif --org-url "$orgUrl" @fileList
            if ($LASTEXITCODE -eq 0) { $sarifGenerated = "true" }
            Write-Host "::endgroup::"
          }

          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            $mdLines = @("### Compliance check results", "", "| Check | Result |", "|---|---|")
            foreach ($r in $checkResults) {
              $icon   = if ($r.Ok) { ":white_check_mark:" } else { ":x:" }
              $status = if ($r.Ok) { "Passed" } else { "**Failed**" }
              $mdLines += "| $($r.Check) | $icon $status |"
            }
            $mdLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if ($anyFailure -ne 0) {
            Write-Host "::error::One or more compliance checks failed."
            exit 1
          }

      # ── 9. Upload SARIF results to GitHub Code Scanning ───────────────────
      - name: Upload SARIF
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: compliance.sarif
          category:   bhom-compliance-pr-delta


  # ── Dataset compliance check ──────────────────────────────────────────────
  #    Opt-in via run_dataset_check: true — only needed for repos with a
  #    datasets/ folder. Runs IsValidDataset against every changed .json file
  #    under any datasets/ path in the PR diff.
  dataset:
    if: inputs.run_dataset_check
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
      actions: write            # required for cache save in cross-repo composite actions
    defaults:
      run:
        shell: pwsh

    steps:
      # ── 1. Shallow checkout ───────────────────────────────────────────────
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Detect changed dataset files BEFORE any expensive work ─────────
      #       Filters for .json files whose repo-relative path contains /datasets/
      #       mirroring the IsDatasetFile predicate in DatasetComplianceRunner.cs.
      - name: Compute changed dataset files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — dataset check skipped."
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object {
                     $_.ToLower().EndsWith(".json") -and
                     $_.Replace('\', '/').ToLower() -match '/datasets/'
                   }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_dataset_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count dataset file(s) changed — running dataset compliance."
            Get-Content changed_dataset_files.txt
          } else {
            Write-Host "::notice::No changed dataset files detected — skipping dataset compliance."
          }

      # ── 3. Resolve and build Test_Toolkit + its transitive dependencies ───
      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN }}

      # ── 4. Stage built assemblies to C:\ProgramData\BHoM\Assemblies ───────
      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: deps-assemblies

      # ── 5. Check out DevOps_Toolkit — captures HEAD SHA for cache key ─────
      - name: Checkout DevOps_Toolkit (runner source)
        if: steps.changed.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _toolkit

      - name: Get DevOps_Toolkit HEAD SHA (runner cache key)
        if: steps.changed.outputs.count != '0'
        id: toolkit-sha
        run: |
          $sha = git -C _toolkit rev-parse HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "DevOps_Toolkit SHA: $sha"

      # ── 6. Restore DatasetComplianceRunner binary from cache ──────────────
      - name: Restore DatasetComplianceRunner cache
        if: steps.changed.outputs.count != '0'
        id: runner-cache
        uses: actions/cache@v4
        with:
          path: out\dataset-runner
          key: dataset-runner-${{ runner.os }}-${{ steps.toolkit-sha.outputs.sha }}-${{ inputs.configuration }}

      # ── 7. Publish DatasetComplianceRunner (only on cache miss) ───────────
      - name: Publish DatasetComplianceRunner
        if: steps.changed.outputs.count != '0' && steps.runner-cache.outputs.cache-hit != 'true'
        run: |
          $proj = "_toolkit\src\DatasetComplianceRunner\DatasetComplianceRunner.csproj"
          if (-not (Test-Path $proj)) {
            Write-Error "DatasetComplianceRunner project not found at: $proj"
            exit 1
          }
          dotnet publish $proj -c ${{ inputs.configuration }} -o out\dataset-runner

      # ── 8. Run dataset compliance ─────────────────────────────────────────
      - name: Run dataset compliance
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runner = "out\dataset-runner\DatasetComplianceRunner.exe"
          if (-not (Test-Path $runner)) {
            Get-ChildItem -Recurse out\dataset-runner | Select-Object FullName
            Write-Error "Runner executable not found at: $runner"
            exit 1
          }

          $fileList = @(Get-Content changed_dataset_files.txt | ForEach-Object { $_ -replace '/', '\' })

          Write-Host "::group::BHoM dataset compliance"
          & $runner --output github @fileList
          $ok = ($LASTEXITCODE -eq 0)
          Write-Host "::endgroup::"

          # Always export SARIF for dataset results so they appear in Code Scanning.
          Write-Host "::group::SARIF export (dataset)"
          & $runner --output sarif --sarif-file dataset-compliance.sarif @fileList
          $sarifGenerated = ($LASTEXITCODE -eq 0).ToString().ToLower()
          Write-Host "::endgroup::"

          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            $icon   = if ($ok) { ":white_check_mark:" } else { ":x:" }
            $status = if ($ok) { "Passed" } else { "**Failed**" }
            @(
              "### Dataset compliance check results",
              "",
              "| Check | Result |",
              "|---|---|",
              "| dataset | $icon $status |"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if (-not $ok) {
            Write-Host "::error::Dataset compliance check failed."
            exit 1
          }

      # ── 9. Upload SARIF results to GitHub Code Scanning ───────────────────
      - name: Upload SARIF
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dataset-compliance.sarif
          category:   bhom-dataset-compliance-pr-delta
