name: BHoM Static Checks (Reusable)

on:
  workflow_call:
    inputs:
      default_branch:
        type: string
        default: "main"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:

      # Single checkout that works for PRs INCLUDING forks
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          # For PRs, checkout the HEAD commit automatically
        #   ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Run Super-Linter (changed files only)
      - name: Run Super-Linter
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #   DEFAULT_BRANCH: ${{ inputs.default_branch }}

          # Lint only PR changes (keeps it fast)
          VALIDATE_ALL_CODEBASE: false

          # Enable the linters you want
          VALIDATE_CSHARP: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_XML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true