name: Clone & Build BHoM Dependencies

on:
  workflow_call:
    inputs:
      deps_file:
        description: "Path to dependencies.txt in the caller repo"
        required: false
        type: string
        default: "dependencies.txt"
      extra_repos:
        description: "Optional extra repos (owner/repo per line) to also clone/build"
        required: false
        type: string
        default: ""
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "10.x"
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      token:
        description: "Token for cloning private repos (PAT/GitHub App/deploy key). Falls back to GITHUB_TOKEN."
        required: false
        type: string
        default: ""

jobs:
  clone_build:
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      DEP_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Prepare directories
        shell: pwsh
        run: |
          mkdir -Force deps | Out-Null
          mkdir -Force deps-assemblies | Out-Null
          New-Item -ItemType File -Force -Path deps/_shas.txt | Out-Null

      # --- Clone all dependencies (recursively) and record exact SHAs
      - name: Clone dependencies (Prefer PR branch; fallback to base)
        id: clone_deps
        shell: pwsh
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Get-ListFromFileOrEmpty([string]$path) {
            if (Test-Path $path) {
              return Get-Content $path |
                Where-Object { $_ -and -not $_.Trim().StartsWith('#') } |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -ne '' }
            }
            @()
          }

          $root = (Get-Location).Path
          $shaFile = Join-Path $root 'deps/_shas.txt'

          # Seed dependencies from file + extra_repos
          $seeds = @()
          $df = "${{ inputs.deps_file }}"
          $seeds += Get-ListFromFileOrEmpty $df
          if ("${{ inputs.extra_repos }}") {
            $extra = @("${{ inputs.extra_repos }}".Split("`n")) |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -ne '' -and -not $_.StartsWith('#') }
            $seeds += $extra
          }
          if ($seeds.Count -eq 0) {
            Write-Host "No dependencies listed in '$df' and no extra_repos supplied — skipping."
            exit 0
          }

          # Determine prefer/fallback branches
          $Prefer   = $env:PR_BRANCH
          $Fallback = $env:BASE_BRANCH
          if (-not $Prefer)   { $Prefer   = 'feature/unknown' }
          if (-not $Fallback) { $Fallback = 'main' }

          $cloned = New-Object System.Collections.Generic.HashSet[string]

          function Clone-And-Checkout([string]$ownerRepo) {
            $parts = $ownerRepo.Split('/')
            if ($parts.Count -ne 2) {
              Write-Warning "Skipping invalid repo identifier: '$ownerRepo' (expected owner/repo)"
              return $null
            }
            $name = $parts[1]
            if (Test-Path "deps/$name/.git") {
              return $name
            }

            $url = "https://x-access-token:$env:DEP_TOKEN@github.com/$ownerRepo.git"
            git clone $url "deps/$name" --no-tags --depth 1

            Push-Location "deps/$name"

            $hasPrefer = git ls-remote --heads origin $Prefer
            if ($hasPrefer) {
              git fetch origin $Prefer --depth 1
              git checkout -q $Prefer
              Write-Host "Checked out '$name' on branch '$Prefer'"
            } else {
              git fetch origin $Fallback --depth 1
              git checkout -q $Fallback
              Write-Host "Branch '$Prefer' not found on '$name' — fell back to '$Fallback'"
            }

            $sha = (git rev-parse HEAD).Trim()
            Add-Content -Path $shaFile -Value "$name $sha"

            Pop-Location
            return $name
          }

          function Recurse([string]$ownerRepo) {
            $name = Clone-And-Checkout $ownerRepo
            if (-not $name) { return }
            if ($cloned.Contains($name)) { return }
            $cloned.Add($name) | Out-Null

            $depFile = "deps/$name/dependencies.txt"
            if (Test-Path $depFile) {
              Get-Content $depFile |
                Where-Object { $_ -and -not $_.Trim().StartsWith('#') } |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ -ne '' } |
                ForEach-Object { Recurse $_ }
            }
          }

          foreach ($r in $seeds) { Recurse $r }

      # --- Compose cache key from exact dependency SHAs (+ SDK + Config + OS)
      - name: Compute composite cache key from dependency SHAs
        id: shas
        shell: pwsh
        run: |
          if (-not (Test-Path 'deps/_shas.txt')) {
            Write-Host "No dependency SHAs recorded — using empty key."
            "keypart=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $pairs = Get-Content 'deps/_shas.txt' | Where-Object { $_ -match '\S+\s+[0-9a-f]+' }
          $keypart = ($pairs | Sort-Object | ForEach-Object {
            $t = $_.Trim() -split '\s+'
            "$($t[0])@$($t[1])"
          }) -join ';'
          "keypart=$keypart" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore cache (deps-assemblies)
        id: cache
        uses: actions/cache@v4
        with:
          path: deps-assemblies
          key: depsasm-${{ runner.os }}-${{ inputs.dotnet_version }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

      # --- Build dependencies only if we missed the cache
      - name: Build dependencies (only if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # Build each dependency repo and collect DLLs
          Get-ChildItem "deps" -Directory | ForEach-Object {
            $name = $_.Name
            Write-Host "::group::Building $name"
            dotnet build "deps/$name" -c $env:CONFIGURATION
            Write-Host "::endgroup::"
          }

          if (-not (Test-Path "deps-assemblies")) { mkdir -Force "deps-assemblies" | Out-Null }
          Get-ChildItem "deps" -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\bin\\$($env:CONFIGURATION)\\" } |
            ForEach-Object { Copy-Item $_.FullName "deps-assemblies" -Force }

          Write-Host "Collected assemblies (sample):"
          Get-ChildItem "deps-assemblies" -Filter *.dll -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -First 60 | ForEach-Object { $_.Name }

      - name: Upload dependency assemblies
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          if-no-files-found: warn