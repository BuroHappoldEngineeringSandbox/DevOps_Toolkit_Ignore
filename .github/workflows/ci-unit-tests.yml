name: Unit Tests

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
      configuration:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false  # optional PAT for private deps; else github.token

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-unit-tests
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Discover test solution
        id: test_check
        run: |
          # Convention: .ci/unit-tests/<RepoName>_Tests.sln (name is repo-specific, discovered at runtime).
          $slns = Get-ChildItem -Path ".ci/unit-tests" -Filter "*.sln" -ErrorAction SilentlyContinue

          if (-not $slns) {
            Write-Host "::warning::No test solution found under .ci/unit-tests/ — unit test step skipped. Add a solution at .ci/unit-tests/<RepoName>_Tests.sln to enable unit tests. See https://bhom.xyz/documentation/Guides-and-Tutorials/Coding-with-BHoM/Testing/ for setup instructions."
            exit 0
          }

          if ($slns.Count -gt 1) {
            Write-Host "::warning::Multiple solutions found under .ci/unit-tests/ — using: $($slns[0].Name)"
          }
          $sln = $slns[0].FullName
          "solution=$sln" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "::notice::Test solution discovered: $sln"

      - name: Resolve dependencies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           caller
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore test solution
        run: dotnet restore "${{ steps.test_check.outputs.solution }}"

      - name: Build
        run: dotnet build "${{ steps.test_check.outputs.solution }}" --no-restore --configuration ${{ inputs.configuration }}

      - name: Run tests
        run: |
          $solutionDir = Split-Path "${{ steps.test_check.outputs.solution }}"
          $runsettings = Join-Path $solutionDir ".runsettings"
          $settingsArg = if (Test-Path $runsettings) { "--settings `"$runsettings`"" } else { "" }

          if ($settingsArg) {
            Write-Host "::notice::Using runsettings: $runsettings"
          }

          $expression = "dotnet test `"${{ steps.test_check.outputs.solution }}`" " +
                        "--no-build " +
                        "--configuration ${{ inputs.configuration }} " +
                        "--verbosity normal " +
                        '--logger "trx;LogFileName=tests.trx" ' +
                        "--results-directory TestResults " +
                        '--collect:"XPlat Code Coverage" ' +
                        $settingsArg

          Invoke-Expression $expression

      - name: Upload test results (TRX)
        if: always() && steps.test_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Generate coverage report
        if: always() && steps.test_check.outcome == 'success'
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Host "::notice::No coverage.cobertura.xml found — skipping report. Add a Cobertura collector to test projects to enable."
            return
          }
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator `
            -reports:"**/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"MarkdownSummaryGithub"

      - name: Add coverage to step summary
        if: always() && steps.test_check.outcome == 'success'
        run: |
          if (Test-Path "coverage-report/SummaryGithub.md") {
            Get-Content "coverage-report/SummaryGithub.md" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

