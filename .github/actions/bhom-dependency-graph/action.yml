name: "BHoM Dependency Graph Clone"
description: "Clone dependency repos (PR-aware), recurse via dependencies.txt, and record SHAs"

inputs:
  token:
    description: "Token for private clones (GitHub App token/PAT). Defaults to GITHUB_TOKEN."
    required: false
    default: "${{ github.token }}"
  deps_file:
    description: "Path to dependencies.txt in caller"
    required: false
    default: "dependencies.txt"
  extra_repos:
    description: "Optional extra repos (owner/repo per line)"
    required: false
    default: ""
  pr_branch:
    description: "Preferred branch (PR head)"
    required: false
    default: ""
  base_branch:
    description: "Fallback branch (PR base)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Clone dependency graph
      shell: pwsh
      run: |
        pwsh -File "${{ github.action_path }}/clone.ps1" `
          -Token "${{ inputs.token }}" `
          -DepsFile "${{ inputs.deps_file }}" `
          -ExtraRepos "${{ inputs.extra_repos }}" `
          -PRBranch "${{ inputs.pr_branch }}" `
          -BaseBranch "${{ inputs.base_branch }}"