name: Compliance

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
      configuration:
        type: string
        required: true
      compliance_checks:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false
      BHOM_APP_ID:
        required: false  # BHoMBot GitHub App ID — used to mint a short-lived token for dep cloning.
      BHOM_APP_PRIVATE_KEY:
        required: false  # BHoMBot GitHub App private key (PEM). Required when BHOM_APP_ID is set.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-compliance
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # PR diff vs base SHA (two-dot); shallow fetch avoids merge-base issues on fetch-depth:1.
      - name: Compute changed files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — compliance checks skipped."
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") -or $_.ToLower().EndsWith(".csproj") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count relevant file(s) changed — running compliance."
            Get-Content changed_files.txt
          } else {
            Write-Host "::notice::No relevant files changed (.cs / .csproj) — skipping compliance."
          }

      - name: Check App credentials
        id: app-check
        shell: bash
        env:
          APP_ID: ${{ secrets.BHOM_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dependency token
        id: dep-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare ComplianceRunner
        if: steps.changed.outputs.count != '0'
        id: runner
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/prepare-runner@main
        with:
          runner_project: src/ComplianceRunner/ComplianceRunner.csproj
          output_dir:     out\runner
          configuration:  ${{ inputs.configuration }}
          cache_prefix:   compliance-runner
          dotnet_version: "10.x"  # runner targets net10.0 — independent of the dep-build SDK (8.0)

      - name: Run compliance checks
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runnerExe = "${{ steps.runner.outputs.runner_exe }}"
          $orgUrl    = "${{ github.server_url }}/${{ github.repository }}"

          $fileList = @(Get-Content changed_files.txt)
          [string[]]$checks = @("${{ inputs.compliance_checks }}".Trim() -split '\s+' | Where-Object { $_ -ne '' })

          Write-Host "::notice title=Compliance checks::Running ($($checks.Length)): $($checks -join ', ')"

          if ($fileList.Count -eq 0) {
            Write-Host "::warning::changed_files.txt is empty — no files to check. Skipping compliance runner."
            "sarif_generated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $sarifDir     = "compliance-sarifs"
          New-Item -ItemType Directory -Force -Path $sarifDir | Out-Null
          $anyFailure   = 0
          $checkResults = [System.Collections.Generic.List[hashtable]]::new()

          # Single pass per check: write SARIF to disk, replay annotations from it afterward.
          # This avoids invoking the BHoM compliance engine twice per check.
          foreach ($check in $checks) {
            Write-Host "::group::BHoM $check compliance"
            $sarifPath = "$sarifDir\compliance-$check.sarif"
            & $runnerExe $check --output sarif --sarif-file $sarifPath --org-url "$orgUrl" @fileList
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { $anyFailure = 1 }
            Write-Host "::endgroup::"
            $checkResults.Add(@{ Check = $check; Ok = $ok })
          }

          $sarifGenerated = (@(Get-ChildItem $sarifDir -Filter "*.sarif" -ErrorAction SilentlyContinue).Count -gt 0).ToString().ToLower()
          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Replay SARIF results as GitHub Actions annotations (::error/::warning).
          Write-Host "::group::Compliance annotations"
          foreach ($sarifFile in Get-ChildItem $sarifDir -Filter "*.sarif" -ErrorAction SilentlyContinue) {
            $sarifObj = Get-Content $sarifFile.FullName -Raw | ConvertFrom-Json -Depth 20
            foreach ($run in $sarifObj.runs) {
              if (-not $run.PSObject.Properties["results"]) { continue }
              foreach ($result in $run.results) {
                $level  = if ($result.level -eq "error") { "error" } else { "warning" }
                $loc    = $result.locations[0].physicalLocation
                $file   = $loc.artifactLocation.uri -replace '\\', '/'
                $line   = if ($loc.region.PSObject.Properties["startLine"] -and $loc.region.startLine) { $loc.region.startLine } else { 1 }
                $colN   = if ($loc.region.PSObject.Properties["startColumn"] -and $loc.region.startColumn) { $loc.region.startColumn } else { 0 }
                $colStr = if ($colN -gt 0) { ",col=$colN" } else { "" }
                $msg    = $result.message.text -replace "`r", "" -replace "`n", " "
                Write-Host "::$level file=$file,line=$line$colStr::$msg"
              }
            }
          }
          Write-Host "::endgroup::"

          if ($env:GITHUB_STEP_SUMMARY) {
            $mdLines = @("### Compliance check results", "", "| Check | Result |", "|---|---|")
            foreach ($r in $checkResults) {
              $icon   = if ($r.Ok) { ":white_check_mark:" } else { ":x:" }
              $status = if ($r.Ok) { "Passed" } else { "**Failed**" }
              $mdLines += "| $($r.Check) | $icon $status |"
            }
            $mdLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if ($anyFailure -ne 0) {
            Write-Host "::error::One or more compliance checks failed."
            exit 1
          }

      - name: Upload SARIF (per check)
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && !cancelled()
        shell: pwsh
        run: |
          # Upload each check's SARIF file via codeql-action upload-sarif equivalent.
          # Uses gh api directly with codeql-action's supported category field so results
          # appear per-check in the Security tab rather than merged into one entry.
          foreach ($sarifFile in Get-ChildItem compliance-sarifs -Filter "*.sarif" -ErrorAction SilentlyContinue) {
            $checkName = $sarifFile.BaseName -replace '^compliance-', ''
            $category  = "bhom-compliance-$checkName-pr-delta"

            # Patch automationDetails.id so GitHub groups results by check category.
            $sarifJson = Get-Content $sarifFile.FullName -Raw | ConvertFrom-Json -Depth 20
            foreach ($run in $sarifJson.runs) {
              if ($null -eq $run.PSObject.Properties["automationDetails"]) {
                $run | Add-Member -NotePropertyName "automationDetails" `
                                  -NotePropertyValue ([pscustomobject]@{ id = $category }) -Force
              } else {
                $run.automationDetails.id = $category
              }
            }
            $sarifJson | ConvertTo-Json -Depth 20 -Compress |
              Set-Content $sarifFile.FullName -Encoding utf8

            Write-Host "Prepared SARIF for upload: $checkName (category: $category)"
          }
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload SARIF files to GitHub Code Scanning
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && !cancelled()
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: compliance-sarifs
          category:   bhom-compliance-pr-delta
