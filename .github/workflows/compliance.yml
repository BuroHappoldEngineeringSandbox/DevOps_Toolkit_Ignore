name: BHoM Compliance (PR)

on:
  workflow_call:
    inputs:
      dotnet_version:     { type: string,  default: "10.x" }
      configuration:      { type: string,  default: "Release" }
      extra_repos:        { type: string,  default: "" }  # optional extras beyond Test_Toolkit
      token:              { type: string,  default: "" }
      runner_project:
        type: string
        default: ""   # path to ComplianceRunnerApp.csproj in the caller repo (if present)

jobs:
  deps:
    permissions:
      contents: read
    uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/workflows/deps.yml@main
    with:
      dotnet_version: ${{ inputs.dotnet_version }}
      configuration:  ${{ inputs.configuration }}
      token:          ${{ inputs.token }}
      # Always include Test_Toolkit; callers can append more.
      extra_repos: |
        BHoM/Test_Toolkit
        ${{ inputs.extra_repos }}

  compliance:
    runs-on: windows-latest
    needs: deps
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download dependency assemblies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies
        continue-on-error: true

      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: "deps-assemblies"

      # ----------------------- Build Compliance Runner -----------------------
      # 1) If a runner project is provided in the caller repo, build it
      - name: Build Compliance Runner (from caller repo)
        id: build-runner-local
        if: inputs.runner_project != ''
        run: |
          if (-not (Test-Path "${{ inputs.runner_project }}")) {
            Write-Error "Runner project not found at: ${{ inputs.runner_project }}"
            exit 1
          }
          dotnet publish "${{ inputs.runner_project }}" -c ${{ inputs.configuration }} -o out\runner

      # 2) Otherwise, pull runner source from DevOps_Toolkit standard location and build
        # (Assumes a project at tools/ComplianceRunnerApp/ComplianceRunnerApp.csproj)
      - name: Checkout DevOps_Toolkit (runner source)
        if: inputs.runner_project == ''
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: toolkit_repo

      - name: Build Compliance Runner (from DevOps_Toolkit)
        if: inputs.runner_project == ''
        run: |
          $proj = "toolkit_repo\tools\ComplianceRunnerApp\ComplianceRunnerApp.csproj"
          if (-not (Test-Path $proj)) {
            Write-Error "Compliance Runner project not found at $proj. Provide 'runner_project' input or add the runner to DevOps_Toolkit."
            exit 1
          }
          dotnet publish $proj -c ${{ inputs.configuration }} -o out\runner

      # ----------------------- Diff & Run -----------------------
      - name: Compute changed C# files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          git fetch origin ${{ github.base_ref }}
          $files = git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") }
          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run Compliance Runner (PR delta)
        if: steps.changed.outputs.count != '0'
        run: |
          $sarif  = "compliance.sarif"
          $runner = "out\runner\ComplianceRunnerApp.exe"
          if (-not (Test-Path $runner)) {
            Write-Error "Runner exe not found at $runner"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path scan | Out-Null
          Get-Content changed_files.txt | ForEach-Object {
            $src = $_
            $dst = Join-Path "scan" $_
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $src $dst -Force
          }
          & $runner "scan" --sarif $sarif
          if ($LASTEXITCODE -ne 0) { Write-Host "Compliance violations detected." }

      - name: Upload SARIF (Code scanning)
        if: steps.changed.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif
          category: "bhom-compliance-pr-delta"