name: Compliance (Reusable)

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version"
        type: string
        default: "8.0.x"

      configuration:
        description: "Build configuration"
        type: string
        default: "Release"

      rules:
        description: "List of compliance rules to run (one per line)"
        type: string
        default: ""

      sarif_name:
        description: "SARIF output filename"
        type: string
        default: "compliance.sarif"

      devops_toolkit_repo:
        type: string
        default: "BuroHappoldEngineeringSandbox/DevOps_Toolkit"

      devops_toolkit_ref:
        type: string
        default: "main"

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------
  # Job 0: Build Test_Toolkit and publish its assemblies
  # ---------------------------------------------------------
  build_test_toolkit:
    name: Build Test_Toolkit
    runs-on: windows-latest

    steps:
      - name: Checkout Test_Toolkit
        uses: actions/checkout@v4
        with:
          repository: BHoM/Test_Toolkit
          ref: develop
          path: test_toolkit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Build CodeComplianceTest_Engine
        working-directory: test_toolkit/CodeComplianceTest_Engine
        shell: pwsh
        run: |
          dotnet restore --nologo
          dotnet build -c ${{ inputs.configuration }} --nologo

      - name: Publish toolkit DLL
        id: finddll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "test_toolkit/CodeComplianceTest_Engine/bin/${{ inputs.configuration }}" `
            -Filter "CodeComplianceTest_Engine.dll" | Select-Object -First 1 -ExpandProperty FullName

          echo "dll=$dll" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: test-toolkit-dll
          path: ${{ steps.finddll.outputs.dll }}

  # ---------------------------------------------------------
  # Job 1: Run Compliance
  # ---------------------------------------------------------
  compliance:
    name: Compliance Checks
    runs-on: windows-latest
    needs: [build_test_toolkit]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download Test_Toolkit dll
        uses: actions/download-artifact@v4
        with:
          name: test-toolkit-dll
          path: _toolkit

      - name: Shadow ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $toolkitDir = Resolve-Path _toolkit
          $target = Join-Path $env:ProgramData "BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$toolkitDir\*.dll" $target -Force
          Write-Host "Copied Test_Toolkit assemblies to $target"

      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devops_toolkit_repo }}
          ref: ${{ inputs.devops_toolkit_ref }}
          path: _devops_toolkit

      - name: Build ComplianceRunner
        working-directory: _devops_toolkit/src/Compliance/ComplianceRunner
        shell: pwsh
        run: |
          dotnet restore --nologo
          dotnet build -c ${{ inputs.configuration }} --nologo

      # ------- Changed Files Mode for PRs Only -------
      - name: Detect changed .cs files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          git diff --name-only $base...HEAD -- '*.cs' | Set-Content changed_files.txt
          $count = (Get-Content changed_files.txt | Measure-Object -Line).Lines
          echo "count=$count" >> $env:GITHUB_OUTPUT
          Write-Host "Changed CS files count: $count"

      - name: Run compliance for changed files (PR only)
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.count != '0' }}
        shell: pwsh
        run: |
          $proj = "_devops_toolkit/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"
          $sarifOut = "${{ inputs.sarif_name }}"
          $tmp = "sarif_parts"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          $ruleFlags = @()
          foreach ($rule in @("${{ inputs.rules }}" -split "`n")) {
            if ($rule.Trim() -ne "") { $ruleFlags += @("--rule", $rule.Trim()) }
          }

          $i = 0
          foreach ($file in Get-Content changed_files.txt) {
            $file = $file.Trim()
            if ($file) {
              $part = Join-Path $tmp ("part_$i.sarif")
              dotnet run -c ${{ inputs.configuration }} --project $proj -- `
                "$file" @ruleFlags --sarif "$part"
              $i++
            }
          }

          # Merge SARIF output
          $parts = Get-ChildItem $tmp -Filter "*.sarif"
          if ($parts.Count -eq 0) {
            Write-Host "No SARIF produced"
          } else {
            $combined = @{
              version = "2.1.0"
              schema  = "https://json.schemastore.org/sarif-2.1.0.json"
              runs = @(@{
                tool    = @{ driver = @{ name = "BHoM Compliance Runner"; version = "1.0.0"; rules = @() } }
                results = @()
              })
            }
            foreach ($p in $parts) {
              $obj = Get-Content $p.FullName -Raw | ConvertFrom-Json -Depth 100
              $run = $obj.runs[0]
              $combined.runs[0].results += $run.results
              $combined.runs[0].tool.driver.rules += $run.tool.driver.rules
            }
            $combined.runs[0].tool.driver.rules =
              ($combined.runs[0].tool.driver.rules | Group-Object id | ForEach-Object { $_.Group[0] })

            $combined | ConvertTo-Json -Depth 100 | Out-File -FilePath $sarifOut -Encoding utf8
          }

      # ------- Whole-repo scan (pushes, or no changed files) -------
      - name: Run compliance for entire repo
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.count == '0' }}
        shell: pwsh
        run: |
          $proj = "_devops_toolkit/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"
          $target = "."
          $ruleFlags = @()
          foreach ($rule in @("${{ inputs.rules }}" -split "`n")) {
            if ($rule.Trim() -ne "") { $ruleFlags += @("--rule", $rule.Trim()) }
          }
          dotnet run -c ${{ inputs.configuration }} --project $proj -- `
            "$target" @ruleFlags --sarif "${{ inputs.sarif_name }}"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.sarif_name }}