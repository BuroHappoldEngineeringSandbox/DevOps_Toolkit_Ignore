# # Runs reusable CI workflows based on repository topics (bhom-prototype | bhom-alpha | bhom-beta).
# #
# # Platform (DevOps_Toolkit): bhom-stage-matrix.json — which jobs run per stage and, when
# # compliance runs, which compliance checks (space-separated: code, copyright, documentation, project).
# # Per-repo: .github/bhom-ci.json merged over bhom-repo-defaults.json for dotnet_version,
# # configuration, test_solution, run_dataset_check (unless matrix sets it), coverage flags.
# # compliance_checks is matrix-only. Dataset compliance is ci-dataset-compliance.yml (optional job).
# #
# # Topic precedence if several are set: bhom-beta > bhom-alpha > bhom-prototype.
# # Consumer repos: trigger this workflow only (see BHoM_Engine/.github/workflows/ci.yml).

