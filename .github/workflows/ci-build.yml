name: Build

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: true
        # SDK-style: dotnet CLI. Legacy Framework: MSBuild + NuGet from resolve-dependencies.
      configuration:
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: false  # optional PAT for private deps; else github.token
      BHOM_APP_ID:
        required: false  # BHoMBot GitHub App ID — used to mint a short-lived token for dep cloning.
      BHOM_APP_PRIVATE_KEY:
        required: false  # BHoMBot GitHub App private key (PEM). Required when BHOM_APP_ID is set.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # composite action cache
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Check App credentials
        id: app-check
        shell: bash
        env:
          APP_ID: ${{ secrets.BHOM_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dependency token
        id: dep-token
        if: steps.app-check.outputs.available == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve dependencies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode: caller
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration: ${{ inputs.configuration }}
          token: ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || github.token }}

      # Prefer <RepoName>.sln at repo root; else first .sln found.
      - name: Discover primary solution
        id: solution
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $rootSln  = Join-Path (Get-Location) "$repoName.sln"

          if (Test-Path $rootSln) {
            $slnPath = $rootSln
          } else {
            $found = Get-ChildItem . -Filter *.sln -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if (-not $found) {
              Write-Host "::error title=Build::No .sln file found in repository '$repoName'."
              exit 1
            }
            $slnPath = $found.FullName
          }

          # Fail fast if packages.config is present — legacy NuGet/MSBuild is not supported.
          $legacyCount = (Get-ChildItem . -Recurse -Filter packages.config -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($legacyCount -gt 0) {
            Write-Host "::error title=Build::packages.config detected — legacy NuGet/MSBuild is not supported. Migrate all projects to SDK-style."
            exit 1
          }

          "path=$slnPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "::notice title=Solution::$slnPath"

      - name: Build (${{ inputs.configuration }})
        run: |
          $slnPath = "${{ steps.solution.outputs.path }}"
          $config  = "${{ inputs.configuration }}"

          Write-Host "::group::dotnet restore"
          dotnet restore $slnPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "::endgroup::"

          Write-Host "::group::dotnet build $config"
          dotnet build $slnPath --no-restore --configuration $config --nologo -m
          Write-Host "::endgroup::"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Build::Primary solution build failed."
            exit $LASTEXITCODE
          }

      # altConfigs.txt: one org/repo/ConfigName per line; built with dotnet build after the primary build
      # See .github/scripts/build-alt-configs.ps1 for full logic and rationale.
      # Hardcoded to the canonical DevOps_Toolkit repo so this works whether the calling repo
      # lives in the OSS org or a CSS org using the proxy pattern.
      - name: Checkout DevOps_Toolkit (build scripts)
        if: hashFiles('altConfigs.txt') != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _toolkit
          token: ${{ steps.dep-token.outputs.token || secrets.GH_TOKEN || github.token }}

      - name: Build alt configurations
        if: hashFiles('altConfigs.txt') != ''
        run: .\_toolkit\.github\scripts\build-alt-configs.ps1 -SlnPath "${{ steps.solution.outputs.path }}"
