name: Compliance (Reusable)

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: "8.0.x"

      configuration:
        type: string
        default: "Release"

      rules:
        type: string
        default: ""

permissions:
  contents: read
  security-events: write

jobs:

  # =========================================================
  # 1) Clone + build dependencies (BHoM, BHoM_Engine, BHoM_Adapter)
  # =========================================================
  build_dependencies:
    name: Build BHoM Dependencies
    runs-on: windows-latest
    env:
      DEFAULT_ORG: BuroHappoldEngineeringSandbox
      CONFIG: ${{ inputs.configuration }}

    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Prepare BHoM dependencies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/prepare-dependencies@main
        with:
          dependencies: "BHoM@develop, BHoM_Engine@develop, BHoM_Adapter@develop"
          configuration: ${{ inputs.configuration }}
          default_org: BuroHappoldEngineeringSandbox
          token: ${{ github.token }}

      - name: Upload dependency assemblies
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies-${{ github.run_attempt }}
          path: deps-assemblies/**
          if-no-files-found: warn


  # =========================================================
  # 2) Build Test_Toolkit, now that dependencies exist
  # =========================================================
  build_test_toolkit:
    name: Build Test_Toolkit
    runs-on: windows-latest
    needs: build_dependencies

    steps:
      - name: Download dependency assemblies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies-${{ github.run_attempt }}
          path: deps-assemblies

      - name: Stage dependency assemblies → ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $target = "$env:ProgramData\BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "deps-assemblies\*.dll" $target -Force
          Write-Host "Staged dependencies to $target"

      - name: Checkout Test_Toolkit
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/Test_Toolkit
          ref: main
          path: ${{ github.workspace }}/test_toolkit

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Try to restore the solution if it exists; otherwise log solutions to aid diagnostics
      - name: Restore Test_Toolkit (best-effort)
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}/test_toolkit"
          $sln = Get-ChildItem -Recurse $root -Filter "Test_Toolkit.sln" | Select-Object -First 1
          if ($sln) {
            Write-Host "Restoring solution: $($sln.FullName)"
            nuget restore $sln.FullName
          } else {
            Write-Host "Test_Toolkit.sln not found; available solutions under test_toolkit:"
            Get-ChildItem -Recurse $root -Filter *.sln | ForEach-Object { " - $($_.FullName)" }
          }

      # Build CodeComplianceTest_Engine by discovering its exact csproj path
      - name: Build CodeComplianceTest_Engine (dynamic)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse "${{ github.workspace }}/test_toolkit" -Filter "CodeComplianceTest_Engine.csproj" | Select-Object -First 1
          if (-not $proj) {
            Write-Host "Could not find CodeComplianceTest_Engine.csproj under test_toolkit. Projects present:"
            Get-ChildItem -Recurse "${{ github.workspace }}/test_toolkit" -Filter *.csproj | ForEach-Object { " - $($_.FullName)" }
            throw "CodeComplianceTest_Engine.csproj not found."
          }

          Write-Host "Building project: $($proj.FullName)"
          msbuild $proj.FullName /p:Configuration=${{ inputs.configuration }} /m /nologo /verbosity:minimal

      # Discover a bin/<Configuration> folder irrespective of TFMs (e.g., net48) or platform (x64)
      - name: Collect Test_Toolkit assemblies (dynamic bin path)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse "${{ github.workspace }}/test_toolkit" -Filter "CodeComplianceTest_Engine.csproj" | Select-Object -First 1
          if (-not $proj) { throw "CodeComplianceTest_Engine.csproj not found in collection step." }

          # Find bin folders that contain the chosen configuration
          $binCandidates = Get-ChildItem -Recurse $proj.Directory.FullName -Directory -Filter "bin" |
            ForEach-Object { Get-ChildItem -Recurse $_.FullName -Directory -Filter "${{ inputs.configuration }}" } |
            Select-Object -ExpandProperty FullName -Unique

          if (-not $binCandidates) {
            Write-Host "No 'bin/${{ inputs.configuration }}' folder found under: $($proj.Directory.FullName)"
            Write-Host "Listing all 'bin' folders under project:"
            Get-ChildItem -Recurse $proj.Directory.FullName -Directory -Filter "bin" | ForEach-Object { " - $($_.FullName)" }
            throw "Build did not produce an expected bin path."
          }

          # Prefer the shallowest match (closest to the project directory)
          $bin = ($binCandidates | Sort-Object { $_.Length })[0]
          Write-Host "Using bin path: $bin"

          $out = "${{ github.workspace }}/test-toolkit-assemblies"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Copy DLLs from the discovered bin folder (including nested TFMs)
          Get-ChildItem -Recurse $bin -Filter *.dll | Copy-Item -Destination $out -Force

          Write-Host "Toolkit assemblies:"
          Get-ChildItem $out -Filter *.dll | ForEach-Object { " - $($_.Name)" }

      - name: Upload Test_Toolkit assemblies
        uses: actions/upload-artifact@v4
        with:
          name: test-toolkit-assemblies-${{ github.run_attempt }}
          path: ${{ github.workspace }}/test-toolkit-assemblies/**
          if-no-files-found: error


  # =========================================================
  # 3) Run ComplianceRunner
  # =========================================================
  compliance:
    name: Compliance Checks
    runs-on: windows-latest
    needs: build_test_toolkit

    steps:
      - name: Checkout target repo (caller)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies-${{ github.run_attempt }}
          path: deps-assemblies

      - name: Download Test_Toolkit assemblies
        uses: actions/download-artifact@v4
        with:
          name: test-toolkit-assemblies-${{ github.run_attempt }}
          path: toolkit

      - name: Stage all assemblies → ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $target = "$env:ProgramData\BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item "deps-assemblies/*.dll" $target -Force -ErrorAction SilentlyContinue
          Copy-Item "toolkit/*.dll"        $target -Force

          Write-Host "Staged assemblies to $target"
          Get-ChildItem $target -Filter *.dll | Select-Object -First 25 | % { " - " + $_.Name }

      - name: Checkout DevOps_Toolkit (ComplianceRunner)
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: devops

      - name: Build ComplianceRunner
        working-directory: devops/src/Compliance/ComplianceRunner
        run: dotnet build -c ${{ inputs.configuration }} --nologo


      # -------------------------
      # PR mode: only changed files
      # -------------------------
      - name: Detect changed .cs files
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD -- '*.cs' > changed.txt
          echo "count=$(wc -l < changed.txt)" >> $env:GITHUB_OUTPUT

      - name: Run compliance on changed files
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.count != '0' }}
        shell: pwsh
        run: |
          $proj = "devops/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim()) { $rules += @("--rule", $r.Trim()) }
          }

          $temp = "sarif_parts"
          mkdir $temp -Force | Out-Null

          $i = 0
          foreach ($file in Get-Content changed.txt) {
            if ($file.Trim()) {
              $out = "$temp/part_$i.sarif"
              dotnet run -c ${{ inputs.configuration }} --project $proj -- "$file" @rules --sarif "$out"
              $i++
            }
          }

          # Merge SARIF parts
          $combined = @{
            version = "2.1.0"
            $schema = "https://json.schemastore.org/sarif-2.1.0.json"
            runs = @(@{
              tool = @{ driver = @{ name = "BHoM Compliance Runner"; version = "1.0.0"; rules = @() } }
              results = @()
            })
          }

          foreach ($p in Get-ChildItem $temp -Filter "*.sarif") {
            $json = Get-Content $p.FullName -Raw | ConvertFrom-Json -Depth 100
            $combined.runs[0].results += $json.runs[0].results
            $combined.runs[0].tool.driver.rules += $json.runs[0].tool.driver.rules
          }

          $combined.runs[0].tool.driver.rules =
            ($combined.runs[0].tool.driver.rules | Group-Object id | ForEach-Object { $_.Group[0] })

          $combined | ConvertTo-Json -Depth 100 | Out-File compliance.sarif -Encoding utf8


      # -------------------------
      # Full repo scan
      # -------------------------
      - name: Run full compliance
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.count == '0' }}
        shell: pwsh
        run: |
          $proj = "devops/src/Compliance/ComplianceRunner/ComplianceRunner.csproj"

          $rules = @()
          foreach ($r in @("${{ inputs.rules }}" -split "`n")) {
            if ($r.Trim()) { $rules += @("--rule", $r.Trim()) }
          }

          dotnet run -c ${{ inputs.configuration }} --project $proj -- "." @rules --sarif "compliance.sarif"


      # -------------------------
      # Upload SARIF
      # -------------------------
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif