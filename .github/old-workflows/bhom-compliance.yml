name: BHoM Compliance

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK versions to install (first must cover your target, e.g., 10.x)"
        required: false
        type: string
        default: |
          10.x
          8.x
      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"
      runner_project:
        description: "Path to the ComplianceRunner .csproj inside the caller repo"
        required: false
        type: string
        default: ".ci/tools/ComplianceRunner/ComplianceRunner.csproj"
      target_path:
        description: "Path to scan (file or folder). Defaults to repo root"
        required: false
        type: string
        default: "."
      only_rule:
        description: "Optional: run a single rule by name"
        required: false
        type: string
        default: ""
      verbose:
        description: "Enable verbose diagnostics"
        required: false
        type: string
        default: "false"
      sarif_output:
        description: "Where to write SARIF"
        required: false
        type: string
        default: "compliance.sarif"
      token:
        description: "Token for cloning private repos (PAT preferred). Falls back to GITHUB_TOKEN if omitted."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  security-events: write   # required to upload SARIF to Code Scanning

jobs:
  deps:
    name: Build Dependencies (fixed order)
    runs-on: windows-latest
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      DEP_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}

    steps:
      - name: Setup .NET SDK(s)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Prepare folders
        shell: pwsh
        run: |
          mkdir -Force deps | Out-Null
          mkdir -Force deps-assemblies | Out-Null

      # ---- Fixed dependency list & order (Org-owned) ----
      - name: Declare dependency list (ordered)
        id: depslist
        shell: pwsh
        run: |
          # Permanent, org-internal, fixed build order:
          $repos = @(
            "BuroHappoldEngineeringSandbox/BHoM",
            "BuroHappoldEngineeringSandbox/BHoM_Engine",
            "BuroHappoldEngineeringSandbox/BHoM_Adapter",
            "BuroHappoldEngineeringSandbox/Test_Toolkit"
          )
          "repos=" + ($repos | ConvertTo-Json -Compress) >> $env:GITHUB_OUTPUT

      - name: Clone repos in declared order
        shell: pwsh
        run: |
          $repos = ConvertFrom-Json '${{ steps.depslist.outputs.repos }}'
          foreach ($repo in $repos) {
            Write-Host "::group::Cloning $repo"
            $name = $repo.Split('/')[1]
            $url  = "https://x-access-token:$env:DEP_TOKEN@github.com/$repo.git"
            git clone --depth 1 $url "deps/$name"
            Write-Host "::endgroup::"
          }

      - name: Build repos in declared order
        shell: pwsh
        run: |
          $repos = ConvertFrom-Json '${{ steps.depslist.outputs.repos }}'
          foreach ($repo in $repos) {
            $name = $repo.Split('/')[1]
            $dir  = Join-Path "deps" $name
            Write-Host "::group::Building $name"
            dotnet build $dir -c $env:CONFIGURATION
            Write-Host "::endgroup::"
          }

      - name: Collect all dependency DLLs
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem "deps" -Directory) {
            $dlls = Get-ChildItem "$($dir.FullName)\**\bin\$env:CONFIGURATION\*.dll" -Recurse -ErrorAction SilentlyContinue
            foreach ($dll in $dlls) {
              Copy-Item $dll.FullName "deps-assemblies" -Force
            }
          }
          Write-Host "Collected assemblies:"
          Get-ChildItem "deps-assemblies" -Filter *.dll | Sort-Object Name | Select-Object -First 60 | ForEach-Object { $_.Name }

      - name: Upload dependency assemblies (artifact for this run)
        uses: actions/upload-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies/**
          if-no-files-found: error

  compliance:
    name: Run Compliance
    runs-on: windows-latest
    needs: [deps]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK(s)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Download dependency assemblies
        uses: actions/download-artifact@v4
        with:
          name: deps-assemblies
          path: deps-assemblies

      - name: Stage DLLs to ProgramData\BHoM\Assemblies
        shell: pwsh
        run: |
          $src = "deps-assemblies"
          $dst = Join-Path $env:ProgramData "BHoM\Assemblies"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $src "*.dll") $dst -Force -ErrorAction SilentlyContinue
          "Staged to: $dst"
          Get-ChildItem $dst -Filter *.dll | Sort-Object Name | Select-Object -First 40 | ForEach-Object { $_.Name }

      - name: Verify CodeComplianceTest_Engine.dll
        shell: pwsh
        run: |
          $dll = Join-Path $env:ProgramData "BHoM\Assemblies\CodeComplianceTest_Engine.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Required Test Toolkit assembly not found: $dll"
            exit 1
          } else {
            Write-Host "Found Test Toolkit assembly: $dll"
          }

      - name: Verify ComplianceRunner project exists
        shell: pwsh
        run: |
          $proj = "${{ inputs.runner_project }}"
          if (-not (Test-Path $proj)) {
            Write-Error "ComplianceRunner project not found at: $proj"
            if (Test-Path ".ci") {
              Write-Host "Listing .ci for debugging:"; Get-ChildItem -Path ".ci" -Recurse -File | ForEach-Object { $_.FullName }
            }
            exit 1
          } else {
            Write-Host "Found ComplianceRunner project: $proj"
          }

      - name: Build ComplianceRunner
        run: dotnet build "${{ inputs.runner_project }}" -c ${{ inputs.configuration }}

      - name: Run ComplianceRunner (emit SARIF)
        shell: pwsh
        run: |
          $args = @()
          $args += "${{ inputs.target_path }}"
          if ("${{ inputs.only_rule }}") { $args += "--rule";   $args += "${{ inputs.only_rule }}" }
          if ("${{ inputs.verbose }}".ToLower() -eq "true") { $args += "--verbose" }
          if ("${{ inputs.sarif_output }}") { $args += "--sarif"; $args += "${{ inputs.sarif_output }}" }

          Write-Host "Args: $args"
          dotnet run --project "${{ inputs.runner_project }}" -c ${{ inputs.configuration }} -- %args%

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-sarif
          path: ${{ inputs.sarif_output }}
          if-no-files-found: warn

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.sarif_output }}