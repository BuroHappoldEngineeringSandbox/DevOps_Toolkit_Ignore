name: BHoM Compliance

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        default: "10.x"
      configuration:
        type: string
        default: "Release"
      compliance_checks:
        type: string
        default: "code copyright documentation"
        # Space-separated list of checks to run.
        # Valid values: code, copyright, documentation
        # Example — skip copyright for non-BHoM orgs: "code documentation"
    secrets:
      GH_TOKEN:
        required: false   # PAT for cloning private dependency repositories; falls back to github.token

jobs:
  compliance:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
    defaults:
      run:
        shell: pwsh

    steps:
      # ── 1. Checkout caller with full history (needed for git diff on PRs) ──────
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Resolve and build Test_Toolkit + its transitive dependencies ────────
      #       Uses mode=seeds so only Test_Toolkit's graph is built — not the
      #       calling repo's own dependencies (compliance does not need those).
      - name: Resolve dependencies (Test_Toolkit graph)
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN }}

      # ── 3. Stage built assemblies to C:\ProgramData\BHoM\Assemblies ───────────
      #       On a cache hit the DLLs are in deps-assemblies/ but not yet in
      #       ProgramData; this step restores them so ComplianceRunner can compile.
      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: deps-assemblies

      # ── 4. Check out DevOps_Toolkit to publish the ComplianceRunner and scripts ─
      - name: Checkout DevOps_Toolkit (runner source + scripts)
        uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/DevOps_Toolkit
          ref: main
          path: _toolkit

      # ── 5. Publish ComplianceRunner (HintPath DLLs now present in ProgramData) ─
      - name: Publish ComplianceRunner
        run: |
          $proj = "_toolkit\src\Compliance\ComplianceRunner\ComplianceRunner.csproj"
          if (-not (Test-Path $proj)) {
            Write-Error "ComplianceRunner project not found at: $proj"
            exit 1
          }
          dotnet publish $proj -c ${{ inputs.configuration }} -o out\runner

      # ── 6. Determine which C# files changed in this PR ───────────────────────
      - name: Compute changed C# files
        id: changed
        run: |
          & "_toolkit\.github\workflows\checks\compliance\scripts\Get-ChangedFiles.ps1" `
              -EventName "${{ github.event_name }}" `
              -BaseRef   "${{ github.base_ref }}"

      # ── 7. Run each requested compliance check in its own log group ──────────
      - name: Run compliance checks
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          & "_toolkit\.github\workflows\checks\compliance\scripts\Run-Compliance.ps1" `
              -Runner           "out\runner\ComplianceRunner.exe" `
              -ChangedFilesPath "changed_files.txt" `
              -Checks           "${{ inputs.compliance_checks }}"

      # ── 8. Upload SARIF results to GitHub Code Scanning ──────────────────────
      - name: Upload SARIF
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: compliance.sarif
          category:   bhom-compliance-pr-delta
