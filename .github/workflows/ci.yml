name: BHoM CI (Orchestrator)

on:
  workflow_call:
    inputs:
      dotnet_version:   { type: string,  default: "10.x" }
      configuration:    { type: string,  default: "Release" }
      test_solution:    { type: string,  default: ".ci/tests/UnitTests/UnitTests.sln" }
      extra_repos:      { type: string,  default: "" }
      token:            { type: string,  default: "" }   # only if private deps
      test_max_cpu:     { type: number,  default: 4 }
      coverage_on_push: { type: boolean, default: false }

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~\AppData\Local\Microsoft\MSBuild\Cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # --- NEW: resolve and build dependencies using the composite action (runs in this job) ---
      - name: Resolve Dependencies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          deps_file: "dependencies.txt"             # keep default or override
          extra_repos: ${{ inputs.extra_repos }}
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration: ${{ inputs.configuration }}
          token: ${{ inputs.token }}

      # No need to download deps-assemblies artifact in this job — the action produced it locally.

      - name: Stage assemblies
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: "deps-assemblies"

      - name: Verify test solution
        run: |
          if (-not (Test-Path "${{ inputs.test_solution }}")) { Write-Error "Missing: ${{ inputs.test_solution }}"; exit 1 }

      - name: Restore
        run: dotnet restore "${{ inputs.test_solution }}"

      - name: Build (${{ inputs.configuration }})
        run: dotnet build "${{ inputs.test_solution }}" --no-restore -c ${{ inputs.configuration }}

      - name: Test (no coverage on push)
        if: github.event_name != 'pull_request' && inputs.coverage_on_push == false
        run: >
          dotnet test "${{ inputs.test_solution }}" --no-build -c ${{ inputs.configuration }}
          --verbosity normal -m:${{ inputs.test_max_cpu }}
          --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Test (with coverage)
        if: github.event_name == 'pull_request' || inputs.coverage_on_push == true
        continue-on-error: true
        run: >
          dotnet test "${{ inputs.test_solution }}" --no-build -c ${{ inputs.configuration }}
          --verbosity normal -m:${{ inputs.test_max_cpu }}
          --logger "trx;LogFileName=tests.trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          retention-days: 7

      - name: Upload raw coverage (Cobertura XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 7

      - name: Install ReportGenerator
        if: github.event_name == 'pull_request' || inputs.coverage_on_push == true
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Create coverage summary
        if: github.event_name == 'pull_request' || inputs.coverage_on_push == true
        run: reportgenerator -reports:"**/TestResults/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"MarkdownSummaryGithub;Cobertura"

      - name: Add summary
        if: (github.event_name == 'pull_request' || inputs.coverage_on_push == true) && always()
        run: |
          if (Test-Path "coverage-report/SummaryGithub.md") {
            Get-Content "coverage-report/SummaryGithub.md" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

  publish_test_results:
    name: Publish Unit Test Results (PR Check)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        with:
          trx_files: "test-results/**/*.trx"