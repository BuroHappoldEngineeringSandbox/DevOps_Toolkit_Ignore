name: "Resolve BHoM Dependencies"
description: |
  Resolves, builds, and caches BHoM dependency assemblies for a caller repo.
  Repos are cloned to an isolated root (C:\bhom-deps\) outside the workspace,
  built with the configured SDK, and their DLLs staged to ProgramData\BHoM\Assemblies
  via each repo's own PostBuildEvent. Supports caller-graph and seeds modes.

inputs:
  deps_file:
    description: "Path to the caller repo's dependencies.txt (used when mode=caller)"
    required: false
    default: "dependencies.txt"

  dotnet_version:
    description: "dotnet SDK version to build dependencies with (e.g. '8.0'). Pinned via global.json at the clone root so all dep builds use this version regardless of other SDKs installed on the runner."
    required: false
    default: "8.0"

  configuration:
    description: "Build configuration (Release/Debug)"
    required: false
    default: "Release"

  token:
    description: "GitHub token or PAT for private dependency repositories"
    required: false
    default: ""

  mode:
    description: |
      Dependency resolution mode:
        - caller  → build only the caller repo's dependency graph (default)
        - seeds   → build only the chosen seed repo(s) and their graphs
    required: false
    default: "caller"

  seeds:
    description: "Used when mode=seeds. Newline-separated owner/repo[@ref] list."
    required: false
    default: ""

  additional_seeds:
    description: |
      Only meaningful when mode=caller. Newline-separated owner/repo[@ref] list of
      extra seed repos to resolve and build in addition to the caller's dependencies.txt
      graph. Useful when a job needs both the caller's own dependency assemblies AND
      a fixed set of infrastructure repos (e.g. Test_Toolkit + Versioning_Toolkit for
      data-driven unit tests). Ignored when mode=seeds.
    required: false
    default: ""

runs:
  using: "composite"

  # Note: uses cache/restore + cache/save pairs (not actions/cache) because the
  # post-step auto-save of actions/cache does not fire in cross-repo composite actions.

  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: "6.x"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet cache
      id: nuget-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        # dotnet_version intentionally excluded: NuGet package binaries are SDK-version-agnostic
        # for the .NET Framework and net8.0 targets used by BHoM repos.
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Prepare folders
      shell: pwsh
      run: |
        # deps/ — metadata only (_shas.txt, _order.txt, _selection.txt)
        New-Item -ItemType Directory -Force -Path deps | Out-Null
        New-Item -ItemType File   -Force -Path deps/_shas.txt | Out-Null
        if (Test-Path deps/_order.txt)     { Remove-Item deps/_order.txt -Force }
        if (Test-Path deps/_selection.txt) { Remove-Item deps/_selection.txt -Force }

        # C:\bhom-deps\ — isolated clone root, sits at the drive root so no caller
        # repo Directory.Build.props exists above it. Each dependency repo builds
        # with only its own MSBuild configuration.
        New-Item -ItemType Directory -Force -Path "C:\bhom-deps" | Out-Null

        # Pin the dotnet SDK for all builds under C:\bhom-deps\. setup-dotnet installs
        # a SDK but dotnet selects the highest installed version at invocation time
        # unless a global.json is present. rollForward latestMinor accepts any patch.
        $sdkVersion = "${{ inputs.dotnet_version }}"
        if ($sdkVersion -match '^\d+\.\d+$') { $sdkVersion = "$sdkVersion.0" }
        [ordered]@{ sdk = [ordered]@{ version = $sdkVersion; rollForward = "latestMinor" } } `
            | ConvertTo-Json | Set-Content "C:\bhom-deps\global.json" -Encoding utf8

        # BHoM PostBuildEvent xcopy targets this path. Must exist before any build.
        New-Item -ItemType Directory -Force -Path "$env:ProgramData\BHoM\Assemblies" | Out-Null

    - name: Resolve dependency graph
      shell: pwsh
      env:
        PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        DEP_TOKEN: ${{ inputs.token }}
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Resolve-DependencyGraph.ps1"

        & $script `
          -DepsFile "${{ inputs.deps_file }}" `
          -Mode "${{ inputs.mode }}" `
          -Seeds "${{ inputs.seeds }}" `
          -AdditionalSeeds "${{ inputs.additional_seeds }}" `
          -CloneRoot "C:\bhom-deps"

    - name: Compute cache key from dependency SHAs
      id: shas
      shell: pwsh
      run: |
        if (-not (Test-Path 'deps/_shas.txt')) {
          "keypart=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }

        $pairs = Get-Content 'deps/_shas.txt' | Where-Object { $_ -match '\S+\s+[0-9a-f]+' }
        $keypart = ($pairs | Sort-Object | ForEach-Object {
            $s = $_.Trim().Split(" ")
            "$($s[0])@$($s[1])"
        }) -join ';'

        "keypart=$keypart" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # cache-hit is true only on an exact key match. A restore-key (prefix) match
    # restores a stale cache but leaves cache-hit false, triggering a rebuild.
    # Skipped entirely when keypart is empty (no dependencies to build or cache).
    - name: Restore assembly cache
      id: cache
      if: steps.shas.outputs.keypart != ''
      uses: actions/cache/restore@v4
      with:
        path: C:\ProgramData\BHoM\Assemblies
        key: depsasm-${{ runner.os }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}
        restore-keys: |
          depsasm-${{ runner.os }}-${{ inputs.configuration }}-

    - name: Build dependencies
      if: steps.shas.outputs.keypart != '' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $script = Join-Path $env:GITHUB_ACTION_PATH "scripts/Build-Dependencies.ps1"
        & $script -Configuration "${{ inputs.configuration }}" -CloneRoot "C:\bhom-deps"

    - name: Save assembly cache
      if: steps.shas.outputs.keypart != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\ProgramData\BHoM\Assemblies
        key: depsasm-${{ runner.os }}-${{ inputs.configuration }}-${{ steps.shas.outputs.keypart }}

    - name: Save NuGet cache
      if: steps.nuget-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.nuget/packages
          ~\AppData\Local\Microsoft\MSBuild\Cache
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj','**/global.json','**/nuget.config') }}

