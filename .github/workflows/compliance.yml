name: Compliance

on:
  workflow_call:
    inputs:
      dotnet_version:
        type: string
        required: false
        default: "8.x"
      configuration:
        type: string
        required: false
        default: "Release"
      compliance_checks:
        type: string
        required: false
        default: "code copyright documentation project"
        # Space-separated list of compliance checks to run.
        # Valid values: code, copyright, documentation, project
        # Example — code only: "code"
      run_dataset_check:
        type: boolean
        required: false
        default: false
        # Set to true for repos that contain a datasets/ folder.
        # Runs IsValidDataset against every changed .json file under datasets/.
    secrets:
      GH_TOKEN:
        required: false   # PAT for cloning private dependency repositories; falls back to github.token

jobs:
  # ── Compliance check ──────────────────────────────────────────────────────
  compliance:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
      actions: write            # required for cache save in cross-repo composite actions
    defaults:
      run:
        shell: pwsh

    steps:
      # Shallow checkout — only enough history to reach the base commit.
      # fetch-depth:1 + targeted fetch is faster than full history for
      # large repos, yet gives git diff everything it needs.
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Detect relevant changed files BEFORE any expensive work.
      # Gates all subsequent heavy steps so PRs that only touch YAML/docs
      # exit in seconds without building Test_Toolkit at all.
      #
      # Uses the exact PR base SHA (not the branch name) with a two-dot
      # diff to avoid "no merge base" failures on shallow clones.
      # Three-dot diff (origin/branch...HEAD) requires a common ancestor
      # in the shallow graph, which is unavailable with fetch-depth:1.
      - name: Compute changed files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — compliance checks skipped."
            exit 0
          }

          # Fetch the exact commit the PR was opened from — depth=1 is enough
          # because we diff directly against this SHA (no merge-base lookup needed).
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object { $_.ToLower().EndsWith(".cs") -or $_.ToLower().EndsWith(".csproj") }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count relevant file(s) changed — running compliance."
            Get-Content changed_files.txt
          } else {
            Write-Host "::notice::No relevant files changed (.cs / .csproj) — skipping compliance."
          }

      # Resolve and build Test_Toolkit + its transitive dependencies.
      # Skipped entirely when no relevant files changed (saves 3–5 min).
      # MIGRATION: 'uses:' does not support expressions — org name must be a
      # literal. Update 'BuroHappoldEngineeringSandbox' to the prod org name
      # when promoting this workflow to production.
      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN }}

      # Stage built assemblies to C:\ProgramData\BHoM\Assemblies.
      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: deps-assemblies

      # Prepare ComplianceRunner.
      # Checks out DevOps_Toolkit, restores or builds the runner binary
      # with SHA-keyed caching, and outputs the exe path.
      - name: Prepare ComplianceRunner
        if: steps.changed.outputs.count != '0'
        id: runner
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/prepare-runner@main
        with:
          runner_project: src/ComplianceRunner/ComplianceRunner.csproj
          output_dir:     out\runner
          configuration:  ${{ inputs.configuration }}
          cache_prefix:   compliance-runner

      # Run each requested compliance check in its own log group.
      - name: Run compliance checks
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runner = "${{ steps.runner.outputs.runner_exe }}"

          # @() ensures a [string[]] even when only one file changed —
          # prevents PowerShell splatting the string character-by-character.
          $fileList = @(Get-Content changed_files.txt | ForEach-Object { $_ -replace '/', '\' })

          $checks = @("${{ inputs.compliance_checks }}" -split ' ' | Where-Object { $_ -ne '' })

          # Repository URL needed by the project compliance check (mirrors BHoMBot).
          $orgUrl = "${{ github.server_url }}/${{ github.repository }}"

          Write-Host "::notice title=Compliance checks::Running: $($checks -join ', ')"

          $anyFailure     = 0
          $sarifGenerated = "false"
          $checkResults   = [System.Collections.Generic.List[hashtable]]::new()

          foreach ($check in $checks) {
            Write-Host "::group::BHoM $check compliance"
            & $runner $check --output github --org-url "$orgUrl" @fileList
            $ok = ($LASTEXITCODE -eq 0)
            if (-not $ok) { $anyFailure = 1 }
            Write-Host "::endgroup::"
            $checkResults.Add(@{ Check=$check; Ok=$ok })
          }

          # SARIF is only meaningful for the 'code' check (Roslyn diagnostics).
          if ($checks -contains "code") {
            Write-Host "::group::SARIF export (code)"
            & $runner code --output sarif --sarif-file compliance.sarif --org-url "$orgUrl" @fileList
            if ($LASTEXITCODE -eq 0) { $sarifGenerated = "true" }
            Write-Host "::endgroup::"
          }

          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            $mdLines = @("### Compliance check results", "", "| Check | Result |", "|---|---|")
            foreach ($r in $checkResults) {
              $icon   = if ($r.Ok) { ":white_check_mark:" } else { ":x:" }
              $status = if ($r.Ok) { "Passed" } else { "**Failed**" }
              $mdLines += "| $($r.Check) | $icon $status |"
            }
            $mdLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if ($anyFailure -ne 0) {
            Write-Host "::error::One or more compliance checks failed."
            exit 1
          }

      # Upload SARIF results to GitHub Code Scanning.
      - name: Upload SARIF
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: compliance.sarif
          category:   bhom-compliance-pr-delta


  # ── Dataset compliance check ──────────────────────────────────────────────
  #    Opt-in via run_dataset_check: true — only needed for repos with a
  #    datasets/ folder. Runs IsValidDataset against every changed .json file
  #    under any datasets/ path in the PR diff.
  dataset:
    if: inputs.run_dataset_check
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write   # required for SARIF upload
      actions: write            # required for cache save in cross-repo composite actions
    defaults:
      run:
        shell: pwsh

    steps:
      # Shallow checkout.
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Detect changed dataset files BEFORE any expensive work.
      # Filters for .json files whose repo-relative path contains /datasets/,
      # mirroring the IsDatasetFile predicate in DatasetComplianceRunner.cs.
      - name: Compute changed dataset files
        id: changed
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "count=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::Not a pull request — dataset check skipped."
            exit 0
          }

          $baseSha = "${{ github.event.pull_request.base.sha }}"
          git fetch --depth=1 origin $baseSha

          $files = git diff --name-only --diff-filter=ACMRT "$baseSha" HEAD |
                   Where-Object {
                     $_.ToLower().EndsWith(".json") -and
                     $_.Replace('\', '/').ToLower() -match '/datasets/'
                   }

          $count = ($files | Measure-Object).Count
          $files -join "`n" | Out-File changed_dataset_files.txt -Encoding utf8

          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($count -gt 0) {
            Write-Host "::notice::$count dataset file(s) changed — running dataset compliance."
            Get-Content changed_dataset_files.txt
          } else {
            Write-Host "::notice::No changed dataset files detected — skipping dataset compliance."
          }

      # Resolve and build Test_Toolkit + its transitive dependencies.
      # MIGRATION: 'uses:' does not support expressions — org name must be a
      # literal. Update 'BuroHappoldEngineeringSandbox' to the prod org name
      # when promoting this workflow to production.
      - name: Resolve dependencies (Test_Toolkit graph)
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/resolve-dependencies@main
        with:
          mode:           seeds
          seeds:          BHoM/Test_Toolkit
          dotnet_version: ${{ inputs.dotnet_version }}
          configuration:  ${{ inputs.configuration }}
          token:          ${{ secrets.GH_TOKEN }}

      # Stage built assemblies to C:\ProgramData\BHoM\Assemblies.
      - name: Stage assemblies to ProgramData\BHoM\Assemblies
        if: steps.changed.outputs.count != '0'
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/bhom-stage-assemblies@main
        with:
          source: deps-assemblies

      # Prepare DatasetComplianceRunner.
      # Checks out DevOps_Toolkit, restores or builds the runner binary
      # with SHA-keyed caching, and outputs the exe path.
      - name: Prepare DatasetComplianceRunner
        if: steps.changed.outputs.count != '0'
        id: runner
        uses: BuroHappoldEngineeringSandbox/DevOps_Toolkit/.github/actions/prepare-runner@main
        with:
          runner_project: src/DatasetComplianceRunner/DatasetComplianceRunner.csproj
          output_dir:     out\dataset-runner
          configuration:  ${{ inputs.configuration }}
          cache_prefix:   dataset-runner

      # Run dataset compliance.
      - name: Run dataset compliance
        id: run_checks
        if: steps.changed.outputs.count != '0'
        run: |
          $runner = "${{ steps.runner.outputs.runner_exe }}"

          $fileList = @(Get-Content changed_dataset_files.txt | ForEach-Object { $_ -replace '/', '\' })

          Write-Host "::group::BHoM dataset compliance"
          & $runner --output github @fileList
          $ok = ($LASTEXITCODE -eq 0)
          Write-Host "::endgroup::"

          # Always export SARIF for dataset results so they appear in Code Scanning.
          Write-Host "::group::SARIF export (dataset)"
          & $runner --output sarif --sarif-file dataset-compliance.sarif @fileList
          $sarifGenerated = ($LASTEXITCODE -eq 0).ToString().ToLower()
          Write-Host "::endgroup::"

          "sarif_generated=$sarifGenerated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_STEP_SUMMARY) {
            $icon   = if ($ok) { ":white_check_mark:" } else { ":x:" }
            $status = if ($ok) { "Passed" } else { "**Failed**" }
            @(
              "### Dataset compliance check results",
              "",
              "| Check | Result |",
              "|---|---|",
              "| dataset | $icon $status |"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if (-not $ok) {
            Write-Host "::error::Dataset compliance check failed."
            exit 1
          }

      # Upload SARIF results to GitHub Code Scanning.
      - name: Upload SARIF
        if: steps.changed.outputs.count != '0' && steps.run_checks.outputs.sarif_generated == 'true' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dataset-compliance.sarif
          category:   bhom-dataset-compliance-pr-delta
