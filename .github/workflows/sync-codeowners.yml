name: Sync CODEOWNERS

# Manually triggered — run this once team assignments have settled to open
# PRs that update .github/CODEOWNERS in each target repo to reflect the
# current GitHub team assignments.
#
# PRs are opened as the DevOps GitHub App. Each PR targets the repo's
# develop branch and must be reviewed and merged by the platform team
# (who are the CODEOWNERS of .github/ in every repo).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to target (e.g. BHoM_Adapter). Leave blank for all BHoM repos.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run — list affected repos without opening PRs'
        type: boolean
        required: false
        default: false

# Never cancel a sync mid-flight; a partial run leaves repos in
# inconsistent states. Let the current run finish before starting another.
concurrency:
  group: sync-codeowners
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # DevOps_Toolkit checkout only; target repo writes use app token.

    steps:
      - name: Checkout DevOps_Toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      # Generates a short-lived installation token (1 h) scoped to the org.
      # Required secrets (set at org level in DevOps_Toolkit):
      #   BHOM_APP_ID          — GitHub App ID (numeric, from App settings page)
      #   BHOM_APP_PRIVATE_KEY — PEM private key generated for the App
      #
      # The App needs these permissions installed on each target repo:
      #   Repository: Contents (read & write), Pull requests (read & write)
      #   Organisation: Members (read)  ← required to query team-to-repo assignments
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve target repos
        id: repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SINGLE_REPO: ${{ inputs.repo }}
        run: |
          if [ -n "${SINGLE_REPO}" ]; then
            echo "${SINGLE_REPO}" > repo-list.txt
            echo "::notice::Single-repo mode — targeting ${SINGLE_REPO}."
          else
            for topic in bhom-prototype bhom-alpha bhom-beta; do
              gh api "search/repositories?q=org:${ORG}+topic:${topic}&per_page=100" \
                --paginate \
                --jq '.items[] | select(.archived == false) | .name'
            done \
              | sort -u \
              | grep -v "^DevOps_Toolkit$" \
              > repo-list.txt

            COUNT=$(wc -l < repo-list.txt | tr -d ' ')
            echo "::notice::${COUNT} target repo(s) found."
          fi

      - name: Sync CODEOWNERS
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: bash .github/scripts/sync-codeowners.sh repo-list.txt
